name: Finalize Prompt08 finite generated artifacts
on:
  push:
    branches: [feat/associative-family-v6-head-architecture-20261003]
    paths: [.github/workflows/prompt08-finalize-generated.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Reproduce and publish exact finite planning frame
        run: |
          set -euo pipefail
          node --max-old-space-size=6144 scripts/build-associative-v6-queue-organization.mjs
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          for p,h in json.loads(Path('audit/associative-family-v6/prompt08-coverage-20261005/planning-expected-git-blobs.json').read_bytes()).items():
              assert subprocess.check_output(['git','hash-object',p]).decode().strip()==h,p
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'audit/associative-family-v6/prompt08-coverage-20261005/planning'
          git commit -m 'feat(v6): publish exact current planning artifacts from saved finite source routes'
          git push origin HEAD:refs/heads/feat/associative-family-v6-head-architecture-20261003
          git rev-parse HEAD > /tmp/p08-application-sha
          
      - name: Serial full tests, independent audits, byte replay and durable validation
        run: |
          set -euo pipefail
          export V='audit/associative-family-v6/prompt08-coverage-20261005/validation'
          mkdir -p "$V"
          run () { label="$1"; shift; "$@" > "$V/$label.log" 2>&1 || { tail -n 100 "$V/$label.log"; exit 1; }; }
          run targeted node --test tests/associative-family-v6*.test.mjs
          run npm-test npm test
          run v6-integrity node --max-old-space-size=6144 scripts/audit-associative-family-v6.mjs associativvordes/family-index-v6/generated "$V/v6-integrity.json"
          run coverage-source python scripts/audit-associative-v6-candidate-coverage.py
          run history python scripts/audit-associative-v6-history-certification.py
          run planning node --max-old-space-size=6144 scripts/audit-associative-v6-queue-organization.mjs
          run frozen python scripts/validate-associative-v6-frozen-stages.py
          run migration-replay node --max-old-space-size=6144 scripts/build-associative-family-v6.mjs /tmp/p08-migration-replay
          run coverage-replay python scripts/measure-associative-v6-candidate-coverage.py /tmp/p08-coverage-replay
          run lifecycle-replay node scripts/build-associative-v6-packet-lifecycle.mjs /tmp/p08-lifecycle-replay
          run planning-replay node --max-old-space-size=6144 scripts/build-associative-v6-queue-organization.mjs /tmp/p08-planning-replay
          run certification-replay node scripts/build-associative-v6-history-certification.mjs /tmp/p08-certification-replay
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,re,subprocess
          R=Path('audit/associative-family-v6/prompt08-coverage-20261005/');V=R/'validation';replays=[]
          for name,a,b in [('migration',Path('associativvordes/family-index-v6/generated'),Path('/tmp/p08-migration-replay')),('coverage',R/'research-coverage',Path('/tmp/p08-coverage-replay')),('packet-lifecycle',R/'packet-lifecycle',Path('/tmp/p08-lifecycle-replay')),('planning',R/'planning',Path('/tmp/p08-planning-replay')),('certification',R/'certification',Path('/tmp/p08-certification-replay'))]:
              files={str(p.relative_to(a)) for p in a.rglob('*') if p.is_file()}
              assert files=={str(p.relative_to(b)) for p in b.rglob('*') if p.is_file()},name
              for p in files:assert (a/p).read_bytes()==(b/p).read_bytes(),name+'/'+p
              replays.append({'stage':name,'artifacts':len(files),'byte_identical':True})
          (V/'replay.json').write_text(json.dumps(replays,indent=2)+'\n')
          code={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('scripts').rglob('*') if p.is_file() and 'v6' in p.name and p.suffix in ['.mjs','.py']}
          code.update({str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('tests').glob('associative-family-v6*.test.mjs')})
          p=Path('.github/workflows/audit-associative-family-v6.yml');code[str(p)]=hashlib.sha256(p.read_bytes()).hexdigest()
          logs={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in V.glob('*.log')}
          npm=(V/'npm-test.log').read_text();assert 'All tests passed.' in npm
          target=(V/'targeted.log').read_text();assert re.search(r'(?:# |ℹ )?fail 0',target)
          d=json.loads((V/'coverage-exact-differential.json').read_bytes());assert d['verdict']=='pass' and len(d['additions'])==5 and not d['removed'] and not d['changed_existing']
          result={'schema_version':6,'verdict':'pass','baseline_sha':'39703c50459d4accfd032af8c3fb1f16cffb3e9a','application_sha':Path('/tmp/p08-application-sha').read_text().strip(),'validation_execution':'GitHub Actions, serial heavy checks after local executor disconnects','production_enabled':False,'merge_performed':False,'catalog_before':18,'catalog_after':19,'memberships_before':21561,'memberships_after':21566,'added_memberships':5,'removed_memberships':0,'changed_existing_memberships':0,'new_lexical_heads':3,'npm_test_files':int(re.search(r'Discovered (\d+) test files',npm).group(1)),'targeted_tests':113,'synthetic_fixtures_separate':True,'audits':['v6','source/coverage/workflow','history','planning','frozen'],'replay':replays,'code_sha256':code,'logs_sha256':logs,'full_dictionary_complete':False,'exact_final_sha_ci':'checked independently after the final documentation/publisher cleanup commit'}
          (V/'validation.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          PY
          git add "$V"
          git commit -m 'test(v6): save serial candidate coverage audits, exact differential and deterministic replays'
          git push origin HEAD:refs/heads/feat/associative-family-v6-head-architecture-20261003
          git rev-parse HEAD
          
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prompt08-final-validation
          path: audit/associative-family-v6/prompt08-coverage-20261005/validation/
