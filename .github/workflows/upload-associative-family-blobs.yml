name: Upload associative family index to Blob

on:
  push:
    branches: [agent/associative-family-production-v3]
    paths:
      - '.github/workflows/upload-associative-family-blobs.yml'
      - 'scripts/upload-associative-family-blobs.mjs'

permissions:
  actions: read
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download validated v4 archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10550392530/zip > associative-family-metadata-v4.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10550807847/zip > associative-family-members-v4.zip
      - name: Verify immutable artifact checksums
        run: |
          echo '84f631a918f0aa8ac3d3466bb3334e7cc9ed4149e43b032803539c1f1e005b69  associative-family-metadata-v4.zip' | sha256sum -c -
          echo '7957939cd16a4f48d7e0e89a677efa00ec9ac1546cba5c9032adeed1659e5529  associative-family-members-v4.zip' | sha256sum -c -
      - name: Upload existing index archives
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/upload-associative-family-blobs.mjs associative-family-metadata-v4.zip associative-family-members-v4.zip
