name: Apply associative share-link fix

on:
  push:
    branches:
      - agent/fix-associative-share-links

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/fix-associative-share-links
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply targeted patch
        run: node scripts/apply-associative-share-link-fix.mjs

      - name: Validate syntax
        run: node --check shared/form-draft.js

      - name: Run focused regression test
        run: node tests/persistence-helper.test.mjs

      - name: Run full test suite
        run: npm test

      - name: Remove temporary patch files
        run: |
          rm scripts/apply-associative-share-link-fix.mjs
          rm .github/workflows/apply-associative-share-link-fix.yml

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/form-draft.js tests/persistence-helper.test.mjs scripts/apply-associative-share-link-fix.mjs .github/workflows/apply-associative-share-link-fix.yml
          git commit -m "Fix associative short share links"
          git push origin HEAD:agent/fix-associative-share-links
