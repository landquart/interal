name: Apply Associative Model Policy Fixes

on:
  push:
    branches:
      - fix/associative-model-selection-thresholds
    paths:
      - scripts/apply-associative-model-policy-fixes.mjs
      - .github/workflows/apply-associative-model-policy-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/associative-model-selection-thresholds
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply fixes
        run: node scripts/apply-associative-model-policy-fixes.mjs
      - name: Validate syntax
        run: |
          node --check associativvordes/script.js
          node --check associativvordes/js/candidate-model-family.js
          node --check associativvordes/js/qwen-client.js
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix associative model reconciliation and full scoring"
          git push origin HEAD:fix/associative-model-selection-thresholds
