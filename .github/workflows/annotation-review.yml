name: Annotation review integrity
on:
  push:
    paths: ['associativvordes/review/**', 'tests/browser/associative-review.playwright.mjs', '.github/workflows/annotation-review.yml']
  pull_request:
    paths: ['associativvordes/review/**', 'tests/browser/associative-review.playwright.mjs', '.github/workflows/annotation-review.yml']
jobs:
  ledger-and-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s associativvordes/review -v
      - run: node --check associativvordes/review/app.js
      - run: node --check tests/browser/associative-review.playwright.mjs
