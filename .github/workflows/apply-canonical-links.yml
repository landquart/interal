name: Apply canonical URLs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-canonical-links.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply canonical URLs
        run: node scripts/apply-canonical-links.mjs

      - name: Remove one-time updater
        run: |
          rm scripts/apply-canonical-links.mjs
          rm .github/workflows/apply-canonical-links.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add canonical URLs to public pages"
          git push
