name: Apply Associative Candidate Regression Tests

on:
  push:
    branches:
      - fix/associative-candidate-quality-and-qwen-existing
    paths:
      - scripts/apply-associative-candidate-regression-tests.mjs
      - .github/workflows/apply-associative-candidate-regression-tests.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/associative-candidate-quality-and-qwen-existing
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply test patch
        run: node scripts/apply-associative-candidate-regression-tests.mjs
      - name: Commit tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Test root quality and existing Qwen supplements"
          git push origin HEAD:fix/associative-candidate-quality-and-qwen-existing
