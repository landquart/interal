name: Browser regression corrective family v5

on:
  push:
    branches:
      - fix/associative-family-corrective-v5
    paths:
      - '.github/workflows/browser-associative-family-v5.yml'
      - 'tests/browser/associative-family-v5-artifacts.playwright.mjs'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Corrective build workflow run ID
        required: true
        default: '35461412225'
        type: string

permissions:
  actions: read
  contents: write

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id || '35461412225' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Download immutable browser artifacts
        run: |
          set -euo pipefail
          root=.tmp/browser-family-v5
          mkdir -p "$root/members"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name associative-family-metadata --dir "$root"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name associative-family-members --dir "$root/members"
          test -s "$root/manifest.json"
      - name: Run Chromium regression against v5 artifacts
        run: node tests/browser/associative-family-v5-artifacts.playwright.mjs .tmp/browser-family-v5 .tmp/browser-regression.json
      - name: Preserve browser report on corrective branch
        if: always()
        run: |
          set -euo pipefail
          test -s .tmp/browser-regression.json
          path=audit/associative-family-v5/browser-regression.json
          encoded=$(base64 -w0 .tmp/browser-regression.json)
          current=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$GITHUB_REF_NAME" --jq .sha 2>/dev/null || true)
          payload=$(node -e 'const [message,content,branch,sha]=process.argv.slice(1); process.stdout.write(JSON.stringify({message,content,branch,...(sha?{sha}:{})}))' \
            'audit: preserve v5 browser regression' "$encoded" "$GITHUB_REF_NAME" "$current")
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" --input - <<<"$payload"
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: associative-family-v5-browser-regression
          path: |
            .tmp/browser-regression.json
            .tmp/browser-desktop.png
            .tmp/browser-mobile.png
          if-no-files-found: error
          retention-days: 90
