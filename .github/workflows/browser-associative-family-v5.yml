name: Browser regression corrective family v5

on:
  push:
    branches:
      - fix/associative-family-corrective-v5
    paths:
      - '.github/workflows/browser-associative-family-v5.yml'
      - 'tests/browser/associative-family-v5-artifacts.playwright.mjs'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Corrective build workflow run ID
        required: true
        default: '35461412225'
        type: string

permissions:
  actions: read
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id || '35461412225' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Download immutable browser artifacts
        run: |
          set -euo pipefail
          root=.tmp/browser-family-v5
          mkdir -p "$root/members"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name associative-family-metadata --dir "$root"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name associative-family-members --dir "$root/members"
          test -s "$root/manifest.json"
      - name: Run Chromium regression against v5 artifacts
        run: node tests/browser/associative-family-v5-artifacts.playwright.mjs .tmp/browser-family-v5 .tmp/browser-regression.json
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: associative-family-v5-browser-regression
          path: |
            .tmp/browser-regression.json
            .tmp/browser-desktop.png
            .tmp/browser-mobile.png
          if-no-files-found: error
          retention-days: 90
