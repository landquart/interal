name: Build exhaustive associative families

# Trigger: multilingual family controls v5 rebuild.

on:
  push:
    branches:
      - agent/associative-family-production-v3
      - fix/associative-family-corrective-v5
      - fix/multilingual-family-controls-v5
      - fix/multilingual-family-controls-v5-rebuild
    paths:
      - '.github/workflows/build-associative-exhaustive-families.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Restore locked inputs only, or run the corrective build'
        required: true
        default: lock-inputs
        type: choice
        options:
          - lock-inputs
          - analyze-inputs
          - corrective-build
      confirm_corrective_build:
        description: 'For corrective-build only: type BUILD_CORRECTIVE_FAMILY_V5'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NODE_OPTIONS: --max-old-space-size=7168
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Confirm corrective build authorization
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'corrective-build'
        run: test "${{ inputs.confirm_corrective_build }}" = BUILD_CORRECTIVE_FAMILY_V5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show disk space
        run: df -h

      - name: Restore merged candidate checkpoint
        id: candidate-cache
        uses: actions/cache/restore@v4
        with:
          path: .tmp/family-candidate-index
          key: Linux-family-candidates-v3-3024370275a832dc65b5d4c58055343f36da1d4d2169ceaa2743d2e152ce01c2
          fail-on-cache-miss: true

      - name: Verify merged candidate checkpoint
        run: test -s .tmp/family-candidate-index/manifest.json

      - name: Restore Wiktionary dump checkpoint
        id: dump-cache
        uses: actions/cache/restore@v4
        with:
          path: .tmp/kaikki-wiktextract.jsonl.gz
          key: Linux-kaikki-320b99476e1a55df57761bd1d38b1cc68965f77a747f95fb3cc93625b2027d1b
          fail-on-cache-miss: true

      - name: Verify Wiktionary dump checkpoint
        run: gzip -t .tmp/kaikki-wiktextract.jsonl.gz

      - name: Lock restored corrective-build inputs
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha=$(find .tmp/family-candidate-index -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          kaikki_sha=$(sha256sum .tmp/kaikki-wiktextract.jsonl.gz | cut -d' ' -f1)
          candidate_bytes=$(du -sb .tmp/family-candidate-index | cut -f1)
          kaikki_bytes=$(stat -c %s .tmp/kaikki-wiktextract.jsonl.gz)
          candidate_manifest_sha=$(sha256sum .tmp/family-candidate-index/manifest.json | cut -d' ' -f1)
          package_lock_sha=$(sha256sum package-lock.json | cut -d' ' -f1)
          node --input-type=module - "$candidate_sha" "$kaikki_sha" "$candidate_bytes" "$kaikki_bytes" "$candidate_manifest_sha" "$package_lock_sha" <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const [, , candidateTreeSha256, kaikkiSha256, candidateBytes, kaikkiBytes, candidateManifestSha256, packageLockSha256] = process.argv;
          await writeFile('.tmp/input-lock-runtime.json', `${JSON.stringify({
            source_commit: process.env.GITHUB_SHA,
            workflow_run_id: process.env.GITHUB_RUN_ID,
            workflow_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            node_version: process.version,
            package_lock_sha256: packageLockSha256,
            candidate_cache_key: 'Linux-family-candidates-v3-3024370275a832dc65b5d4c58055343f36da1d4d2169ceaa2743d2e152ce01c2',
            candidate_tree_sha256: candidateTreeSha256,
            candidate_manifest_sha256: candidateManifestSha256,
            candidate_bytes: Number(candidateBytes),
            kaikki_cache_key: 'Linux-kaikki-320b99476e1a55df57761bd1d38b1cc68965f77a747f95fb3cc93625b2027d1b',
            kaikki_sha256: kaikkiSha256,
            kaikki_bytes: Number(kaikkiBytes),
            kaikki_url_at_audited_v4_build: 'https://kaikki.org/dictionary/raw-wiktextract-data.jsonl.gz'
          }, null, 2)}\n`);
          NODE

      - name: Scan every indexed lemma and build families
        if: inputs.operation == 'corrective-build' || github.event_name == 'push'
        id: build-families
        run: |
          node scripts/build-associative-exhaustive-family-index.mjs \
            --candidate-root=.tmp/family-candidate-index \
            --output-root=.tmp/associative-exhaustive-families \
            --etymology-gzip="$PWD/.tmp/kaikki-wiktextract.jsonl.gz" \
            --input-lock="$PWD/.tmp/input-lock-runtime.json" \
            --languages=en,de,fr,es,it,ru

      - name: Analyze etymon-key distribution without materializing families
        if: inputs.operation == 'analyze-inputs'
        run: |
          node scripts/build-associative-exhaustive-family-index.mjs \
            --candidate-root=.tmp/family-candidate-index \
            --output-root=.tmp/associative-family-analysis \
            --analysis-only \
            --analysis-report=.tmp/associative-family-analysis/etymon-key-distribution.json \
            --etymology-gzip="$PWD/.tmp/kaikki-wiktextract.jsonl.gz" \
            --languages=en,de,fr,es,it,ru

      - name: Attach immutable input lock
        if: inputs.operation == 'corrective-build' || github.event_name == 'push'
        run: cp .tmp/input-lock-runtime.json .tmp/associative-exhaustive-families/reports/input-lock-runtime.json

      - name: Cross-audit every assignment and membership
        if: inputs.operation == 'corrective-build' || github.event_name == 'push'
        run: node scripts/audit-associative-family-output.mjs .tmp/associative-exhaustive-families

      - name: Verify exhaustive assignment
        if: inputs.operation == 'corrective-build' || github.event_name == 'push'
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('.tmp/associative-exhaustive-families/report.json', 'utf8'));
          for (const [lang, sourceCount] of Object.entries(report.source_entries)) {
            const assigned = report.assignment_stats?.[lang]?.total;
            if (assigned !== sourceCount) throw new Error(`${lang}: assigned ${assigned} of ${sourceCount} entries`);
          }
          if (!report.controls_ok) throw new Error('Methodology control families failed; inspect report.json');
          if (!report.merged_families) throw new Error('No merged associative families were generated');
          console.log(`Families: ${report.merged_families}; aliases: ${report.aliases_in_lookup}; proto review: ${report.proto_review_candidates}`);
          NODE

      - name: Show report
        if: always() && (inputs.operation == 'corrective-build' || github.event_name == 'push')
        run: |
          test -f .tmp/associative-exhaustive-families/report.json && cat .tmp/associative-exhaustive-families/report.json || true

      - name: Upload family metadata and audit
        if: always() && (inputs.operation == 'corrective-build' || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: associative-family-metadata
          path: |
            .tmp/associative-exhaustive-families/*.json
            .tmp/associative-exhaustive-families/families
            .tmp/associative-exhaustive-families/aliases
            .tmp/associative-exhaustive-families/reports
            .tmp/associative-exhaustive-families/review
          if-no-files-found: warn
          retention-days: 30

      - name: Upload assignments by language
        if: always() && (inputs.operation == 'corrective-build' || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: associative-family-assignments
          path: .tmp/associative-exhaustive-families/assignments
          if-no-files-found: warn
          retention-days: 30

      - name: Upload member index by language
        if: always() && (inputs.operation == 'corrective-build' || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: associative-family-members
          path: .tmp/associative-exhaustive-families/members
          if-no-files-found: warn
          retention-days: 30

      - name: Upload restored-input content lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: associative-family-v5-input-lock
          path: .tmp/input-lock-runtime.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload etymon-key distribution
        if: always() && inputs.operation == 'analyze-inputs'
        uses: actions/upload-artifact@v4
        with:
          name: associative-family-v5-etymon-key-distribution
          path: .tmp/associative-family-analysis/etymon-key-distribution.json
          if-no-files-found: error
          retention-days: 90
