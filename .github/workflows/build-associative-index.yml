name: Build Associative Index

on:
  workflow_dispatch:
    inputs:
      language:
        description: Language to build
        required: true
        default: en

jobs:
  build:
    name: Build associative index
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate language input
        run: |
          if [ "${{ inputs.language }}" != "en" ]; then
            echo "Only language=en is supported for this workflow." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run indexer tests
        run: npm test

      - name: Build full English associative index
        run: npm run build:associative-index -- --languages=en --report=associativvordes/candidate-index/build-report.json

      - name: Validate candidate index
        run: node scripts/validate-associative-candidate-index.mjs associativvordes/candidate-index en

      - name: Package candidate index
        run: |
          mkdir -p .tmp/associative-index-artifact/en
          cp associativvordes/candidate-index/manifest.json .tmp/associative-index-artifact/manifest.json
          cp associativvordes/candidate-index/build-report.json .tmp/associative-index-artifact/build-report.json
          cp associativvordes/candidate-index/en/*.json .tmp/associative-index-artifact/en/

      - name: Upload candidate index artifact
        uses: actions/upload-artifact@v4
        with:
          name: associative-index-en
          path: .tmp/associative-index-artifact
          if-no-files-found: error
          retention-days: 14
