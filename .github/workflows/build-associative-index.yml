name: Build Associative Index

on:
  workflow_dispatch:
    inputs:
      language:
        description: Language to build
        required: true
        type: choice
        options:
          - en
          - de
          - fr
          - es
          - it
          - ru
        default: en

jobs:
  build:
    name: Build associative index (${{ inputs.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Validate language input
        run: |
          case "${{ inputs.language }}" in
            en|de|fr|es|it|ru) ;;
            *)
              echo "Unsupported language: ${{ inputs.language }}. Expected one of: en, de, fr, es, it, ru." >&2
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run indexer unit tests
        run: npm test

      - name: Run selected language fixture test
        run: node tests/associative-index-builder.test.mjs --language="${{ inputs.language }}"

      - name: Run Russian normalization tests
        run: node tests/associative-index-russian-normalization.test.mjs

      - name: Build selected associative index
        run: npm run build:associative-index -- --languages="${{ inputs.language }}" --report=associativvordes/candidate-index/build-report.json

      - name: Validate candidate index
        run: npm run validate:associative-index -- --index-root=associativvordes/candidate-index --languages="${{ inputs.language }}" --strict

      - name: Package candidate index
        run: |
          mkdir -p ".tmp/associative-index-artifact/${{ inputs.language }}"
          cp associativvordes/candidate-index/manifest.json .tmp/associative-index-artifact/manifest.json
          cp associativvordes/candidate-index/build-report.json .tmp/associative-index-artifact/build-report.json
          cp associativvordes/candidate-index/${{ inputs.language }}/*.json ".tmp/associative-index-artifact/${{ inputs.language }}/"

      - name: Upload candidate index artifact
        uses: actions/upload-artifact@v4
        with:
          name: associative-index-${{ inputs.language }}
          path: .tmp/associative-index-artifact
          if-no-files-found: error
          retention-days: 14
