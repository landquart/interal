name: Refresh loader cache keys

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update shared UI cache keys
        run: |
          python - <<'PY'
          from pathlib import Path

          old_keys = (
              'ui.js?v=interal-ui-20260809-3',
              'ui.js?v=interal-ui-20260818-3',
              'ui.js?v=interal-ui-20260819-1',
          )
          new_key = 'ui.js?v=interal-ui-20260819-2'

          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = text
              for old in old_keys:
                  updated = updated.replace(old, new_key)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('\n'.join(changed))
          PY
          if git diff --quiet -- '*.html'; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.html'
          git commit -m "Bust loader cache across site"
          git push
