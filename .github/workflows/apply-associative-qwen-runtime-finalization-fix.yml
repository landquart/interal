name: Apply Associative Qwen Runtime Finalization Fix

on:
  push:
    branches:
      - fix/associative-qwen-runtime-finalization
    paths:
      - scripts/apply-associative-qwen-runtime-finalization-fix.mjs
      - .github/workflows/apply-associative-qwen-runtime-finalization-fix.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'fix/associative-qwen-runtime-finalization'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/associative-qwen-runtime-finalization
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply patch
        run: node scripts/apply-associative-qwen-runtime-finalization-fix.mjs
      - name: Validate syntax
        run: node --check associativvordes/js/qwen-client.js
      - name: Run focused regression test
        run: node tests/associative-qwen-runtime-finalization.test.mjs
      - name: Run full test suite
        id: full_tests
        continue-on-error: true
        run: npm test > full-test.log 2>&1
      - name: Upload full test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: associative-runtime-finalization-full-test-log
          path: full-test.log
          if-no-files-found: error
      - name: Require full suite success
        if: steps.full_tests.outcome != 'success'
        run: exit 1
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Qwen supplements in the visible top five"
          git push origin HEAD:fix/associative-qwen-runtime-finalization
