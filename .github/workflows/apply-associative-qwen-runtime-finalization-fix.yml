name: Apply Associative Qwen Runtime Finalization Fix

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/associative-qwen-runtime-finalization'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/associative-qwen-runtime-finalization
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply patch
        run: node scripts/apply-associative-qwen-runtime-finalization-fix.mjs
      - name: Validate syntax
        run: node --check associativvordes/js/qwen-client.js
      - name: Run focused regression test
        run: node tests/associative-qwen-runtime-finalization.test.mjs
      - name: Run full test suite
        run: npm test
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add associativvordes/js/qwen-client.js tests/associative-qwen-runtime-finalization.test.mjs
          git add -u scripts/apply-associative-qwen-runtime-finalization-fix.mjs .github/workflows/apply-associative-qwen-runtime-finalization-fix.yml
          git commit -m "Finalize Qwen supplements in the visible top five"
          git push origin HEAD:fix/associative-qwen-runtime-finalization
