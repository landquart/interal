name: Benchmark corrective family v5 staging network

on:
  push:
    branches: [fix/associative-family-corrective-v5]
    paths:
      - '.github/workflows/benchmark-associative-family-v5-staging-network.yml'
      - 'scripts/benchmark-associative-family-staging-network.mjs'
      - 'api/family-index.js'

permissions:
  contents: write

jobs:
  benchmark-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGING_PREFIX: associative-family/v5-staging/run-35461412225-68b305f48e4b-576b08b2ba90/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Benchmark private Blob staging chain
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          set +e
          node scripts/benchmark-associative-family-staging-network.mjs "$STAGING_PREFIX" staging-network-benchmark.json > staging-network.log 2>&1
          code=$?
          cat staging-network.log
          if [ ! -s staging-network-benchmark.json ]; then
            node -e 'const fs=require("fs"); const [code,log]=process.argv.slice(1); fs.writeFileSync("staging-network-benchmark.json", JSON.stringify({schema_version:1,verdict:"error",exit_code:Number(code),error_log:fs.readFileSync(log,"utf8")},null,2)+"\\n")' "$code" staging-network.log
          fi
          exit "$code"
      - name: Preserve network report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s staging-network-benchmark.json
          path=audit/associative-family-v5/staging-network-benchmark.json
          encoded=$(base64 -w0 staging-network-benchmark.json)
          current=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$GITHUB_REF_NAME" --jq .sha 2>/dev/null || true)
          payload=$(node -e 'const [message,content,branch,sha]=process.argv.slice(1); process.stdout.write(JSON.stringify({message,content,branch,...(sha?{sha}:{})}))' 'audit: preserve v5 staging network benchmark' "$encoded" "$GITHUB_REF_NAME" "$current")
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" --input - <<<"$payload"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: associative-family-v5-staging-network-benchmark
          path: staging-network-benchmark.json
          if-no-files-found: error
          retention-days: 90
