name: Build associative family index

on:
  push:
    branches:
      - associative-family-index
    paths:
      - 'scripts/build-associative-family-index.mjs'
      - '.github/workflows/build-associative-family-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build candidate indexes from every frequency list
        env:
          GITHUB_ACTIONS: 'true'
        run: |
          rm -rf .tmp/family-candidate-parts .tmp/family-candidate-index .tmp/associative-family-index .tmp/etymwn
          mkdir -p .tmp/family-candidate-parts .tmp/family-candidate-index
          for lang in en de fr es it ru; do
            node scripts/build-associative-candidate-index.mjs \
              --languages="$lang" \
              --output-root=".tmp/family-candidate-parts/$lang"
            cp -r ".tmp/family-candidate-parts/$lang/$lang" ".tmp/family-candidate-index/$lang"
          done
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const languages = ['en','de','fr','es','it','ru'];
          const merged = { version: '1', normalizer_version: '2', generated_at: new Date().toISOString(), languages: {} };
          for (const language of languages) {
            const manifest = JSON.parse(await readFile(`.tmp/family-candidate-parts/${language}/manifest.json`, 'utf8'));
            merged.global_config_hash ??= manifest.global_config_hash;
            merged.languages[language] = manifest.languages[language];
          }
          await writeFile('.tmp/family-candidate-index/manifest.json', JSON.stringify(merged, null, 2));
          NODE

      - name: Download Etymological WordNet
        run: |
          mkdir -p .tmp/etymwn
          curl -fL --retry 5 --retry-delay 3 \
            https://archive.org/download/etymwn-20130208/etymwn-20130208.zip \
            -o .tmp/etymwn/etymwn.zip
          unzip -q .tmp/etymwn/etymwn.zip -d .tmp/etymwn
          ETYMWN="$(find .tmp/etymwn -name etymwn.tsv -type f | head -n 1)"
          test -n "$ETYMWN"
          echo "ETYMWN=$ETYMWN" >> "$GITHUB_ENV"

      - name: Build associative etymological families
        run: |
          node scripts/build-associative-family-index.mjs \
            --candidate-root=.tmp/family-candidate-index \
            --etymwn="$ETYMWN" \
            --output-root=.tmp/associative-family-index \
            --languages=en,de,fr,es,it,ru \
            --max-depth=7

      - name: Show control checks
        run: cat .tmp/associative-family-index/report.json

      - name: Upload family index
        uses: actions/upload-artifact@v4
        with:
          name: associative-family-index
          path: .tmp/associative-family-index
          if-no-files-found: error
          retention-days: 14
