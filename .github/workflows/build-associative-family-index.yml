name: Build associative family index

on:
  push:
    branches:
      - associative-family-index
    paths:
      - 'scripts/build-associative-family-index.mjs'
      - 'associativvordes/js/root-matcher.js'
      - 'associativvordes/js/affix-search-config.js'
      - '.github/workflows/build-associative-family-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build candidate indexes from every frequency list
        env:
          GITHUB_ACTIONS: 'true'
        run: |
          rm -rf .tmp/family-candidate-parts .tmp/family-candidate-index .tmp/associative-family-index
          mkdir -p .tmp/family-candidate-parts .tmp/family-candidate-index
          for lang in en de fr es it ru; do
            node scripts/build-associative-candidate-index.mjs \
              --languages="$lang" \
              --output-root=".tmp/family-candidate-parts/$lang"
            cp -r ".tmp/family-candidate-parts/$lang/$lang" ".tmp/family-candidate-index/$lang"
          done
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const languages = ['en','de','fr','es','it','ru'];
          const merged = { version: '1', normalizer_version: '2', generated_at: new Date().toISOString(), languages: {} };
          for (const language of languages) {
            const manifest = JSON.parse(await readFile(`.tmp/family-candidate-parts/${language}/manifest.json`, 'utf8'));
            merged.global_config_hash ??= manifest.global_config_hash;
            merged.languages[language] = manifest.languages[language];
          }
          await writeFile('.tmp/family-candidate-index/manifest.json', JSON.stringify(merged, null, 2));
          NODE

      - name: Build exact associative families
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          node scripts/build-associative-family-index.mjs \
            --candidate-root=.tmp/family-candidate-index \
            --output-root=.tmp/associative-family-index \
            --languages=en,de,fr,es,it,ru

      - name: Verify no fuzzy family algorithm
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('.tmp/associative-family-index/manifest.json', 'utf8'));
          if (manifest.algorithm?.fuzzy_matching !== false) throw new Error('family manifest must explicitly disable fuzzy matching');
          if (manifest.algorithm?.edit_distance_matching !== false) throw new Error('family manifest must explicitly disable edit-distance matching');
          const report = JSON.parse(await readFile('.tmp/associative-family-index/report.json', 'utf8'));
          for (const [name, check] of Object.entries(report.controls || {})) if (!check.ok) throw new Error(`failed control family: ${name}`);
          NODE

      - name: Show family report
        run: cat .tmp/associative-family-index/report.json

      - name: Upload family index
        uses: actions/upload-artifact@v4
        with:
          name: associative-family-index
          path: .tmp/associative-family-index
          if-no-files-found: error
          retention-days: 14
