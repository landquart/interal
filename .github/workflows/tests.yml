name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check changed associative modules
        run: |
          node --check associativvordes/js/candidate-index-loader.js
          node --check associativvordes/js/candidate-static-search.js
          node --check associativvordes/js/candidate-finder.js
          node --check associativvordes/js/root-matcher.js
          node --check associativvordes/js/target-meaning-translator.js
          node --check shared/button-status.js
          node --check shared/card-schema.mjs
          node --check scripts/audit-associative-index-memory.mjs
          node --check scripts/build-associative-static-search-index.mjs
          node --check scripts/validate-associative-static-search-index.mjs
          node --check scripts/merge-associative-static-search-artifacts.mjs
          node --check scripts/check-associative-static-search-index-deployment.mjs

      - name: Run static search regression test
        run: node tests/associative-static-search-index.test.mjs

      - name: Run all tests
        run: |
          mkdir -p .tmp/test-logs
          set -o pipefail
          npm test 2>&1 | tee .tmp/test-logs/all-tests.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-${{ github.run_id }}
          path: .tmp/test-logs/all-tests.log
          if-no-files-found: warn
          retention-days: 3
