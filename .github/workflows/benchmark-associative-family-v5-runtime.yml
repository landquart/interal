name: Benchmark corrective family v5 runtime

on:
  push:
    branches:
      - fix/associative-family-corrective-v5
    paths:
      - '.github/workflows/benchmark-associative-family-v5-runtime.yml'
      - 'scripts/benchmark-associative-family-runtime.mjs'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Corrective build workflow run ID
        required: true
        default: '35461412225'
        type: string

permissions:
  actions: read
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id || '35461412225' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download immutable runtime artifacts
        run: |
          set -euo pipefail
          root=.tmp/runtime-family-v5
          mkdir -p "$root/members"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name associative-family-metadata --dir "$root"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name associative-family-members --dir "$root/members"
          test -s "$root/manifest.json"
          test -s "$root/members/en/00.json"
      - name: Benchmark loader against complete v5 artifacts
        run: node scripts/benchmark-associative-family-runtime.mjs .tmp/runtime-family-v5 .tmp/runtime-benchmark.json
      - name: Preserve benchmark report on corrective branch
        run: |
          set -euo pipefail
          path=audit/associative-family-v5/runtime-benchmark.json
          encoded=$(base64 -w0 .tmp/runtime-benchmark.json)
          current=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$GITHUB_REF_NAME" --jq .sha 2>/dev/null || true)
          payload=$(node -e 'const [message,content,branch,sha]=process.argv.slice(1); process.stdout.write(JSON.stringify({message,content,branch,...(sha?{sha}:{})}))' \
            'audit: preserve v5 runtime benchmark' "$encoded" "$GITHUB_REF_NAME" "$current")
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" --input - <<<"$payload"
      - name: Upload runtime benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: associative-family-v5-runtime-benchmark
          path: .tmp/runtime-benchmark.json
          if-no-files-found: error
          retention-days: 90
