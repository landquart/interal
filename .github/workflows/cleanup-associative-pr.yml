name: Cleanup associative PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'fix/associative-production-hardening' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Restore dependency tree from main
        run: |
          git fetch origin main
          if git cat-file -e origin/main:node_modules 2>/dev/null; then
            git restore --source=origin/main --staged --worktree -- node_modules
          else
            git rm -r --cached --ignore-unmatch node_modules
            rm -rf node_modules
          fi

      - name: Commit cleanup
        run: |
          rm -f .github/workflows/cleanup-associative-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes required"
            exit 0
          fi
          git commit -m "Remove dependency artifacts from associative fix"
          git push origin HEAD:${{ github.head_ref }}
