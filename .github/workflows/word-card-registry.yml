name: Build registre of vordesen cartes

on:
  workflow_dispatch:
  push:
    paths:
      - "cards/accepted/**/*.json"
      - "scripts/stamp-accepted-at.mjs"
      - "scripts/build-global-card-registry.mjs"

permissions:
  contents: write

jobs:
  build-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp accepted_at
        run: node scripts/stamp-accepted-at.mjs

      - name: Build global registry
        run: node scripts/build-global-card-registry.mjs

      - name: Commit registry updates
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add cards
          git commit -m "Update vordesen card registry"
          git push
