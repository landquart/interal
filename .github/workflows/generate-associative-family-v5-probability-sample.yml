name: Generate locked family v5 probability sample

on:
  push:
    branches: [fix/associative-family-corrective-v5]
    paths:
      - 'scripts/sample-associative-family-memberships.mjs'
      - '.github/workflows/generate-associative-family-v5-probability-sample.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Restore immutable v5 inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/input .tmp/root/assignments
          gh api repos/${{ github.repository }}/actions/artifacts/10590911931/zip > .tmp/metadata.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10590597161/zip > .tmp/assignments.zip
          echo '68b305f48e4be768849494fa728c42e9edafa2823ee29316d825bc207fa88044  .tmp/metadata.zip' | sha256sum -c -
          echo '2a8fd4f708fb99e5660d4793ab211e3d3feb5acf53a5c2ad2aa3af21f5080e82  .tmp/assignments.zip' | sha256sum -c -
          unzip -q .tmp/metadata.zip -d .tmp/metadata
          unzip -q .tmp/assignments.zip -d .tmp/assignments
          cp .tmp/assignments/*.jsonl.gz .tmp/root/assignments/
          ln -s "$PWD/.tmp/metadata/families" .tmp/root/families
          ln -s "$PWD/.tmp/metadata/aliases" .tmp/root/aliases
      - name: Generate probability sample and evidence packets
        run: |
          set -euo pipefail
          node scripts/sample-associative-family-memberships.mjs \
            --root=.tmp/root \
            --output=.tmp/semantic-probability-kit-v2 \
            --seed=associative-family-v5-probability-sample-2026-09-20 \
            --per-language=1600
          node scripts/audit-associative-family-semantic-sample.mjs \
            .tmp/semantic-probability-kit-v2/gold-sample.jsonl \
            .tmp/root/assignments > .tmp/semantic-probability-kit-v2/annotation-qa-preflight.json
          sha256sum .tmp/semantic-probability-kit-v2/* > .tmp/semantic-probability-kit-v2/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: associative-family-v5-semantic-probability-kit-v2
          path: .tmp/semantic-probability-kit-v2
          compression-level: 9
          retention-days: 90
