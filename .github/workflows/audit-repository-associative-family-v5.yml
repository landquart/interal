name: Audit repository associative family v5

on:
  push:
    branches:
      - main
      - audit/family-v5-repository-integrity
    paths:
      - 'associativvordes/family-index-v5/**'
      - 'associativvordes/js/family-index-loader.js'
      - 'associativvordes/js/candidate-index-loader.js'
      - 'scripts/audit-repository-associative-family-v5.mjs'
      - '.github/workflows/audit-repository-associative-family-v5.yml'
  pull_request:
    paths:
      - 'associativvordes/family-index-v5/**'
      - 'associativvordes/js/family-index-loader.js'
      - 'associativvordes/js/candidate-index-loader.js'
      - 'scripts/audit-repository-associative-family-v5.mjs'
      - '.github/workflows/audit-repository-associative-family-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-repository-associative-family-v5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exhaustively audit static gzip shards
        run: node --max-old-space-size=6144 scripts/audit-repository-associative-family-v5.mjs
      - name: Preserve current audit on integration branch
        if: github.event_name == 'push' && github.ref_name == 'audit/family-v5-repository-integrity'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit/associative-family-v5/repository-static-integrity.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: preserve repository family v5 integrity"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Upload integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: associative-family-v5-repository-integrity
          path: audit/associative-family-v5/repository-static-integrity.json
          if-no-files-found: error
          retention-days: 90
