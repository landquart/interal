name: Apply Associative Restore Reconciliation

on:
  push:
    branches:
      - fix/associative-model-selection-thresholds
    paths:
      - scripts/apply-associative-restore-reconciliation.mjs
      - .github/workflows/apply-associative-restore-reconciliation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/associative-model-selection-thresholds
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply patch
        run: node scripts/apply-associative-restore-reconciliation.mjs
      - name: Validate syntax
        run: node --check associativvordes/script.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile restored associative model representatives"
          git push origin HEAD:fix/associative-model-selection-thresholds
