name: Structural v5 shadow contracts
on:
  pull_request:
    paths:
      - 'associativvordes/structural_cleanup/**'
      - 'audit/associative-v5-structural-cleanup/**'
      - 'tests/associative-v5-structural-cleanup.test.mjs'
      - '.github/workflows/associative-v5-structural-cleanup.yml'
jobs:
  structural-shadow-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s associativvordes/structural_cleanup -p 'test_*.py' -v
