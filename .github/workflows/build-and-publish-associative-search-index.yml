name: Build and Publish Static Associative Search Index

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Type BUILD_AND_PUBLISH_STATIC_SEARCH_INDEX
        required: true
      source_run_id:
        description: Optional successful run ID whose six language artifacts should be reused
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  test:
    if: inputs.source_run_id == ''
    name: Test static search implementation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm_publish }}" != "BUILD_AND_PUBLISH_STATIC_SEARCH_INDEX" ]; then
            echo "confirm_publish must equal BUILD_AND_PUBLISH_STATIC_SEARCH_INDEX" >&2
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          show-progress: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  build:
    if: inputs.source_run_id == ''
    name: Build static search index (${{ matrix.language }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        language: [en, de, fr, es, it, ru]
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          show-progress: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build temporary candidate index from frequency lists
        run: |
          set -euo pipefail
          rm -rf .tmp/static-candidate-index .tmp/static-search-build
          npm run build:associative-index -- \
            --languages="${{ matrix.language }}" \
            --output-root=.tmp/static-candidate-index \
            --report=.tmp/static-candidate-index/candidate-build-report.json
          npm run validate:associative-index -- \
            --index-root=.tmp/static-candidate-index \
            --languages="${{ matrix.language }}" \
            --strict
      - name: Build compact static language index
        run: |
          npm run build:associative-search-index -- \
            --language="${{ matrix.language }}" \
            --input-root=.tmp/static-candidate-index \
            --output-root=.tmp/static-search-build \
            --report=.tmp/static-search-build/build-report.json
      - name: Strictly validate complete language index
        run: |
          npm run validate:associative-search-index -- \
            --index-root=.tmp/static-search-build \
            --languages="${{ matrix.language }}" \
            --strict \
            --report=.tmp/static-search-build/validation-report.json
      - name: Package language artifact
        run: |
          set -euo pipefail
          artifact=".tmp/static-search-artifact"
          rm -rf "$artifact"
          mkdir -p "$artifact"
          cp .tmp/static-search-build/manifest.json "$artifact/manifest.json"
          cp .tmp/static-search-build/build-report.json "$artifact/build-report.json"
          cp .tmp/static-search-build/validation-report.json "$artifact/validation-report.json"
          cp .tmp/static-candidate-index/candidate-build-report.json "$artifact/candidate-build-report.json"
          cp -R ".tmp/static-search-build/${{ matrix.language }}" "$artifact/${{ matrix.language }}"
      - name: Upload language artifact
        uses: actions/upload-artifact@v7
        with:
          name: associative-search-index-${{ matrix.language }}
          path: .tmp/static-search-artifact
          if-no-files-found: error
          retention-days: 14

  publish:
    if: always() && ((inputs.source_run_id != '') || (needs.test.result == 'success' && needs.build.result == 'success'))
    name: Merge, validate, and open review PR
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ARTIFACT_ROOT: .tmp/static-search-artifacts
      MERGED_ROOT: .tmp/static-search-merged
      VALIDATION_REPORT: .tmp/static-search-validation.json
      PR_BODY: .tmp/static-search-pr-body.md
      PR_BRANCH: publish/associative-search-index-${{ github.run_id }}
    steps:
      - name: Validate publication inputs
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_publish }}" != "BUILD_AND_PUBLISH_STATIC_SEARCH_INDEX" ]; then
            echo "confirm_publish must equal BUILD_AND_PUBLISH_STATIC_SEARCH_INDEX" >&2
            exit 1
          fi
          source_run_id="${{ inputs.source_run_id }}"
          if [ -n "$source_run_id" ] && ! [[ "$source_run_id" =~ ^[0-9]+$ ]]; then
            echo "source_run_id must be a numeric GitHub Actions run ID" >&2
            exit 1
          fi
      - name: Checkout selected source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download artifacts from this run
        if: inputs.source_run_id == ''
        uses: actions/download-artifact@v4
        with:
          pattern: associative-search-index-*
          path: ${{ env.ARTIFACT_ROOT }}
          merge-multiple: false
      - name: Download artifacts from existing run
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pattern: associative-search-index-*
          path: ${{ env.ARTIFACT_ROOT }}
          merge-multiple: false
      - name: Verify six artifacts
        run: |
          set -euo pipefail
          for language in en de fr es it ru; do
            dir="$ARTIFACT_ROOT/associative-search-index-$language"
            test -f "$dir/manifest.json"
            test -f "$dir/build-report.json"
            test -f "$dir/candidate-build-report.json"
            test -d "$dir/$language"
          done
          count="$(find "$ARTIFACT_ROOT" -mindepth 1 -maxdepth 1 -type d -name 'associative-search-index-*' | wc -l | tr -d ' ')"
          test "$count" = "6"
      - name: Merge static search artifacts
        run: |
          npm run merge:associative-search-index -- \
            --input-root="$ARTIFACT_ROOT" \
            --output-root="$MERGED_ROOT"
      - name: Strictly validate complete merged index
        run: |
          npm run validate:associative-search-index -- \
            --index-root="$MERGED_ROOT/search-index" \
            --languages=en,de,fr,es,it,ru \
            --strict \
            --report="$VALIDATION_REPORT"
      - name: Replace legacy index with static index
        run: |
          set -euo pipefail
          rm -rf associativvordes/search-index associativvordes/candidate-index
          mkdir -p associativvordes/search-index
          cp -R "$MERGED_ROOT/search-index/." associativvordes/search-index/
      - name: Apply full-search browser runtime
        run: node scripts/patch-associative-search-runtime.mjs associativvordes/script.js
      - name: Run deployment gates
        run: |
          npm run check:associative-index-deployment
          npm run check:associative-search-index-deployment
      - name: Build pull request description
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          import { dirname } from 'node:path';
          const manifest = JSON.parse(await readFile('associativvordes/search-index/manifest.json', 'utf8'));
          const validation = JSON.parse(await readFile(process.env.VALIDATION_REPORT, 'utf8'));
          const lines = [
            '## Static associative search index publication',
            '',
            'Publishes the complete static inverted n-gram index generated directly from the six production frequency-list sources.',
            '',
            'The legacy letter-sharded `associativvordes/candidate-index` is removed in the same commit so the repository and Vercel deployment do not store two complete indexes.',
            '',
            'The browser runtime keeps every found candidate, renders results in pages of 100, automatically analyzes only a small initial set, and allows any remaining candidate to be analyzed manually.',
            '',
            '| Language | Entries | Entry blocks | Posting buckets | Posting IDs | Expected posting IDs |',
            '| --- | ---: | ---: | ---: | ---: | ---: |'
          ];
          for (const language of ['en', 'de', 'fr', 'es', 'it', 'ru']) {
            const info = validation.languages[language];
            lines.push(`| ${language} | ${manifest.languages[language].entries} | ${info.entry_blocks} | ${info.posting_buckets} | ${info.posting_ids} | ${info.expected_posting_ids} |`);
          }
          lines.push('', `- format: \`${manifest.index_format}\``, `- normalizer: \`${manifest.normalizer_version}\``, `- global_config_hash: \`${manifest.global_config_hash}\``, `- validation errors: ${validation.errors.length}`, `- validation warnings: ${validation.warnings.length}`, '', 'The browser loader uses the corrected static index immediately after this PR is merged and deployed.');
          await mkdir(dirname(process.env.PR_BODY), { recursive: true });
          await writeFile(process.env.PR_BODY, `${lines.join('\n')}\n`);
          NODE
      - name: Commit and push review branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage the whole runtime directory so removal of candidate-index is recorded
          # even though that path no longer exists on disk.
          git add -A -- associativvordes
          if git diff --cached --quiet; then
            echo "Publication produced no tracked changes relative to the selected source branch." >&2
            exit 1
          fi
          git switch -c "$PR_BRANCH"
          git commit -m "Publish corrected static associative search index"
          git push --force-with-lease origin "$PR_BRANCH"
      - name: Create pull request for manual review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          timeout 300s gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$PR_BRANCH" \
            --title "Publish corrected static associative search index" \
            --body-file "$PR_BODY"
      - name: Verify review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            pr_url="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$PR_BRANCH" --json url --jq '.[0].url // empty' || true)"
            if [ -n "$pr_url" ]; then
              echo "Review PR: $pr_url"
              exit 0
            fi
            sleep 10
          done
          echo "Review PR was not created for $PR_BRANCH" >&2
          exit 1
