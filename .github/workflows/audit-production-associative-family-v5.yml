name: Audit production associative family v5

on:
  push:
    branches:
      - main
    paths:
      - 'associativvordes/family-index-v5/**'
      - 'associativvordes/js/family-index-loader.js'
      - 'associativvordes/js/candidate-index-loader.js'
      - '.github/workflows/audit-production-associative-family-v5.yml'
      - 'tests/browser/associative-family-v5-production.playwright.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for the matching production deployment
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            source_run_id=$(curl --fail --silent --show-error \
              https://interal.vercel.app/associativvordes/family-index-v5/manifest.json \
              | node -e 'let data=""; process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => console.log(JSON.parse(data).repository_storage?.immutable_source_run_id || ""))')
            if [ "$source_run_id" = "35647932153" ]; then
              exit 0
            fi
            sleep 30
          done
          echo "Production did not expose SOURCE_RUN_ID 35647932153 within 10 minutes" >&2
          exit 1
      - name: Run browser, runtime and transport regression against production
        run: node tests/browser/associative-family-v5-production.playwright.mjs https://interal.vercel.app .tmp/family-v5-production-regression.json
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: associative-family-v5-production-regression
          path: |
            .tmp/family-v5-production-regression.json
            .tmp/family-v5-production-desktop.png
            .tmp/family-v5-production-mobile.png
          if-no-files-found: error
          retention-days: 90
