name: Temporary PRCE frequency analysis

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - chatgpt-frequency-analysis-20260731
    paths:
      - scripts/chatgpt-calc-prce-frequency.mjs
      - .github/workflows/chatgpt-frequency-analysis.yml

permissions:
  contents: read

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Calculate frequencies
        run: node scripts/chatgpt-calc-prce-frequency.mjs

      - name: Build compact summary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const full = JSON.parse(fs.readFileSync('chatgpt-frequency-results.json', 'utf8'));
          const results = full.results.map(({ id, logical, international, geometric_mean_ipm, arithmetic_mean_ipm, tertile, language_values_ipm, cognate_languages, positive_languages }) => ({
            id,
            logical,
            international,
            geometric_mean_ipm,
            arithmetic_mean_ipm,
            tertile,
            language_values_ipm,
            cognate_languages,
            positive_languages
          }));
          fs.writeFileSync('chatgpt-frequency-summary.json', JSON.stringify({ generated_at: full.generated_at, method: full.method, results }, null, 2));
          NODE

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: prce-frequency-summary
          path: chatgpt-frequency-summary.json
          retention-days: 1
