name: Temporary PRCE frequency analysis

on:
  push:
    branches:
      - chatgpt-frequency-analysis-20260731
    paths:
      - scripts/chatgpt-calc-prce-frequency.mjs
      - .github/workflows/chatgpt-frequency-analysis.yml

permissions:
  contents: write

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt-frequency-analysis-20260731
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Calculate frequencies
        run: node scripts/chatgpt-calc-prce-frequency.mjs

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-frequency-results.json
          git commit -m "Calculate PRCE frequency values" || exit 0
          git push
