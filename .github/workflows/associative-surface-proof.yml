name: Surface proof guards
on:
  pull_request:
    paths:
      - 'associativvordes/surface_cleanup/**'
      - 'audit/associative-v5-surface-cleanup/**'
      - 'tests/associative-surface-proof.test.mjs'
      - '.github/workflows/associative-surface-proof.yml'
jobs:
  surface-proof-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s associativvordes/surface_cleanup -p 'test_*.py' -v
