name: Apply restrained design refinements

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

jobs:
  refine-design:
    if: github.event.issue.pull_request == null && github.event.comment.body == '/apply-design-refinements-20260723'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Apply restrained design fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected block: {label}')
              return text.replace(old, new, 1)

          # 1. Make the final homepage structure and styling static.
          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')

          index = replace_once(
              index,
              '      --hero-transition-height: clamp(116px, 17svh, 230px);',
              '      --hero-transition-height: clamp(88px, 12svh, 170px);',
              'hero transition height',
          )

          intro_css = re.compile(
              r'    \.home-intro \{.*?    \.home-about \{',
              re.S,
          )
          intro_css_replacement = '''    .home-intro {
            margin-bottom: clamp(24px, 4vw, 46px);
          }

          .home-intro-row {
            display: grid;
            grid-template-columns: minmax(300px, .82fr) minmax(0, 1.18fr);
            align-items: start;
            gap: clamp(28px, 4vw, 52px);
          }

          .home-quote-group {
            display: grid;
            align-content: start;
            gap: clamp(12px, 1.4vw, 18px);
            min-width: 0;
          }

          .home-quote {
            margin: 0;
            width: 100%;
            max-width: 590px;
            color: var(--text);
            font-size: clamp(1.46rem, 2.3vw, 2.3rem);
            font-weight: 800;
            line-height: 1.02;
            letter-spacing: -.035em;
            text-transform: uppercase;
            overflow-wrap: normal;
          }

          .home-quote span,
          .home-quote em {
            display: block;
          }

          .home-quote em {
            margin-top: .05em;
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: 1.16em;
            font-style: italic;
            font-weight: 500;
            line-height: .86;
            letter-spacing: -.035em;
            text-transform: none;
          }

          html[lang="en"] .home-quote {
            font-size: clamp(1.32rem, 2.05vw, 2.05rem);
          }

          .home-intro-description {
            margin: 0;
            min-width: 0;
            max-width: 72ch;
            color: var(--text);
            font-size: clamp(1rem, 1.3vw, 1.1rem);
            line-height: 1.62;
          }

          .home-about {'''
          index, count = intro_css.subn(intro_css_replacement, index, count=1)
          if count != 1:
              raise SystemExit(f'Expected one homepage intro CSS block, replaced {count}')

          index = replace_once(
              index,
              '      min-height: clamp(150px, 13vw, 190px);',
              '      min-height: clamp(142px, 12vw, 178px);',
              'feature card height',
          )
          index = replace_once(
              index,
              '      box-shadow: 0 10px 24px rgba(15, 23, 42, .08);',
              '      box-shadow: 0 8px 22px rgba(15, 23, 42, .065);\n      border: 1px solid color-mix(in srgb, var(--about-card-text) 10%, transparent);',
              'feature card shadow',
          )
          index = replace_once(
              index,
              '      transform: translateY(clamp(34px, 4vw, 54px));',
              '      transform: translateY(clamp(24px, 3vw, 34px));',
              'feature card stagger',
          )

          feature_marker = '    .home-about-card:nth-child(even) {'
          feature_rules = '''    .home-about-card:nth-child(1) { --about-card-bg: #C7A55A; --about-card-text: #1D1A12; }
          .home-about-card:nth-child(2) { --about-card-bg: #B56767; --about-card-text: #130A0B; }
          .home-about-card:nth-child(3) { --about-card-bg: #626799; --about-card-text: #FFFFFF; }
          .home-about-card:nth-child(4) { --about-card-bg: #789174; --about-card-text: #132012; }

          '''
          if feature_rules.strip() not in index:
              index = replace_once(index, feature_marker, feature_rules + feature_marker, 'feature palette rules')

          index = replace_once(
              index,
              '''    .tool-link:hover {
                transform: translateY(-4px) perspective(700px) rotateX(var(--tilt-y, 0deg)) rotateY(var(--tilt-x, 0deg));
                background: var(--surface-hover);
                border-color: var(--border-control);
                box-shadow: 0 18px 38px color-mix(in srgb, var(--text) 14%, transparent), 0 1px 0 rgba(255,255,255,.35) inset;
              }

              .tool-link:hover::before {
                opacity: 1;
                animation: cardBorderSpin 2.4s linear infinite;
              }

              .tool-link:hover .tool-icon-wrap {
                background: var(--surface-elevated);
                border-color: var(--border-control);
                transform: translateZ(18px) scale(1.06);
              }

              .tool-link:hover .tool-icon { animation: iconFloat .7s cubic-bezier(.16, 1, .3, 1); }''',
              '''    .tool-link:hover {
                transform: translateY(-2px);
                background: var(--surface-hover);
                border-color: var(--border-control);
                box-shadow: 0 10px 24px color-mix(in srgb, var(--text) 10%, transparent);
              }

              .tool-link:hover::before {
                opacity: 0;
                animation: none;
              }

              .tool-link:hover .tool-icon-wrap {
                background: var(--surface-elevated);
                border-color: var(--border-control);
                transform: scale(1.03);
              }

              .tool-link:hover .tool-icon { animation: none; }''',
              'tool hover effects',
          )

          desktop_marker = '    @media (max-width: 860px) {'
          desktop_rules = '''    @media (min-width: 861px) {
            .hero {
              height: 94vh;
              height: 94svh;
            }

            .homepage .container {
              gap: 10px;
            }

            .homepage .tool-link {
              min-height: 76px;
              grid-template-columns: 50px minmax(0, 1fr);
              padding: 10px 12px;
              column-gap: 11px;
              row-gap: 1px;
              border-radius: 20px;
            }

            .homepage .tool-icon-wrap {
              width: 50px;
              height: 50px;
              min-width: 50px;
              min-height: 50px;
              border-radius: 16px;
            }

            .homepage .tool-icon {
              width: calc(var(--tool-icon-size, 42px) * .8);
              height: calc(var(--tool-icon-size, 42px) * .8);
            }

            .homepage .tool-link-main {
              font-size: .95rem;
            }

            .homepage .tool-link-sub {
              font-size: .82rem;
            }
          }

          '''
          if desktop_rules.strip() not in index:
              index = replace_once(index, desktop_marker, desktop_rules + desktop_marker, 'desktop homepage refinements')

          intro_markup = re.compile(
              r'<section class="home-intro"(?P<attrs>[^>]*)>\s*'
              r'<div class="home-intro-row">\s*'
              r'(?P<quote1><p class="home-quote">.*?</p>)\s*'
              r'(?P<description><p class="home-intro-description".*?</p>)\s*'
              r'</div>\s*'
              r'(?P<quote2><p class="home-quote home-standalone-quote">.*?</p>)\s*'
              r'</section>',
              re.S,
          )
          match = intro_markup.search(index)
          if not match:
              raise SystemExit('Expected original homepage intro markup was not found')
          quote1 = textwrap.dedent(match.group('quote1')).strip()
          quote2 = textwrap.dedent(match.group('quote2')).strip().replace(
              'class="home-quote home-standalone-quote"',
              'class="home-quote"',
              1,
          )
          description = textwrap.dedent(match.group('description')).strip()
          intro_replacement = (
              f'<section class="home-intro"{match.group("attrs")}>\n'
              '      <div class="home-intro-row">\n'
              '        <div class="home-quote-group">\n'
              f'{textwrap.indent(quote1, "          ")}\n'
              f'{textwrap.indent(quote2, "          ")}\n'
              '        </div>\n'
              f'{textwrap.indent(description, "        ")}\n'
              '      </div>\n'
              '    </section>'
          )
          index = intro_markup.sub(intro_replacement, index, count=1)

          index = re.sub(
              r' style="--about-card-bg: #[0-9A-Fa-f]{6}; --about-card-text: #[0-9A-Fa-f]{6};"',
              '',
              index,
              count=4,
          )

          tilt_block = '''
                const canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
                const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

                if (canHover && !reduceMotion) {
                  document.querySelectorAll('.tool-link').forEach((card) => {
                    card.addEventListener('pointermove', (event) => {
                      const rect = card.getBoundingClientRect();
                      const x = (event.clientX - rect.left) / rect.width - 0.5;
                      const y = (event.clientY - rect.top) / rect.height - 0.5;
                      card.style.setProperty('--tilt-x', `${x * 6}deg`);
                      card.style.setProperty('--tilt-y', `${-y * 6}deg`);
                    });
                    card.addEventListener('pointerleave', () => {
                      card.style.setProperty('--tilt-x', '0deg');
                      card.style.setProperty('--tilt-y', '0deg');
                    });
                  });
                }
          '''
          if tilt_block not in index:
              raise SystemExit('Expected homepage tilt script was not found')
          index = index.replace(tilt_block, '\n', 1)

          index_path.write_text(index, encoding='utf-8')

          # 2. Remove the temporary runtime homepage loader and file.
          copy_path = Path('shared/copy-plain.js')
          copy_text = copy_path.read_text(encoding='utf-8')
          copy_text, loader_count = re.subn(
              r'\n\(function loadHomepagePolish\(\) \{.*?\}\)\(\);\s*$',
              '\n',
              copy_text,
              count=1,
              flags=re.S,
          )
          if loader_count != 1:
              raise SystemExit(f'Expected one homepage polish loader, removed {loader_count}')
          copy_path.write_text(copy_text, encoding='utf-8')

          polish_path = Path('shared/homepage-polish.js')
          if not polish_path.exists():
              raise SystemExit('shared/homepage-polish.js was not found')
          polish_path.unlink()

          # 3. Refine shared accessibility, navigation, panels and modal styling.
          ui_path = Path('shared/ui.css')
          ui = ui_path.read_text(encoding='utf-8')
          ui = replace_once(
              ui,
              '''.visually-removed {
                display: none !important;
              }''',
              '''.visually-removed {
                position: absolute !important;
                width: 1px !important;
                height: 1px !important;
                padding: 0 !important;
                margin: -1px !important;
                overflow: hidden !important;
                clip: rect(0 0 0 0) !important;
                clip-path: inset(50%) !important;
                white-space: nowrap !important;
                border: 0 !important;
              }''',
              'accessible visually hidden utility',
          )

          shared_marker = '/* Restrained design-system refinements 2026-07-23 */'
          if shared_marker not in ui:
              ui += '''

          /* Restrained design-system refinements 2026-07-23 */
          .interal-panel h2 { font-weight: 700; }
          .interal-field label,
          .interal-field > span { font-weight: 600; }
          .interal-tool-page .interal-panel { box-shadow: var(--shadow-sm); }

          @media (min-width: 980px) {
            .top-desktop-link + .top-desktop-link {
              padding-left: 12px;
              margin-left: 0;
            }

            .top-desktop-link + .top-desktop-link::after {
              display: none;
            }
          }

          .side-menu {
            border-radius: 0 24px 24px 0;
            background: color-mix(in srgb, var(--sidebar-bg) 94%, transparent);
            -webkit-backdrop-filter: blur(16px) saturate(125%);
            backdrop-filter: blur(16px) saturate(125%);
          }

          .interal-tool-page .modal-backdrop {
            background: rgba(0, 0, 0, .42);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
          }

          .interal-tool-page .modal-card {
            border-radius: 24px;
            background: var(--surface-elevated);
            box-shadow: 0 24px 70px rgba(0, 0, 0, .24);
          }
          '''
          ui_path.write_text(ui, encoding='utf-8')

          # 4. Make analytical status states distinguishable without bright colors.
          assoc_path = Path('associativvordes/index.html')
          assoc = assoc_path.read_text(encoding='utf-8')
          old_status = '''    .associativ-page .status.ok,
              .associativ-page .status.bad,
              .associativ-page .status.warn { background: var(--surface-elevated); color: var(--text); border-color: var(--border-control); }'''
          new_status = '''    .associativ-page .status.ok {
                background: color-mix(in srgb, #3a8f55 14%, var(--surface-elevated));
                border-color: color-mix(in srgb, #3a8f55 42%, var(--border-control));
                color: var(--text);
              }
              .associativ-page .status.warn {
                background: color-mix(in srgb, #b8792d 14%, var(--surface-elevated));
                border-color: color-mix(in srgb, #b8792d 42%, var(--border-control));
                color: var(--text);
              }
              .associativ-page .status.bad {
                background: color-mix(in srgb, #b45555 14%, var(--surface-elevated));
                border-color: color-mix(in srgb, #b45555 42%, var(--border-control));
                color: var(--text);
              }'''
          assoc = replace_once(assoc, old_status, new_status, 'associative status styles')
          assoc_path.write_text(assoc, encoding='utf-8')

          # 5. Align Determinator modal surfaces with the shared modal system.
          det_path = Path('determinatorofvalentyp/styles.css')
          det = det_path.read_text(encoding='utf-8')
          det_marker = '/* Restrained modal alignment 2026-07-23 */'
          if det_marker not in det:
              det += '''

          /* Restrained modal alignment 2026-07-23 */
          .determinator-page .modal-backdrop {
            background: rgba(0, 0, 0, .42);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
          }

          body.dark-theme .determinator-page .modal-backdrop {
            background: rgba(0, 0, 0, .58);
          }

          .determinator-page .modal-card {
            border-radius: 24px;
            background: var(--surface-elevated);
            box-shadow: 0 24px 70px rgba(0, 0, 0, .24);
          }
          '''
          det_path.write_text(det, encoding='utf-8')
          PY

      - name: Validate design refinements
        shell: bash
        run: |
          git diff --check
          grep -q 'class="home-quote-group"' index.html
          ! grep -q 'home-standalone-quote' index.html
          ! grep -q 'loadHomepagePolish' shared/copy-plain.js
          test ! -e shared/homepage-polish.js
          grep -q 'clip-path: inset(50%)' shared/ui.css
          grep -q 'Restrained design-system refinements' shared/ui.css
          grep -q 'color-mix(in srgb, #3a8f55 14%' associativvordes/index.html
          grep -q 'Restrained modal alignment' determinatorofvalentyp/styles.css
          grep -q 'height: 94svh' index.html
          ! grep -q 'pointermove' index.html

      - name: Commit refinements and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-design-refinements.yml
          git add -A
          git commit -m "Refine site design system without restructuring"
          git push origin main
