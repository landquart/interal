name: Apply Associative Qwen Existing Candidate Fix

on:
  push:
    branches:
      - fix/associative-candidate-quality-and-qwen-existing
    paths:
      - scripts/apply-associative-qwen-existing-candidate-fix.mjs
      - .github/workflows/apply-associative-qwen-existing-candidate-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/associative-candidate-quality-and-qwen-existing
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply patch
        run: node scripts/apply-associative-qwen-existing-candidate-fix.mjs
      - name: Validate syntax
        run: |
          node --check associativvordes/js/qwen-client.js
          node --check associativvordes/script.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Handle Qwen suggestions already present in candidate results"
          git push origin HEAD:fix/associative-candidate-quality-and-qwen-existing
