name: Historical decision registry
on:
  pull_request:
    paths:
      - 'associativvordes/history_registry/**'
      - 'scripts/*v5*.mjs'
      - 'scripts/lib/assert-historical-repair.mjs'
      - 'associativvordes/auto_annotation/**'
      - 'associativvordes/release_control/**'
      - 'audit/associative-history-registry/**'
      - 'tests/associative-history-registry.test.mjs'
      - '.github/workflows/associative-history-registry.yml'
jobs:
  constraints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s associativvordes/history_registry -p 'test_*.py'
      - run: python -m unittest discover -s associativvordes/auto_annotation -p 'test_*.py'
      - run: python -m unittest discover -s associativvordes/release_control -p 'test_*.py'
