name: Controlled release contracts
on:
  pull_request:
  push:
    branches: [main]
jobs:
  signatures-history-and-atomicity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s associativvordes/release_control -p 'test_*.py' -v
