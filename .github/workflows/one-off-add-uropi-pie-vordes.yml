name: One-off add Uropi PIE candidates

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-off-add-uropi-pie-vordes.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Append PIE candidate rows
        shell: bash
        env:
          UROPI_ROWS_GZ_B64: >-
            
        run: |
          python - <<'PY'
          import base64
          import gzip
          import json
          import os
          from pathlib import Path

          path = Path("indoeuropanvordes/pie_vordes")
          text = path.read_text(encoding="utf-8")
          data = json.loads(text)

          additions = json.loads(
              gzip.decompress(base64.b64decode(os.environ["UROPI_ROWS_GZ_B64"])).decode("utf-8")
          )

          existing = {
              (str(item.get("pie", "")).strip(), str(item.get("en", {}).get("word", "")).strip().casefold())
              for item in data.get("items", [])
          }
          additions = [
              item for item in additions
              if (str(item.get("pie", "")).strip(), str(item.get("en", {}).get("word", "")).strip().casefold())
              not in existing
          ]

          next_id = max((int(item.get("id", 0)) for item in data.get("items", [])), default=0) + 1
          for offset, item in enumerate(additions):
              item["id"] = next_id + offset

          langs = ["en", "de", "fr", "es", "it", "ru", "el"]

          def q(value):
              return json.dumps(value, ensure_ascii=False)

          def format_item(item):
              lines = [
                  "    {",
                  '      "id": ' + str(item["id"]) + ',',
                  '      "pie": ' + q(item["pie"]) + ',',
                  '      "part_of_speech": ' + q(item["part_of_speech"]) + ',',
              ]
              for lang in langs:
                  form = item[lang]
                  lines.append(
                      '      "' + lang + '": { "word": ' + q(form["word"]) +
                      ', "ipa": ' + q(form["ipa"]) + ' },'
                  )
              lines.append('      "status": ' + q(item["status"]) + ("," if item.get("note") else ""))
              if item.get("note"):
                  lines.append('      "note": ' + q(item["note"]))
              lines.append("    }")
              return "\n".join(lines)

          if additions:
              marker = "\n  ]"
              if marker not in text:
                  raise RuntimeError("Could not locate final items-array closing bracket")
              prefix, suffix = text.rsplit(marker, 1)
              prefix = prefix.rstrip()
              if data.get("items") and not prefix.endswith(","):
                  prefix += ","
              block = ",\n".join(format_item(item) for item in additions)
              updated = prefix + "\n" + block + marker + suffix
          else:
              updated = text

          parsed = json.loads(updated)
          ids = [item["id"] for item in parsed["items"]]
          if len(ids) != len(set(ids)):
              raise RuntimeError("Duplicate ids after append")
          if additions and len(parsed["items"]) != len(data["items"]) + len(additions):
              raise RuntimeError("Unexpected item count after append")

          path.write_text(updated.rstrip() + "\n", encoding="utf-8")
          print(f"Appended {len(additions)} rows; total {len(parsed['items'])}.")
          PY

          python -m json.tool indoeuropanvordes/pie_vordes >/dev/null

      - name: Commit update and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-off-add-uropi-pie-vordes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indoeuropanvordes/pie_vordes .github/workflows/one-off-add-uropi-pie-vordes.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Add Uropi-derived PIE candidate rows"
          git push origin HEAD:main
