name: Audit parallel associative family v6
on:
  pull_request:
    paths:
      - 'associativvordes/family-index-v6/**'
      - 'associativvordes/family-index-v5/**'
      - 'associativvordes/frequency lists/**'
      - 'associativvordes/js/associative-family-v6*'
      - 'scripts/*associative*v6*'
      - 'scripts/lib/associative-v6*'
      - 'audit/associative-family-v6/**'
      - 'audit/associative-family-v5/**'
      - 'tests/associative-family-v6*'
      - '.github/workflows/audit-associative-family-v6.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/associative-family-v6-architecture.test.mjs tests/associative-family-v6-migration.test.mjs tests/associative-family-v6-realizations.test.mjs tests/associative-family-v6-head-recognition.test.mjs tests/associative-family-v6-promotions.test.mjs tests/associative-family-v6-senses-policy.test.mjs tests/associative-family-v6-head-lifecycle.test.mjs
      - run: node --max-old-space-size=6144 scripts/audit-associative-family-v6.mjs associativvordes/family-index-v6/generated /tmp/v6-integrity.json
      - run: node --max-old-space-size=6144 scripts/build-associative-family-v6.mjs /tmp/v6-replay
      - name: Compare deterministic replay
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('associativvordes/family-index-v6/generated'); replay=Path('/tmp/v6-replay')
          assert {str(p.relative_to(source)) for p in source.rglob('*') if p.is_file()} == {str(p.relative_to(replay)) for p in replay.rglob('*') if p.is_file()}
          for p in source.rglob('*'):
              if p.is_file(): assert p.read_bytes() == (replay/p.relative_to(source)).read_bytes(), str(p)
          PY
      - run: node --max-old-space-size=4096 scripts/enumerate-associative-v6-source-corpus.mjs /tmp/v6-corpus.json
      - run: cmp /tmp/v6-corpus.json audit/associative-family-v6/corpus-enumeration.json
