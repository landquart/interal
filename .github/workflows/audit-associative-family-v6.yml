name: Audit parallel associative family v6
on:
  pull_request:
    paths:
      - 'associativvordes/family-index-v6/**'
      - 'associativvordes/family-index-v5/**'
      - 'associativvordes/frequency lists/**'
      - 'associativvordes/js/associative-family-v6*'
      - 'scripts/*associative*v6*'
      - 'scripts/lib/associative-v6*'
      - 'audit/associative-family-v6/**'
      - 'audit/associative-family-v5/**'
      - 'tests/associative-family-v6*'
      - '.github/workflows/audit-associative-family-v6.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/associative-family-v6-architecture.test.mjs tests/associative-family-v6-migration.test.mjs tests/associative-family-v6-realizations.test.mjs tests/associative-family-v6-head-recognition.test.mjs tests/associative-family-v6-promotions.test.mjs tests/associative-family-v6-senses-policy.test.mjs tests/associative-family-v6-head-lifecycle.test.mjs tests/associative-family-v6-queue-organization.test.mjs tests/associative-family-v6-baseline-corrections.test.mjs
      - run: node --max-old-space-size=6144 scripts/audit-associative-family-v6.mjs associativvordes/family-index-v6/generated /tmp/v6-integrity.json
      - run: node --max-old-space-size=6144 scripts/build-associative-family-v6.mjs /tmp/v6-replay
      - name: Compare deterministic replay
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('associativvordes/family-index-v6/generated'); replay=Path('/tmp/v6-replay')
          assert {str(p.relative_to(source)) for p in source.rglob('*') if p.is_file()} == {str(p.relative_to(replay)) for p in replay.rglob('*') if p.is_file()}
          for p in source.rglob('*'):
              if p.is_file(): assert p.read_bytes() == (replay/p.relative_to(source)).read_bytes(), str(p)
          PY
      - name: Verify frozen Prompt 03, 04 and oper-relat published snapshots
        run: python scripts/validate-associative-v6-frozen-stages.py
      - run: node --max-old-space-size=4096 scripts/enumerate-associative-v6-source-corpus.mjs /tmp/v6-corpus.json
      - run: cmp /tmp/v6-corpus.json audit/associative-family-v6/corpus-enumeration.json
      - name: Audit finite cross-frame planning and shared cache
        run: node --max-old-space-size=6144 scripts/audit-associative-v6-queue-organization.mjs
      - name: Replay planning from saved frames without corpus reclustering
        run: |
          node --max-old-space-size=6144 scripts/build-associative-v6-queue-organization.mjs /tmp/v6-planning-replay
          diff -r audit/associative-family-v6/prompt09-shadow-20261007/planning /tmp/v6-planning-replay
      - name: Replay certification and verify exact history/corrections/overlap
        run: |
          node --max-old-space-size=4096 scripts/build-associative-v6-history-certification.mjs /tmp/v6-certification-replay
          python scripts/audit-associative-v6-history-certification.py /tmp/v6-certification-replay /tmp/v6-planning-replay

      - name: Audit nonmutating contamination partitions and replay
        run: |
          node --test tests/associative-family-v6-contamination.test.mjs
          node scripts/audit-associative-v6-contamination.mjs
          node scripts/build-associative-v6-contamination.mjs /tmp/v6-contamination-replay
          diff -r audit/associative-family-v6/prompt07-contamination-20261005/generated /tmp/v6-contamination-replay

      - name: Audit finite coverage and packet lifecycle
        run: |
          node --test tests/associative-family-v6-packet-lifecycle.test.mjs
          python scripts/audit-associative-v6-candidate-coverage.py
          node scripts/build-associative-v6-packet-lifecycle.mjs /tmp/v6-packet-lifecycle-replay
          diff -r audit/associative-family-v6/prompt08-coverage-20261005/packet-lifecycle /tmp/v6-packet-lifecycle-replay
          python scripts/measure-associative-v6-candidate-coverage.py /tmp/v6-coverage-replay
          diff -r audit/associative-family-v6/prompt08-coverage-20261005/research-coverage /tmp/v6-coverage-replay

      - name: Audit shadow aliases, language routes and original measured rows
        run: |
          node --test tests/associative-family-v6-shadow.test.mjs
          node --max-old-space-size=4096 scripts/audit-associative-v6-shadow.mjs /tmp/v6-shadow-replay
          diff -r audit/associative-family-v6/prompt09-shadow-20261007/generated /tmp/v6-shadow-replay
