name: Finalize Five Word Limit

on:
  push:
    branches:
      - fix/restore-five-word-limit
    paths:
      - scripts/finalize-five-word-limit.mjs
      - .github/workflows/finalize-five-word-limit.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/restore-five-word-limit
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply patch
        run: node scripts/finalize-five-word-limit.mjs
      - name: Validate syntax
        run: node --check associativvordes/script.js
      - name: Run focused test
        run: node tests/associative-model-selection-policy.test.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use five-word evidence consistently"
          git push origin HEAD:fix/restore-five-word-limit
