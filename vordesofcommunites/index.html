<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vordes of communités</title>
  <link rel="stylesheet" href="../shared/ui.css?v=brand-logo-20260713-1" />
  <link rel="stylesheet" href="./styles.css?v=contact-types-20260713-1" />
</head>
<body class="interal-tool-page communities-page" data-page-state="off">
  <main class="interal-page-shell interal-page-shell--medium vord-page-shell">
    <header class="interal-page-hero vord-page-hero">
      <h1 class="interal-page-title" id="pageTitle">Vordes of communités</h1>
      <p id="pageLead"></p>
    </header>
    <div id="app">
    <section class="interal-panel card vord-panel params-panel">
          <div class="card-tools">
            <button id="resetBtn" class="card-reset-btn interal-reset-btn is-hidden" type="button" aria-label="Сбросить" title="Сбросить">
              <img src="../elements/Eraser%20Square.svg" alt="" aria-hidden="true">
            </button>
          </div>
          <h2 id="paramsTitle" class="visually-removed">Параметры слова</h2>
          <div class="field">
            <label id="wordLabel" for="wordInput">Слово в Интерaле</label>
            <input class="interal-input" id="wordInput" autocomplete="off">
          </div>
          <div class="field">
            <label id="posLabel" for="posInput">Часть речи</label>
            <select class="interal-select js-custom-select" id="posInput"></select>
          </div>
          <div class="field">
            <label id="domainLabel" for="domainInput">Область / сообщество</label>
            <input class="interal-input" id="domainInput" autocomplete="off">
          </div>
          <div class="interal-actions actions"><button class="interal-btn interal-btn--primary gradient-hover" id="checkBtn" type="button"><img class="btn-loader" src="../elements/loader_video_fitted_0_1s_triangle_fixed_centered.svg" alt="" aria-hidden="true" /><span class="btn-text">Проверить</span></button></div>
        </section>
        <div id="noticeBox"></div>
        <section class="interal-panel card vord-panel" id="evidenceSection" hidden>
          <h2 id="translationsTitle">Переводы</h2>
          <div id="translationsBox"></div>
        </section>
        <section class="interal-panel card vord-panel" id="criteriaSection" hidden>
          <h2 id="criteriaTitle">Критерии</h2>
          <div id="criteriaBox"></div>
        </section>
        <section class="interal-panel card vord-panel decision-summary" id="resultSection" hidden>
          <h2 id="decisionTitle">Решение</h2>
          <div id="resultBox"></div>
        </section>
        <div class="interal-actions interal-actions--center actions json-card-bottom-actions" id="jsonActions" hidden><button class="interal-btn interal-btn--secondary gradient-hover" id="jsonBtn" type="button" hidden disabled>Сформировать JSON-карточку</button></div>
    </div>
  </main>
  <div id="jsonCardModal" aria-hidden="true">
    <div class="modal-inner" role="dialog" aria-modal="true" aria-labelledby="jsonCardTitle">
      <button id="closeJsonCardBtn" class="json-card-close-btn" type="button" aria-label="Закрыть JSON-карточку"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke-width="2.4" stroke-linecap="round" /></svg></button>
      <h3 class="json-card-title" id="jsonCardTitle">JSON-карточка</h3>
      <div class="json-card-form">
        <label class="checkbox-line" for="useAuthorBlock"><input id="useAuthorBlock" type="checkbox"><span id="useAuthorBlockLabel">Указать авторство</span></label>
        <div id="jsonAuthorFields" class="json-author-fields" style="display:none">
          <label for="authorDisplayName" id="authorDisplayNameLabel">Имя или ник</label><input class="interal-input" id="authorDisplayName" type="text" autocomplete="name">
          <label for="authorContactType" id="authorContactTypeLabel">Тип контакта</label><select class="interal-select js-custom-select" id="authorContactType"><option value="telegram">Telegram</option><option value="discord">Discord</option><option value="email">Email</option><option value="signal">Signal</option><option value="matrix">Matrix</option><option value="simplex">Simplex</option><option value="other">Другое</option></select>
          <label for="authorContactValue" id="authorContactValueLabel">Контакт</label><input class="interal-input" id="authorContactValue" type="text" autocomplete="off">
        </div>
        <button id="generateJsonCardBtn" class="tool-btn interal-btn interal-btn--primary gradient-hover" type="button"><img class="btn-loader" src="../elements/loader_video_fitted_0_1s_triangle_fixed_centered.svg" alt="" aria-hidden="true" /><span class="btn-text">Сгенерировать карточку</span></button>
        <label for="jsonCardOutput" id="jsonCardOutputLabel">Готовый JSON</label>
        <textarea id="jsonCardOutput" class="interal-textarea json-card-output" spellcheck="false" readonly></textarea>
      </div>
      <div class="json-card-actions">
        <button id="copyJsonCardBtn" class="json-card-icon-btn menu-copy-btn" type="button" aria-label="Скопировать JSON-карточку" title="Скопировать JSON-карточку"><span class="menu-copy-icon-stack" aria-hidden="true"><img class="menu-copy-icon menu-copy-icon-link" src="../elements/Copy.svg" alt=""><svg class="menu-copy-icon menu-copy-icon-check" viewBox="0 0 24 24" focusable="false"><path d="M5 12.5l4.2 4.2L19 7" /></svg></span></button>
        <button id="downloadJsonCardBtn" class="json-card-icon-btn" type="button" aria-label="Скачать JSON-карточку" title="Скачать JSON-карточку"><span class="json-card-download-icon-stack" aria-hidden="true"><img class="json-card-download-icon" src="../elements/Download.svg" alt=""></span></button>
      </div>
    </div>
  </div>

  <script src="../shared/copy-plain.js?v=contact-types-20260713-1"></script>
  <script src="../shared/ui.js?v=brand-logo-20260713-1" defer></script>
  <script src="./script.js?v=contact-types-20260713-1" defer></script>
</body>
</html>
