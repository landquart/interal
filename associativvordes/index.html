<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon%20interal%2032.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="../favicon/favicon%20interal%2064.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="../favicon/favicon%20interal%20512.png" />
  <title>Associativ vordes</title>
  <link rel="stylesheet" href="../shared/ui.css?v=share-state-grammaticebrevivordes-20260628" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      font-family: "Jost", "Helvetica Neue", Helvetica, Arial, sans-serif;
      line-height: 1.45;
    }

    header {
      padding: 28px 18px 14px;
      max-width: 1180px;
      margin: 0 auto;
    }

    h1 { margin: 0 0 8px; font-size: 38px; text-align: center; }
    h2 { margin: 0 0 14px; font-size: 21px; }
    h3 { margin: 0 0 10px; font-size: 17px; }
    p { color: var(--text-muted); margin: 0; }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px 18px 48px;
      display: grid;
      gap: 18px;
    }

    .associativ-page .card { position: relative; padding: 18px; }


    .card-scroll-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .card-scroll-content {
      min-width: 100%;
    }

    .grid { display: grid; gap: 14px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .associativ-page label { display: block; font-weight: 650; margin-bottom: 6px; }
    .associativ-page input, .associativ-page select, .associativ-page textarea, .associativ-page .tool-btn { font: inherit; width: 100%; }

    .associativ-page textarea { min-height: 110px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

     .associativ-page .tool-btn {
      cursor: pointer;
      font-family: "Jost", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 600;
    }

    .associativ-page .interal-btn--secondary {
      background: var(--surface-elevated);
      color: var(--text);
      border-color: var(--border-control);
    }

    .associativ-page .danger {
      background: var(--surface-elevated);
      border-color: var(--border-control);
      color: var(--text);
    }

    .associativ-page .interal-btn--small {
      padding: 7px 9px;
      border-radius: var(--radius-sm);
      font-size: 13px;
    }
     .associativ-page .tool-btn:hover {
      filter: none;
      transform: translateY(-1px);
    }


    .row { display: flex; gap: 10px; align-items: center; }
    .row > * { flex: 1; }
    .row .fit { flex: 0 0 auto; }

    .actions-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .associativ-page .actions-row .interal-btn { flex: 0 1 auto; width: auto; min-width: 150px; padding-inline: 18px; }
    .fit.short { width: auto; min-width: 0; padding-inline: 12px; }
    .associativ-page .actions-row #calculateBtn { min-width: 230px; }
    .associativ-page #calculateBtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .associativ-page #calculateBtn .btn-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .associativ-page .btn-spinner { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.75s linear infinite; display: none; flex: 0 0 auto; }
    .associativ-page .is-loading .btn-spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .json-card-bottom-actions { max-width: 828px; margin: -8px auto 20px; justify-content: flex-end; padding: 0 18px; box-sizing: border-box; }


    .muted { color: var(--text-muted); }
    .note { background: var(--surface); padding: 12px; border-radius: var(--radius-md); color: var(--text); border: 1px solid var(--border-subtle); }

    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: flex-start; }
    .associativ-page .tab {
      width: auto;
      flex: 0 0 auto;
      border-radius: var(--radius-pill);
      font: 600 0.95rem "Jost", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--button-secondary-bg);
      color: var(--button-secondary-text);
      border-color: var(--button-secondary-border);
    }
    .associativ-page .tab.active { background: var(--button-primary-bg); color: var(--button-primary-text); border-color: transparent; }

    .associativ-page table { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); background: var(--surface); overflow: hidden; }
    .associativ-page th, .associativ-page td { border-bottom: 1px solid var(--border-control); padding: 8px; text-align: left; vertical-align: top; color: var(--text); }
    .associativ-page th { font-size: 13px; color: var(--text-muted); font-weight: 700; background: var(--surface-elevated); }
    .associativ-page td input, .associativ-page td select { padding: 7px 8px; border-radius: var(--radius-sm); }
    .associativ-page tbody tr:last-child td { border-bottom: none; }

    .associativ-page .status {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--border-subtle);
      background: var(--surface-elevated);
      color: var(--text);
    }
    .associativ-page .status.ok,
    .associativ-page .status.bad,
    .associativ-page .status.warn { background: var(--surface-elevated); color: var(--text); border-color: var(--border-control); }

    .result-box {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .associativ-page .metric {
      border: 1px solid var(--border-control);
      border-radius: var(--radius-md);
      padding: 14px;
      background: var(--surface);
    }
    .associativ-page .metric strong { font-size: 22px; display: block; }
    .associativ-page .metric span { color: var(--text-muted); font-size: 13px; }

    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    .associativ-page tr.is-high-final td { background: rgba(58, 160, 90, 0.10); }
    .associativ-page tr.is-high-domain-shift td { box-shadow: inset 0 0 0 999px rgba(210, 132, 40, 0.08); }
    .associativ-page tr.is-qwen-missing td,
    .associativ-page tr.is-swow-missing td { color: var(--text-muted); }


    .derivatives-table-wrap {
      width: 100%;
      overflow-x: auto;
      border-radius: 18px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: var(--surface);
    }

    .associativ-page .derivatives-table {
      width: 100%;
      min-width: 760px;
      border: 0;
      border-radius: 0;
      border-collapse: separate;
      border-spacing: 0;
      overflow: visible;
    }

    .associativ-page .derivatives-table th,
    .associativ-page .derivatives-table td {
      padding: 8px 10px;
      vertical-align: top;
      white-space: nowrap;
    }

    .associativ-page .derivatives-table .col-word {
      min-width: 180px;
      max-width: 260px;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .word-cell {
      min-width: 230px;
    }

    .associativ-page .word-with-check {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      width: 100%;
      margin-bottom: 0;
    }

    .associativ-page .word-select {
      width: 16px;
      height: 16px;
      min-width: 16px;
      margin: 0;
      accent-color: #8fb8ff;
      cursor: pointer;
    }

    .associativ-page .word-input {
      min-width: 0;
      width: 100%;
    }

    .word-text {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .associativ-page .derivatives-table .col-status {
      min-width: 112px;
    }

    .associativ-page .derivatives-table .col-score {
      min-width: 76px;
      text-align: right;
    }

    .associativ-page .derivatives-table .col-details {
      min-width: 92px;
      max-width: 360px;
    }

    .associativ-page .derivatives-table .col-actions {
      width: 46px;
      min-width: 46px;
      text-align: center;
    }

    .associativ-page .derivatives-table .sticky-word {
      position: sticky;
      left: 0;
      z-index: 2;
      background: var(--card-bg, var(--surface));
      box-shadow: 1px 0 0 var(--border-control);
    }

    .associativ-page .derivatives-table thead .sticky-word {
      z-index: 3;
      background: var(--surface-elevated);
    }

    .derivative-word-input {
      min-width: 0;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .derivative-details {
      max-width: 360px;
      white-space: normal;
      line-height: 1.45;
      color: var(--muted-text, var(--text-muted));
    }

    .derivative-details summary {
      cursor: pointer;
      color: var(--button-primary-bg);
      font-weight: 700;
    }

    .derivative-details dl {
      display: grid;
      grid-template-columns: max-content minmax(220px, 1fr);
      gap: 6px 12px;
      margin: 10px 0 0;
    }

    .derivative-details dt {
      font-weight: 700;
      color: var(--text);
    }

    .derivative-details dd {
      margin: 0;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .derivative-model-input {
      width: 100%;
      min-width: 160px;
    }

    .word-remove-btn {
      width: 34px;
      height: 34px;
      min-width: 34px;
      padding: 0;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      line-height: 1;
      border: 1px solid var(--border-control);
      background: var(--surface-elevated);
      color: var(--text);
      cursor: pointer;
    }

    .word-remove-btn:hover,
    .word-remove-btn:focus-visible {
      border-color: var(--button-primary-bg);
      color: var(--button-primary-bg);
    }



    @media (max-width: 850px) {
      .grid-2, .grid-3, .result-box { grid-template-columns: 1fr; }
      .row { flex-direction: column; align-items: stretch; }
      .associativ-page table { display: block; overflow-x: auto; white-space: nowrap; }
      .associativ-page .derivatives-table { display: table; overflow: visible; }
    }

    @media (max-width: 560px) {
      header,
      main {
        width: 100%;
        max-width: 100%;
      }

      header {
        padding: 16px 10px 10px;
      }

      main {
        padding: 10px 10px 34px;
        gap: 12px;
      }

      .associativ-page .card {
        padding: 14px;
        border-radius: var(--radius-md);
      }

      h1 { font-size: 28px; line-height: 1.2; word-break: break-word; }
      h2 { font-size: 19px; }

      .associativ-page .actions-row .interal-btn,
      .associativ-page .actions-row #calculateBtn,
      .fit.short {
        width: 100%;
        min-width: 0;
      }

      .tabs {
        flex-direction: column;
        align-items: flex-start;
      }

      .associativ-page .tab {
        width: fit-content;
        max-width: 100%;
        text-align: left;
      }


      .associativ-page input, .associativ-page select, .associativ-page textarea, .associativ-page .tool-btn {
        font-size: 16px;
      }

      .card-scroll-content {
        min-width: 100%;
      }

      .card-scroll-wrap table {
        white-space: nowrap;
      }

      .associativ-page input,
      .associativ-page select,
      .associativ-page textarea {
        min-width: 0;
        width: 100%;
      }
    }

    .associativ-page #jsonCardModal { position: fixed; inset: 0; opacity: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; background: rgba(0,0,0,.35); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: var(--z-page-modal); }
    .associativ-page #jsonCardModal.show { opacity: 1; pointer-events: auto; }
    body.dark-theme .associativ-page #jsonCardModal { background: rgba(0,0,0,.62); }
    .associativ-page .modal-inner { position: relative; display: flex; flex-direction: column; max-width: 860px; width: 100%; margin: 0; padding: 24px; max-height: calc(100vh - 32px); overflow: hidden; background: var(--surface); color: var(--text); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); }
    .associativ-page .json-card-title { margin: 0 42px 14px; text-align: center; font-size: 1.5rem; font-weight: 800; line-height: 1.2; }
    .associativ-page .json-card-form { overflow: auto; flex: 1 1 auto; min-height: 0; }
    .associativ-page .json-card-form .checkbox-line { display: flex; align-items: flex-start; gap: 8px; margin-top: 14px; color: var(--text-muted); font-size: 14px; font-weight: 600; }
    .associativ-page .json-card-form .checkbox-line input { flex: 0 0 auto; width: auto; margin-top: 3px; }
    .associativ-page .json-card-form .checkbox-line span { flex: 1 1 auto; }
    .associativ-page .json-author-fields { margin-top: 12px; padding: 14px; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); background: var(--surface-elevated); }
    .associativ-page .json-card-output { min-height: 260px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.45; white-space: pre; }
    .associativ-page .json-card-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .associativ-page .json-card-icon-btn { width: 44px; height: 44px; padding: 0; margin-top: 0; display: inline-grid; place-items: center; border-radius: 999px; background: color-mix(in srgb, #67b3ff 24%, var(--surface-elevated)); border: 1px solid color-mix(in srgb, #67b3ff 45%, transparent); color: var(--text); cursor: pointer; transition: transform .22s ease, background-color .22s ease, color .22s ease, border-color .22s ease, box-shadow .22s ease, filter .22s ease; }
    .associativ-page .json-card-icon-btn:hover, .associativ-page .json-card-icon-btn:focus-visible { background: color-mix(in srgb, #67b3ff 34%, var(--surface-hover)); transform: translateY(-2px) scale(1.01); }
    .associativ-page .json-card-icon-btn:active { transform: scale(.98); }
    .associativ-page .json-card-icon-btn.is-copied { background: color-mix(in srgb, #48d17f 30%, var(--surface-elevated)); border-color: color-mix(in srgb, #48d17f 58%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, #48d17f 26%, transparent), 0 10px 22px color-mix(in srgb, #48d17f 18%, transparent); }
    .associativ-page .json-card-icon-btn .menu-copy-icon-link, .associativ-page .json-card-download-icon { filter: var(--menu-icon-filter, none); }
    .associativ-page .json-card-download-icon-stack { width: 20px; height: 20px; display: grid; place-items: center; line-height: 0; }
    .associativ-page .json-card-download-icon { width: 20px; height: 20px; display: block; object-fit: contain; }
    body.dark-theme .associativ-page .json-card-icon-btn { background: color-mix(in srgb, #3f8ed8 34%, var(--surface-elevated)); border-color: color-mix(in srgb, #8bc7ff 44%, transparent); }
    body.dark-theme .associativ-page .json-card-icon-btn.is-copied { background: color-mix(in srgb, #4fe28b 24%, var(--surface-elevated)); border-color: color-mix(in srgb, #8dffba 48%, transparent); }
    .associativ-page .json-card-close-btn { position: absolute; top: 14px; right: 14px; width: 38px; height: 38px; padding: 0; margin: 0; display: inline-grid; place-items: center; border-radius: 999px; border: 1px solid transparent; background: transparent; color: var(--text); cursor: pointer; transition: transform .22s ease, background-color .22s ease, border-color .22s ease; }
    .associativ-page .json-card-close-btn:hover, .associativ-page .json-card-close-btn:focus-visible { background: var(--surface-hover); border-color: var(--border-control); transform: translateY(-1px); }
    .associativ-page .json-card-close-btn:active { transform: scale(.98); }
    .associativ-page .json-card-close-btn svg { width: 18px; height: 18px; stroke: currentColor; }

  </style>
</head>
<body class="associativ-page" data-page-state="off">
  <header>
    <h1>Associativ vordes</h1>
  </header>

  <main>
    <section class="card grid grid-2">
      <div class="card-tools">
        <button class="card-reset-btn interal-reset-btn is-hidden" id="resetBtn" aria-label="Сбросить" title="Сбросить">
          <img src="../elements/Eraser%20Square.svg" alt="" aria-hidden="true"  />
        </button>
      </div>
      <div style="grid-column: 1 / -1;">
        <h2 id="searchTitle">1) Параметры поиска</h2>
        <p class="muted" id="searchNote">Сначала задайте корень и тип элемента, затем запустите расчёт.</p>
      </div>
      <div>
        <label for="rootInput" id="rootLabel">Кандидатный корень / предлог</label>
        <input class="interal-input" id="rootInput" value="" placeholder="например: ocul, regul, inter" />
      </div>
      <div>
        <label for="meaningInput" id="meaningLabel">Перевод / значение</label>
        <input class="interal-input" id="meaningInput" value="" placeholder="например: глаз, правило, между" />
      </div>
      <div style="grid-column: 1 / -1; max-width: 420px; margin: 0 auto; width: 100%;">
        <label for="elementType" id="elementTypeLabel">Тип элемента</label>
        <select class="interal-select js-custom-select" id="elementType">
          <option value="root" id="rootOption">корень</option>
          <option value="preposition" id="prepositionOption">предлог / приставка</option>
        </select>
      </div>
      <div class="row actions-row" style="grid-column: 1 / -1;">
        <button class="tool-btn interal-btn interal-btn--primary" id="calculateBtn" type="button"><span class="btn-spinner" aria-hidden="true"></span><span class="btn-text" id="searchBtn">Найти дериваты и посчитать</span></button>
        <button class="tool-btn interal-btn interal-btn--secondary" id="showExampleBtn">Показать пример</button>
      </div>
    </section>

    <section class="card card-scroll-wrap">
      <div class="card-scroll-content">
      <h2 id="resultTitle">2) Итог</h2>
      <div class="result-box" id="resultBox"></div>
      <div style="margin-top: 12px;" id="decisionBox"></div>
      </div>
    </section>

    <section class="card card-scroll-wrap">
      <div class="card-scroll-content">
      <h2 id="languagesTitle">3) Языки и дериваты</h2>
      <div class="tabs" id="tabs"></div>
      <div id="languagePanel"></div>
      </div>
    </section>

    <div class="row actions-row json-card-bottom-actions">
      <button class="tool-btn interal-btn interal-btn--secondary" id="jsonCardBtn" hidden>Сформировать JSON-карточку</button>
    </div>

  <div id="jsonCardModal">
    <div class="modal-inner">
      <button id="closeJsonCardBtn" class="json-card-close-btn" type="button" aria-label="Закрыть JSON-карточку"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke-width="2.4" stroke-linecap="round" /></svg></button>
      <h3 class="json-card-title" id="jsonCardTitle">JSON-карточка</h3>
      <div class="json-card-form">
        <label class="checkbox-line" for="useAuthorBlock"><input id="useAuthorBlock" type="checkbox"><span id="useAuthorBlockLabel">Указать авторство</span></label>
        <div id="jsonAuthorFields" class="json-author-fields" style="display:none">
          <label for="authorDisplayName" id="authorDisplayNameLabel">Имя или ник</label><input class="interal-input" id="authorDisplayName" type="text" autocomplete="name">
          <label for="authorContactType" id="authorContactTypeLabel">Тип контакта</label><select class="interal-select" id="authorContactType"><option value="telegram">telegram</option><option value="matrix">matrix</option><option value="email">email</option></select>
          <label for="authorContactValue" id="authorContactValueLabel">Контакт</label><input class="interal-input" id="authorContactValue" type="text" autocomplete="off">
        </div>
        <button id="generateJsonCardBtn" class="tool-btn interal-btn interal-btn--primary" type="button">Сгенерировать карточку</button>
        <label for="jsonCardOutput" id="jsonCardOutputLabel">Готовый JSON</label><textarea id="jsonCardOutput" class="interal-textarea json-card-output" readonly></textarea>
      </div>
      <div class="json-card-actions">
        <button id="copyJsonCardBtn" class="json-card-icon-btn menu-copy-btn" type="button" aria-label="Скопировать JSON-карточку" title="Скопировать JSON-карточку"><span class="menu-copy-icon-stack" aria-hidden="true"><img class="menu-copy-icon menu-copy-icon-link" src="../elements/Copy.svg" alt=""><svg class="menu-copy-icon menu-copy-icon-check" viewBox="0 0 24 24" focusable="false"><path d="M5 12.5l4.2 4.2L19 7" /></svg></span></button>
        <button id="downloadJsonCardBtn" class="json-card-icon-btn" type="button" aria-label="Скачать JSON-карточку" title="Скачать JSON-карточку"><span class="json-card-download-icon-stack" aria-hidden="true"><img class="json-card-download-icon" src="../elements/Download.svg" alt=""></span></button>
      </div>
    </div>
  </div>

  </main>

  <script type="module" src="./script.js"></script>

  <script src="../shared/copy-plain.js"></script>
  <script src="../shared/ui.js?v=share-state-grammaticebrevivordes-20260628"></script>
</body>
</html>
