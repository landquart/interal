<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon%20interal%2032.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="../favicon/favicon%20interal%2064.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="../favicon/favicon%20interal%20512.png" />
  <title>Associativ vordes</title>
  <link rel="preload" href="../elements/loader_video_fitted_0_1s_triangle_fixed_centered.svg" as="image" type="image/svg+xml" fetchpriority="high" />
  <link rel="stylesheet" href="../shared/ui.css?v=interal-ui-20260809-5" />
  <style>
    h2 { margin: 0 0 14px; font-size: 21px; }
    h3 { margin: 0 0 10px; font-size: 17px; }
    p { color: var(--text-muted); margin: 0; }

    .associativ-page .card { position: relative; }

    .associativ-search-card .card-tools {
      position: static;
      grid-column: 1 / -1;
      width: 100%;
      justify-self: end;
    }

    .associativ-search-card .card-tools:has(.card-reset-btn.is-hidden) {
      display: none;
    }

    .card-scroll-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .card-scroll-content {
      min-width: 100%;
    }

    .grid { display: grid; gap: 14px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .associativ-page label { display: block; margin-bottom: 6px; }

    .associativ-page textarea { min-height: 110px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    .associativ-page .interal-btn--secondary {
      background: var(--surface-elevated);
      color: var(--text);
      border-color: var(--border-control);
    }

    .associativ-page .danger {
      background: var(--surface-elevated);
      border-color: var(--border-control);
      color: var(--text);
    }

    .associativ-page .interal-btn--small {
      padding: 7px 9px;
      border-radius: var(--radius-sm);
      font-size: 13px;
    }
     .associativ-page .tool-btn:hover {
      filter: none;
      transform: translateY(-1px);
    }


    .row { display: flex; gap: 10px; align-items: center; }
    .row > * { flex: 1; }
    .row .fit { flex: 0 0 auto; }

    .actions-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .associativ-page .actions-row .interal-btn { flex: 0 1 auto; width: auto; min-width: 0; padding-inline: 18px; }
    .fit.short { width: auto; min-width: 0; padding-inline: 12px; }
    .json-card-bottom-actions { margin-top: 0; }


    .muted { color: var(--text-muted); }
    .note { background: var(--surface); padding: 12px; border-radius: var(--radius-md); color: var(--text); border: 1px solid var(--border-subtle); }

    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: flex-start; }
    .associativ-page .tab {
      width: auto;
      flex: 0 0 auto;
      border-radius: var(--radius-pill);
      font: 600 0.95rem "Jost", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--button-secondary-bg);
      color: var(--button-secondary-text);
      border-color: var(--button-secondary-border);
    }
    .associativ-page .tab.active { background: color-mix(in srgb, var(--brand-gold) 18%, var(--surface-elevated)); color: var(--text); border-color: var(--brand-gold-border); box-shadow: none; }

    .associativ-page table { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); background: var(--surface); overflow: hidden; }
    .associativ-page th, .associativ-page td { border-bottom: 1px solid var(--border-control); padding: 8px; text-align: left; vertical-align: top; color: var(--text); }
    .associativ-page th { font-size: 13px; color: var(--text-muted); font-weight: 700; background: var(--surface-elevated); }
    .associativ-page td input, .associativ-page td select, .associativ-page td .interal-select-trigger { padding: 7px 8px; border-radius: var(--radius-sm); }
    .associativ-page tbody tr:last-child td { border-bottom: none; }

    .associativ-page .status {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--border-subtle);
      background: var(--surface-elevated);
      color: var(--text);
    }
    .associativ-page .status.ok,
    .associativ-page .status.bad,
    .associativ-page .status.warn { background: var(--surface-elevated); color: var(--text); border-color: var(--border-control); }

    .result-box {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(210px, 100%), 1fr));
      gap: 12px;
      min-width: 0;
    }
    .associativ-page .metric {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border-control);
      border-radius: var(--radius-md);
      padding: 14px;
      background: var(--surface);
      transform-origin: center;
    }

    .result-box > details {
      grid-column: 1 / -1;
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .result-box > details summary {
      width: fit-content;
      max-width: 100%;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .result-table-scroll {
      width: 100%;
      max-width: 100%;
      margin-top: 6px;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      -webkit-overflow-scrolling: touch;
    }

    .result-table-scroll table {
      width: 100%;
      min-width: 720px;
      margin: 0;
    }

    .acceptance-criteria ul {
      max-width: 100%;
      margin: 8px 0 0;
      padding-left: 22px;
    }

    .acceptance-criteria li {
      max-width: 100%;
      overflow-wrap: anywhere;
    }
    .result-box.is-updated .metric,
    .associativ-page .metric.is-updated {
      animation: resultPop .42s cubic-bezier(.16, 1, .3, 1);
    }
    @keyframes resultPop {
      0% { transform: scale(.985); opacity: .72; }
      58% { transform: scale(1.018); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .associativ-page .metric:first-child { border-color: var(--brand-gold-border); box-shadow: inset 0 3px 0 var(--brand-gold), var(--shadow-sm); }
    .associativ-page .metric:first-child strong { color: var(--brand-gold-text); }
    .associativ-page .metric strong {
      display: block;
      max-width: 100%;
      font-size: clamp(18px, 1.65vw, 22px);
      line-height: 1.18;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: normal;
    }
    .associativ-page .metric span {
      display: block;
      max-width: 100%;
      color: var(--text-muted);
      font-size: 13px;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    .associativ-page tr.is-high-final td { background: rgba(58, 160, 90, 0.10); }
    .associativ-page tr.is-high-domain-shift td { box-shadow: inset 0 0 0 999px rgba(210, 132, 40, 0.08); }
    .associativ-page tr.is-qwen-missing td,
    .associativ-page tr.is-swow-missing td { color: var(--text-muted); }


    .derivatives-table-wrap {
      width: 100%;
      overflow-x: auto;
      border-radius: 18px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: var(--surface);
    }

    .associativ-page .derivatives-table {
      width: 100%;
      min-width: 760px;
      border: 0;
      border-radius: 0;
      border-collapse: separate;
      border-spacing: 0;
      overflow: visible;
    }

    .associativ-page .derivatives-table th,
    .associativ-page .derivatives-table td {
      padding: 8px 10px;
      vertical-align: top;
      white-space: nowrap;
      transition: background-color .16s ease, box-shadow .16s ease;
    }
    .associativ-page .derivatives-table tbody tr {
      transition: background-color .16s ease, box-shadow .16s ease;
    }
    .associativ-page .derivatives-table tbody tr:hover td {
      background: color-mix(in srgb, var(--surface-hover) 72%, transparent);
    }
    .associativ-page .derivatives-table tbody tr.is-selected td {
      background: color-mix(in srgb, var(--brand-gold) 9%, var(--surface));
    }

    .associativ-page .derivatives-table .col-word {
      min-width: 180px;
      max-width: 260px;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .word-cell {
      min-width: 230px;
    }

    .associativ-page .word-with-check {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      width: 100%;
      margin-bottom: 0;
    }

    .associativ-page .word-select {
      width: 16px;
      height: 16px;
      min-width: 16px;
      margin: 0;
      accent-color: var(--brand-gold-control);
      cursor: pointer;
    }

    .associativ-page .word-input {
      min-width: 0;
      width: 100%;
    }

    .word-text {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .associativ-page .derivatives-table .col-status {
      min-width: 112px;
    }

    .associativ-page .derivatives-table .col-score {
      min-width: 76px;
      text-align: right;
    }

    .associativ-page .derivatives-table .col-details {
      min-width: 92px;
      max-width: 360px;
    }

    .associativ-page .derivatives-table .col-actions {
      width: 46px;
      min-width: 46px;
      text-align: center;
    }

    .associativ-page .derivatives-table .sticky-word {
      position: sticky;
      left: 0;
      z-index: 2;
      background: var(--card-bg, var(--surface));
      box-shadow: 1px 0 0 var(--border-control);
    }
    .associativ-page .derivatives-table tbody tr:hover .sticky-word {
      box-shadow: 2px 0 0 color-mix(in srgb, var(--text) 22%, transparent), 1px 0 0 var(--border-control);
    }

    .associativ-page .derivatives-table thead .sticky-word {
      z-index: 3;
      background: var(--surface-elevated);
    }

    .derivative-word-input {
      min-width: 0;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .derivative-details {
      max-width: 360px;
      white-space: normal;
      line-height: 1.45;
      color: var(--muted-text, var(--text-muted));
    }

    .derivative-details summary {
      cursor: pointer;
      color: var(--button-primary-bg);
      font-weight: 700;
    }

    .derivative-details dl {
      display: grid;
      grid-template-columns: max-content minmax(220px, 1fr);
      gap: 6px 12px;
      margin: 10px 0 0;
    }

    .derivative-details dt {
      font-weight: 700;
      color: var(--text);
    }

    .derivative-details dd {
      margin: 0;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .derivative-model-input {
      width: 100%;
      min-width: 160px;
    }

    .word-remove-btn {
      width: 34px;
      height: 34px;
      min-width: 34px;
      padding: 0;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      line-height: 1;
      border: 1px solid var(--border-control);
      background: var(--surface-elevated);
      color: var(--text);
      cursor: pointer;
    }

    .word-remove-btn:hover,
    .word-remove-btn:focus-visible {
      border-color: var(--button-primary-bg);
      color: var(--button-primary-bg);
    }



    @media (max-width: 850px) {
      .grid-2, .grid-3, .result-box { grid-template-columns: 1fr; }
      .row { flex-direction: column; align-items: stretch; }
      .associativ-page table { display: block; overflow-x: auto; white-space: nowrap; }
      .associativ-page .derivatives-table { display: table; overflow: visible; }
    }

    @media (max-width: 560px) {
      h1 { word-break: break-word; }
      h2 { font-size: 19px; }

      .associativ-page .actions-row .interal-btn,
      .associativ-page .actions-row #calculateBtn,
      .fit.short {
        width: 100%;
        min-width: 0;
      }

      .tabs {
        flex-direction: column;
        align-items: flex-start;
      }

      .associativ-page .tab {
        width: fit-content;
        max-width: 100%;
        text-align: left;
      }


      .associativ-page input, .associativ-page select, .associativ-page textarea, .associativ-page .tool-btn, .associativ-page .interal-select-trigger {
        font-size: 16px;
      }

      .card-scroll-content {
        min-width: 100%;
      }

      .card-scroll-wrap table {
        white-space: nowrap;
      }

      .associativ-page input,
      .associativ-page select,
      .associativ-page textarea,
      .associativ-page .interal-select-trigger {
        min-width: 0;
        width: 100%;
      }
    }



    </style>
</head>
<body class="interal-tool-page associativ-page" data-page-state="on">
  <main class="interal-page-shell interal-page-shell--medium">
  <header class="interal-page-hero">
    <h1 class="interal-page-title">Associativ vordes</h1>
  </header>
    <section class="interal-panel card grid grid-2 associativ-search-card">
      <div class="card-tools">
        <button class="card-reset-btn interal-reset-btn is-hidden" id="resetBtn" aria-label="Сбросить" title="Сбросить">
          <img src="../elements/Eraser%20Square.svg" alt="" aria-hidden="true"  />
        </button>
      </div>
      <div class="visually-removed" style="grid-column: 1 / -1;">
        <h2 id="searchTitle">Параметры поиска</h2>
        <p class="muted" id="searchNote">Сначала задайте корень и тип элемента, затем запустите расчёт.</p>
      </div>
      <div>
        <label for="rootInput" id="rootLabel">Кандидатный корень / предлог</label>
        <input class="interal-input" id="rootInput" value="" placeholder="например: ocul, regul, inter" />
      </div>
      <div>
        <label for="targetMeaningInput" id="targetMeaningLabel">Значение для анализа</label>
        <input class="interal-input" id="targetMeaningInput" value="" placeholder="например: другой" />
      </div>
      <div>
        <label for="elementType" id="elementTypeLabel">Тип элемента</label>
        <select class="interal-select js-custom-select" id="elementType">
          <option value="root" id="rootOption">корень</option>
          <option value="preposition" id="prepositionOption">предлог</option>
        </select>
      </div>
      <div class="interal-actions row actions-row" style="grid-column: 1 / -1;">
        <button class="tool-btn interal-btn interal-btn--primary gradient-hover" id="calculateBtn" type="button">
          <img class="btn-loader" src="../elements/loader_video_fitted_0_1s_triangle_fixed_centered.svg" alt="" aria-hidden="true" />
          <span class="btn-text" id="searchBtn">Рассчитать</span>
        </button>
        <button class="tool-btn interal-btn interal-btn--secondary" id="showExampleBtn">Показать пример</button>
      </div>
    </section>

    <section class="interal-panel card card-scroll-wrap" id="resultSection" hidden>
      <div class="card-scroll-content">
      <h2 id="resultTitle">Итог</h2>
      <div class="result-box" id="resultBox"></div>
      <div style="margin-top: 12px;" id="decisionBox"></div>
      </div>
    </section>

    <section class="interal-panel card card-scroll-wrap" id="languagesSection" hidden>
      <div class="card-scroll-content">
      <h2 id="languagesTitle">Языки и дериваты</h2>
      <div class="tabs" id="tabs"></div>
      <div id="languagePanel"></div>
      </div>
    </section>

    <div class="interal-actions interal-actions--center row actions-row json-card-bottom-actions">
      <button class="tool-btn interal-btn interal-btn--secondary gradient-hover" id="jsonCardBtn" hidden>Сформировать JSON-карточку</button>
    </div>

  <div id="jsonCardModal" aria-hidden="true">
    <div class="modal-inner" role="dialog" aria-modal="true" aria-labelledby="jsonCardTitle">
      <button id="closeJsonCardBtn" class="json-card-close-btn" type="button" aria-label="Закрыть JSON-карточку"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke-width="2.4" stroke-linecap="round" /></svg></button>
      <h3 class="json-card-title" id="jsonCardTitle">JSON-карточка</h3>
      <div class="json-card-form">
        <label class="checkbox-line" for="useAuthorBlock"><input id="useAuthorBlock" type="checkbox"><span id="useAuthorBlockLabel">Указать авторство</span></label>
        <div id="jsonAuthorFields" class="json-author-fields" style="display:none">
          <label for="authorDisplayName" id="authorDisplayNameLabel">Имя или ник</label><input class="interal-input" id="authorDisplayName" type="text" autocomplete="name">
          <label for="authorContactType" id="authorContactTypeLabel">Тип контакта</label><select class="interal-select js-custom-select" id="authorContactType"><option value="telegram">Telegram</option><option value="discord">Discord</option><option value="email">Email</option><option value="signal">Signal</option><option value="matrix">Matrix</option><option value="simplex">Simplex</option><option value="other">Другое</option></select>
          <label for="authorContactValue" id="authorContactValueLabel">Контакт</label><input class="interal-input" id="authorContactValue" type="text" autocomplete="off">
          <label class="checkbox-line" for="rememberAuthorData"><input id="rememberAuthorData" type="checkbox"><span id="rememberAuthorDataLabel">Запомнить для следующих карточек</span></label>
          <div class="author-data-actions" hidden><button class="author-data-delete-button" id="clearSavedAuthorData" type="button" hidden>Удалить сохранённые данные</button></div>
        </div>
        <button id="generateJsonCardBtn" class="tool-btn interal-btn interal-btn--primary gradient-hover" type="button">Сгенерировать карточку</button>
        <label for="jsonCardOutput" id="jsonCardOutputLabel">Готовый JSON</label><textarea id="jsonCardOutput" class="interal-textarea json-card-output" spellcheck="false" readonly></textarea>
      </div>
      <div class="json-card-actions">
        <button id="copyJsonCardBtn" class="json-card-icon-btn menu-copy-btn" type="button" aria-label="Скопировать JSON-карточку" title="Скопировать JSON-карточку"><span class="menu-copy-icon-stack" aria-hidden="true"><img class="menu-copy-icon menu-copy-icon-link" src="../elements/Copy.svg" alt=""><svg class="menu-copy-icon menu-copy-icon-check" viewBox="0 0 24 24" focusable="false"><path d="M5 12.5l4.2 4.2L19 7" /></svg></span></button>
        <button id="downloadJsonCardBtn" class="json-card-icon-btn" type="button" aria-label="Скачать JSON-карточку" title="Скачать JSON-карточку"><span class="json-card-download-icon-stack" aria-hidden="true"><img class="json-card-download-icon" src="../elements/Download.svg" alt=""></span></button>
      </div>
    </div>
  </div>

  </main>

  <script src="../shared/copy-plain.js?v=contact-types-20260713-1"></script>
  <script src="../shared/ui.js?v=interal-ui-20260809-3" defer></script>
  <script src="../shared/button-status.js?v=button-loader-20260716-1" defer></script>
  <script type="module" src="./script.js?v=associative-type-only-20260804-1"></script>
  <script src="../shared/form-draft.js?v=page-state-20260716-1" defer></script>
</body>
</html>
