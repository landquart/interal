<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alter vordes</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon%20interal%2032.png" />
  <link rel="stylesheet" href="../shared/ui.css?v=altervordes-simple-20260628" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="altervordes-page" data-page-state="off">
  <main class="vord-page-shell">
    <header class="vord-page-hero">
      <h1 id="pageTitle">Alter vordes</h1>
    </header>

    <div id="app">
      <section class="card vord-panel params-panel">
        <div class="card-tools">
          <button id="resetBtn" class="card-reset-btn interal-reset-btn is-hidden" type="button" aria-label="Сбросить" title="Сбросить">
            <img src="../elements/Eraser%20Square.svg" alt="" aria-hidden="true">
          </button>
        </div>

        <h2 id="paramsTitle">Параметры слова</h2>

        <div class="field">
          <label id="translationLabel" for="translationInput">Перевод</label>
          <input class="interal-input" id="translationInput" autocomplete="off">
        </div>

        <div class="field">
          <label id="candidateLabel" for="candidateInput">Форма в Интерaле</label>
          <input class="interal-input" id="candidateInput" autocomplete="off">
        </div>

        <div class="field">
          <label id="posLabel" for="posInput">Часть речи</label>
          <select class="interal-select" id="posInput"></select>
        </div>

        <div class="field">
          <label id="commentLabel" for="commentInput">Комментарий</label>
          <textarea class="interal-textarea" id="commentInput"></textarea>
        </div>

        <div class="actions">
          <button class="interal-btn interal-btn--primary" id="checkBtn" type="button">Проверить</button>
        </div>
      </section>

      <section class="card vord-panel decision-summary" id="resultSection" hidden>
        <h2 id="decisionTitle">Решение</h2>
        <div id="resultBox"></div>
      </section>

      <div class="actions json-card-bottom-actions">
        <button class="interal-btn interal-btn--secondary" id="jsonBtn" type="button" hidden disabled>Сформировать JSON-карточку</button>
        <button class="interal-btn interal-btn--secondary" id="linkBtn" type="button">Скопировать ссылку</button>
      </div>
    </div>
  </main>

  <div id="jsonCardModal" aria-hidden="true">
    <div class="modal-inner" role="dialog" aria-modal="true" aria-labelledby="jsonCardTitle">
      <button id="closeJsonCardBtn" class="json-card-close-btn" type="button" aria-label="Закрыть JSON-карточку">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke-width="2.4" stroke-linecap="round" /></svg>
      </button>
      <h3 class="json-card-title" id="jsonCardTitle">JSON-карточка</h3>
      <textarea id="jsonCardOutput" class="interal-textarea json-card-output" spellcheck="false" readonly></textarea>
      <div class="json-card-actions">
        <button id="copyJsonCardBtn" class="interal-btn interal-btn--secondary" type="button">Скопировать JSON</button>
        <button id="downloadJsonCardBtn" class="interal-btn interal-btn--secondary" type="button">Скачать JSON</button>
      </div>
    </div>
  </div>

  <script src="../shared/copy-plain.js"></script>
  <script src="../shared/ui.js?v=altervordes-simple-20260628"></script>
  <script src="./script.js"></script>
</body>
</html>
