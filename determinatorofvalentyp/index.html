<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

   <link rel="icon" type="image/svg+xml" href="../favicon/favicon%20interal%20contrast.svg?v=favicon-contrast-20260812-1" />
  <link rel="apple-touch-icon" sizes="512x512" href="../favicon/favicon%20interal%20512.png" />
  <title>Determinator of valen typ</title>
  <link rel="stylesheet" href="../shared/ui.css?v=interal-ui-20260820-2" />
  <link rel="stylesheet" href="styles.css?v=contact-types-20260713-1" />
</head>
<body class="interal-tool-page determinator-page" data-page-state="on">
  <main class="interal-page-shell interal-page-shell--medium app-shell">
    <header class="interal-page-hero hero">
      <h1 class="interal-page-title">Determinator of valen typ</h1>
    </header>

    <section class="interal-panel panel">
      <div class="interal-field field">
        <label id="regularWordLabel" for="regularWord">Логическая форма деривата (с разделителями)</label>
       <input class="interal-input" id="regularWord" type="text" autocomplete="off" placeholder="re/vis/ion" />
      </div>

      <div class="interal-field field">
        <div id="componentAnalysisLabel" class="field-heading">Компонентный анализ</div>
        <div id="componentsList" class="components-list empty">Компоненты не добавлены.</div>
        <div id="componentsSummary" class="components-summary">—</div>
        <button id="addComponentBtn" class="plus-btn" type="button" aria-label="Добавить компонент">
          <img class="plus-btn-icon" src="../elements/Traffic%20Economy.svg" alt="" aria-hidden="true" />
        </button>
      </div>

      <div class="interal-field field">
        <label id="logicalMeaningLabel" for="logicalMeaning">Логический анализ компонентов</label>
         <textarea class="interal-textarea" id="logicalMeaning" rows="3" placeholder="видение снова"></textarea>
      </div>

      <div class="interal-field field">
        <label id="internationalMeaningLabel" for="internationalMeaning">Международное значение эквивалентного деривата</label>
       <textarea class="interal-textarea" id="internationalMeaning" rows="3" placeholder="ревизия"></textarea>
      </div>

      <div class="interal-field field">
        <label id="naturalisticWordLabel" for="naturalisticWord">Интернациональная форма деривата (с разделителями)</label>
        <input class="interal-input" id="naturalisticWord" type="text" autocomplete="off" placeholder="re/vis/ion/u" />
      </div>

      <div class="interal-field field">
        <label id="explanationChainLabel" for="explanationChain">Объяснительная цепочка</label>
        <textarea class="interal-textarea" id="explanationChain" rows="3" placeholder="например: повторный просмотр → просмотр с целью контроля → проверка → ревизия"></textarea>
      </div>

      <div class="semantic-distance-settings" hidden aria-hidden="true">
        <input id="useLlm" type="checkbox" />
        <input id="ollamaUrl" type="text" value="http://localhost:11434" />
        <input id="ollamaModel" type="text" value="qwen3-embedding" />
        <textarea id="manualPrompt" readonly></textarea>
        <button id="buildPromptBtn" type="button" aria-label="Собрать промпт"></button>
        <button id="copyPromptBtn" type="button" aria-label="Копировать промпт"></button>
        <textarea id="manualEmbeddingResponse"></textarea>
      </div>

      <div class="panel-tools card-tools">
        <button
          class="card-reset-btn interal-reset-btn is-hidden"
          id="clearBtn"
          type="button"
          aria-label="Сбросить"
          title="Сбросить"
        >
          <img src="../elements/Eraser%20Square.svg" alt="" aria-hidden="true" />
        </button>
      </div>

      <div class="interal-actions actions">
        <button class="tool-btn interal-btn interal-btn--primary gradient-hover" id="analyzeBtn" type="button">Анализировать</button>
      </div>
    </section>

    <section class="interal-panel panel" id="resultPanel" hidden>
      <h2 id="resultTitle">Результат</h2>
      <div id="result" class="result empty">Заполните поля и нажмите «Анализировать».</div>
    </section>
  </main>

  <div id="chooserModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal="true"></div>
    <div class="modal-card chooser-card" role="dialog" aria-modal="true" aria-labelledby="chooserTitle">
      <div class="modal-header center-header">
        <h2 id="chooserTitle">Добавить элемент</h2>
        <button class="icon-btn close-btn" type="button" data-close-modal="true" aria-label="Закрыть">&times;</button>
      </div>
      <div class="chooser-grid">
        <button class="tool-btn interal-btn interal-btn--secondary chooser-option" id="chooseRootBtn" type="button">Основной корень</button>
        <button class="tool-btn interal-btn interal-btn--secondary chooser-option" id="chooseComponentBtn" type="button">Компонент (аффикс/окончание)</button>
      </div>
    </div>
  </div>

  <div id="rootModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal="true"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="rootTitle">
      <div class="modal-header">
        <button id="backFromRootBtn" class="back-btn" type="button" aria-label="Назад"><img src="../elements/Arrow%20Left.svg" alt="" aria-hidden="true" /></button>
        <h2 id="rootTitle">Основной корень</h2>
        <button class="icon-btn close-btn" type="button" data-close-modal="true" aria-label="Закрыть">&times;</button>
      </div>

      <div class="interal-field field compact-field">
        <label id="rootFormLabel" for="rootFormInput">Слово</label>
       <input class="interal-input" id="rootFormInput" type="text" autocomplete="off" placeholder="vid/er" />
      </div>

      <div class="interal-field field compact-field">
        <label id="rootMeaningLabel" for="rootMeaningInput">Значение</label>
         <input class="interal-input" id="rootMeaningInput" type="text" autocomplete="off" placeholder="видеть" />
      </div>

      <div class="interal-field field compact-field">
        <label id="assimilationLabel" for="assimilationSelect">Тип ассимиляции</label>
        <select class="interal-select js-custom-select" id="assimilationSelect"></select>
      </div>

      <div class="interal-actions actions modal-actions">
        <button class="tool-btn interal-btn interal-btn--primary" id="saveRootBtn" type="button">Добавить</button>
      </div>
    </div>
  </div>

  <div id="componentModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal="true"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="componentTitle">
      <div class="modal-header">
        <button id="backFromComponentBtn" class="back-btn" type="button" aria-label="Назад"><img src="../elements/Arrow%20Left.svg" alt="" aria-hidden="true" /></button>
        <h2 id="componentTitle">Компонент (аффикс/окончание)</h2>
        <button class="icon-btn close-btn" type="button" data-close-modal="true" aria-label="Закрыть">&times;</button>
      </div>

      <div class="interal-field field compact-field">
        <label id="componentSearchLabel" for="componentSearchInput">Поиск</label>
        <input class="interal-input" id="componentSearchInput" type="search" autocomplete="off" placeholder="-or, действие, приставка" />
        <div id="componentSearchResults" class="component-search-results" role="listbox" aria-label="Результаты поиска компонентов"></div>
      </div>

      <div class="interal-field field compact-field">
        <label id="componentCategoryLabel" for="componentCategorySelect">Категория</label>
        <select class="interal-select js-custom-select" id="componentCategorySelect"></select>
      </div>

      <div class="interal-field field compact-field">
        <label id="componentSelectLabel" for="componentSelect">Элемент</label>
        <select class="interal-select js-custom-select" id="componentSelect"></select>
      </div>


      <div class="interal-actions actions modal-actions">
        <button class="tool-btn interal-btn interal-btn--primary" id="saveComponentBtn" type="button">Добавить</button>
      </div>
    </div>
  </div>

  <div id="prefixVariantModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal="true"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="prefixVariantTitle">
      <div class="modal-header">
        <button id="backFromPrefixVariantBtn" class="back-btn" type="button" aria-label="Назад"><img src="../elements/Arrow%20Left.svg" alt="" aria-hidden="true" /></button>
        <h2 id="prefixVariantTitle">Ассимиляция приставки</h2>
        <button class="icon-btn close-btn" type="button" data-close-modal="true" aria-label="Закрыть">&times;</button>
      </div>

      <div class="interal-field field compact-field">
        <label id="prefixVariantLabel" for="prefixVariantSelect">Вариант приставки</label>
        <select class="interal-select js-custom-select" id="prefixVariantSelect"></select>
      </div>


      <div class="interal-actions actions modal-actions">
        <button class="tool-btn interal-btn interal-btn--primary" id="savePrefixVariantBtn" type="button">Добавить</button>
      </div>
    </div>
  </div>


  <script src="../shared/copy-plain.js?v=contact-types-20260713-1"></script>
  <script src="../shared/loader-paint-fix.js?v=interal-loader-20260819-3"></script>
  <script src="../shared/ui.js?v=interal-ui-20260820-2" defer></script>
  <script src="app.js?v=page-state-20260716-1" defer></script>
  <script src="../shared/form-draft.js?v=page-state-20260716-1" defer></script>
</body>
</html>
