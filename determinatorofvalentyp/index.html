<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

   <link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon%20interal%2032.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="../favicon/favicon%20interal%2064.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="../favicon/favicon%20interal%20512.png" />
  <title>Determinator of valen typ</title>
  <link rel="stylesheet" href="../shared/ui.css?v=share-state-fix-20260628" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="determinator-page" data-page-state="off">
  <main class="app-shell">
    <header class="hero">
      <h1>Determinator of valen typ</h1>
    </header>

    <section class="panel">
      <label class="field">
        <span>1 — Слово по регулярной модели (с разделителями)</span>
       <input id="regularWord" type="text" autocomplete="off" placeholder="re/vis/ion" />
      </label>

      <div class="field">
        <span>2 — Компонентный анализ</span>
        <div id="componentsList" class="components-list empty">Компоненты не добавлены.</div>
        <div id="componentsSummary" class="components-summary">—</div>
        <button id="addComponentBtn" class="plus-btn" type="button" aria-label="Добавить компонент">
          <img class="plus-btn-icon" src="../elements/Traffic%20Economy.svg" alt="" aria-hidden="true" />
        </button>
      </div>

      <label class="field">
        <span>3 — Логический анализ компонентов</span>
         <textarea id="logicalMeaning" rows="3" placeholder="vision again"></textarea>
      </label>

      <label class="field">
        <span>4 — Международное значение эквивалентного деривата</span>
       <textarea id="internationalMeaning" rows="3" placeholder="revision"></textarea>
      </label>

      <label class="field">
        <span>5 — Слово по натуралистической модели (с разделителями)</span>
        <input id="naturalisticWord" type="text" autocomplete="off" placeholder="re/vis/ion/u" />
      </label>

      <label class="field">
        <span>6 — Объяснительная цепочка</span>
        <textarea id="explanationChain" rows="3" placeholder="например: повторный просмотр → просмотр с целью контроля → проверка → ревизия"></textarea>
      </label>

      <div class="semantic-distance-settings" hidden aria-hidden="true">
        <input id="useLlm" type="checkbox" />
        <input id="ollamaUrl" type="text" value="http://localhost:11434" />
        <input id="ollamaModel" type="text" value="qwen3-embedding" />
        <textarea id="manualPrompt" readonly></textarea>
        <button id="buildPromptBtn" type="button"></button>
        <button id="copyPromptBtn" type="button"></button>
        <textarea id="manualEmbeddingResponse"></textarea>
      </div>

      <div class="panel-tools card-tools">
        <button
          class="card-reset-btn interal-reset-btn is-hidden"
          id="clearBtn"
          type="button"
          aria-label="Очистить"
          title="Очистить"
        >
          <img src="../elements/Eraser%20Square.svg" alt="" aria-hidden="true" />
        </button>
      </div>

      <div class="actions">
        <button class="tool-btn gradient-hover" id="analyzeBtn" type="button">Анализировать</button>
      </div>
    </section>

    <section class="panel" id="resultPanel" hidden>
      <h2 id="resultTitle">Результат</h2>
      <div id="result" class="result empty">Заполните поля и нажмите «Анализировать».</div>
    </section>
  </main>

  <div id="chooserModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal="true"></div>
    <div class="modal-card chooser-card" role="dialog" aria-modal="true" aria-labelledby="chooserTitle">
      <div class="modal-header center-header">
        <h2 id="chooserTitle">Add item</h2>
        <button class="icon-btn close-btn" type="button" data-close-modal="true" aria-label="Close">&times;</button>
      </div>
      <div class="chooser-grid">
        <button class="tool-btn" id="chooseRootBtn" class="chooser-option" type="button">Primary root word</button>
        <button class="tool-btn" id="chooseComponentBtn" class="chooser-option" type="button">Component (affix/ending)</button>
      </div>
    </div>
  </div>

  <div id="rootModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal="true"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="rootTitle">
      <div class="modal-header">
        <button id="backFromRootBtn" class="back-btn" type="button"><img src="../elements/Arrow%20Left.svg" alt="" aria-hidden="true" /></button>
        <h2 id="rootTitle">Primary root word</h2>
        <button class="icon-btn close-btn" type="button" data-close-modal="true" aria-label="Close">&times;</button>
      </div>

      <label class="field compact-field">
        <span>Word</span>
       <input id="rootFormInput" type="text" autocomplete="off" placeholder="vid/er" />
      </label>

      <label class="field compact-field">
        <span>Meaning</span>
         <input id="rootMeaningInput" type="text" autocomplete="off" placeholder="see" />
      </label>

      <div class="field compact-field">
        <label for="assimilationSelect">Assimilation type</label>
        <select class="interal-select js-custom-select" id="assimilationSelect"></select>
      </div>

      <div class="actions modal-actions">
        <button class="tool-btn" id="saveRootBtn" type="button">Add</button>
      </div>
    </div>
  </div>

  <div id="componentModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal="true"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="componentTitle">
      <div class="modal-header">
        <button id="backFromComponentBtn" class="back-btn" type="button"><img src="../elements/Arrow%20Left.svg" alt="" aria-hidden="true" /></button>
        <h2 id="componentTitle">Component</h2>
        <button class="icon-btn close-btn" type="button" data-close-modal="true" aria-label="Close">&times;</button>
      </div>

      <label class="field compact-field">
        <span>Search</span>
        <input id="componentSearchInput" type="search" autocomplete="off" placeholder="-or, action, prefix" />
      </label>
      <div id="componentSearchResults" class="component-search-results" role="listbox" aria-label="Component search results"></div>

      <div class="field compact-field">
        <label for="componentCategorySelect">Category</label>
        <select class="interal-select js-custom-select" id="componentCategorySelect"></select>
      </div>

      <div class="field compact-field">
        <label for="componentSelect">Element</label>
        <select class="interal-select js-custom-select" id="componentSelect"></select>
      </div>


      <div class="actions modal-actions">
        <button class="tool-btn" id="saveComponentBtn" type="button">Add</button>
      </div>
    </div>
  </div>

  <div id="prefixVariantModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal="true"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="prefixVariantTitle">
      <div class="modal-header">
        <button id="backFromPrefixVariantBtn" class="back-btn" type="button"><img src="../elements/Arrow%20Left.svg" alt="" aria-hidden="true" /></button>
        <h2 id="prefixVariantTitle">Prefix assimilation</h2>
        <button class="icon-btn close-btn" type="button" data-close-modal="true" aria-label="Close">&times;</button>
      </div>

      <div class="field compact-field">
        <label for="prefixVariantSelect">Prefix variant</label>
        <select class="interal-select js-custom-select" id="prefixVariantSelect"></select>
      </div>


      <div class="actions modal-actions">
        <button class="tool-btn" id="savePrefixVariantBtn" type="button">Add</button>
      </div>
    </div>
  </div>


  <script>
    (function () {
      const tr = {
        ru: {
          title: 'Determinator of valen typ',
          close: 'Закрыть',
          labels: [
            '1 — Слово по регулярной модели (с разделителями)',
            '2 — Компонентный анализ',
            '3 — Логический анализ компонентов',
            '4 — Международное значение эквивалентного деривата',
            '5 — Слово по натуралистической модели (с разделителями)',
            '6 — Объяснительная цепочка'
          ],
          noComponents: 'Компоненты не добавлены.',
          detailsSummary: 'Локальная нейросеть для семантической дистанции',
          useLocalModel: 'Использовать локальную модель',
          promptBuild: 'Собрать промпт',
          promptCopy: 'Копировать промпт',
          analyse: 'Анализировать',
          clear: 'Очистить',
          result: 'Результат',
          fillAndAnalyse: 'Заполните поля и нажмите «Анализировать».',
          addItem: 'Добавить элемент',
          rootWord: 'Основной корень',
          component: 'Компонент (аффикс/окончание)',
          back: '<',
          word: 'Слово',
          meaning: 'Значение',
          assimilationType: 'Тип ассимиляции',
          category: 'Категория',
          element: 'Элемент',
          search: 'Поиск',
          searchPlaceholder: '-or, действие, приставка',
          prefixAssimilation: 'Ассимиляция приставки',
          prefixVariant: 'Вариант приставки',
          add: 'Добавить',
          ollamaUrl: 'URL Ollama',
          model: 'Модель',
          manualPromptLabel: 'Промпт для внешней нейросети (ручное эмбеддинг-сравнение)',
          manualPromptPlaceholder: 'Нажмите «Собрать промпт»',
          manualResponseLabel: 'Ответ нейросети (вставьте сюда)',
          manualResponsePlaceholder: 'Например: {"distance":0.38,"similarity":0.62,"reason":"..."}',
          manualHint: 'Если ответ предоставлен, дистанция считается как правило-ориентированная оценка + ручное эмбеддинг-сравнение (70/30).',
          addComponentAria: 'Добавить компонент',
          placeholders: ['re/vis/ion','видение снова','ревизия','re/vis/ion/u','например: повторный просмотр → просмотр с целью контроля → проверка → ревизия','vid/er','видеть']
        },
        en: {
          title: 'Determinator of valen typ',
          close: 'Close',
          labels: [
            '1 — Word by regular model (with separators)',
            '2 — Component analysis',
            '3 — Logical analysis of components',
            '4 — International meaning of equivalent derivative',
            '5 — Word by naturalistic model (with separators)',
            '6 — Explanatory chain'
          ],
          noComponents: 'No components added.',
          detailsSummary: 'Local neural model for semantic distance',
          useLocalModel: 'Use local model',
          promptBuild: 'Build prompt',
          promptCopy: 'Copy prompt',
          analyse: 'Analyse',
          clear: 'Clear',
          result: 'Result',
          fillAndAnalyse: 'Fill in fields and click “Analyse”.',
          addItem: 'Add item',
          rootWord: 'Primary root word',
          component: 'Component (affix/ending)',
          back: '<',
          word: 'Word',
          meaning: 'Meaning',
          assimilationType: 'Assimilation type',
          category: 'Category',
          element: 'Element',
          search: 'Search',
          searchPlaceholder: '-or, action, prefix',
          prefixAssimilation: 'Prefix assimilation',
          prefixVariant: 'Prefix variant',
          add: 'Add',
          ollamaUrl: 'Ollama URL',
          model: 'Model',
          manualPromptLabel: 'Prompt for external neural model (copy to AI and translate answer format)',
          manualPromptPlaceholder: 'Click “Build prompt”',
          manualResponseLabel: 'Neural model response (paste here)',
          manualResponsePlaceholder: 'For example: {"distance":0.38,"similarity":0.62,"reason":"..."}',
          manualHint: 'If response is provided, distance is computed as Rule-based + manual embedding (70/30).',
          addComponentAria: 'Add component',
          placeholders: ['re/vis/ion','vision again','revision','re/vis/ion/u','for example: repeated viewing → control-focused review → inspection → revision','vid/er','see']
        }
      };
      function apply(lang) {
        const l = lang === 'en' ? 'en' : 'ru';
        const s = tr[l];
        const h1 = document.querySelector('.hero h1');
        if (h1) h1.textContent = s.title;
        document.querySelectorAll('.close-btn').forEach((btn) => {
          btn.setAttribute('aria-label', s.close);
        });
        document.title = s.title;
        document.querySelectorAll('.panel .field > span').forEach((el, i) => {
          if (s.labels[i]) el.textContent = s.labels[i];
        });
        const cList = document.getElementById('componentsList');
        if (cList && cList.classList.contains('empty')) cList.textContent = s.noComponents;
        const detailsSummary = document.querySelector('.details-panel summary');
        if (detailsSummary) detailsSummary.textContent = s.detailsSummary;
        const useLocalModel = document.querySelector('.check-row span');
        if (useLocalModel) useLocalModel.textContent = s.useLocalModel;
        const copyBtn = document.getElementById('copyPromptBtn');
        if (copyBtn) {
          copyBtn.setAttribute('aria-label', s.promptCopy);
          copyBtn.setAttribute('title', s.promptCopy);
        }
        const buildBtn = document.getElementById('buildPromptBtn');
        if (buildBtn) buildBtn.textContent = s.promptBuild;
        const analyseBtn = document.getElementById('analyzeBtn');
        if (analyseBtn) analyseBtn.textContent = s.analyse;
        const clearBtn = document.getElementById('clearBtn');
        if (clearBtn) { clearBtn.setAttribute('aria-label', s.clear); clearBtn.setAttribute('title', s.clear); }
        const resultTitle = document.getElementById('resultTitle');
        if (resultTitle) resultTitle.textContent = s.result;
        const resultBody = document.getElementById('result');
        if (resultBody && resultBody.classList.contains('empty')) resultBody.textContent = s.fillAndAnalyse;
        const chooserTitle = document.getElementById('chooserTitle');
        if (chooserTitle) chooserTitle.textContent = s.addItem;
        const chooseRootBtn = document.getElementById('chooseRootBtn');
        if (chooseRootBtn) chooseRootBtn.textContent = s.rootWord;
        const chooseComponentBtn = document.getElementById('chooseComponentBtn');
        if (chooseComponentBtn) chooseComponentBtn.textContent = s.component;
        const rootTitle = document.getElementById('rootTitle');
        if (rootTitle) rootTitle.textContent = s.rootWord;
        const componentTitle = document.getElementById('componentTitle');
        if (componentTitle) componentTitle.textContent = s.component;
        const prefixVariantTitle = document.getElementById('prefixVariantTitle');
        if (prefixVariantTitle) prefixVariantTitle.textContent = s.prefixAssimilation;
        document.querySelectorAll('.back-btn').forEach((el) => { el.setAttribute('aria-label', s.back === '<' ? 'Back' : s.back); });
        document.querySelectorAll('#rootModal .field > span')[0].textContent = s.word;
        document.querySelectorAll('#rootModal .field > span')[1].textContent = s.meaning;
        document.querySelectorAll('#rootModal .field > span')[2].textContent = s.assimilationType;
        const componentLabels = document.querySelectorAll('#componentModal .field > span');
        if (componentLabels[0]) componentLabels[0].textContent = s.search;
        if (componentLabels[1]) componentLabels[1].textContent = s.category;
        if (componentLabels[2]) componentLabels[2].textContent = s.element;
        const componentSearchInput = document.getElementById('componentSearchInput');
        if (componentSearchInput) componentSearchInput.placeholder = s.searchPlaceholder;
        document.querySelectorAll('#prefixVariantModal .field > span')[0].textContent = s.prefixVariant;
        document.querySelectorAll('.modal-actions button').forEach((el) => { el.textContent = s.add; });

        const manualLabels = document.querySelectorAll('.manual-embedding-box .field > span');
        if (manualLabels[0]) manualLabels[0].textContent = s.manualPromptLabel;
        if (manualLabels[1]) manualLabels[1].textContent = s.manualResponseLabel;
        const ollamaUrlLabel = document.getElementById('ollamaUrlLabel');
        if (ollamaUrlLabel) ollamaUrlLabel.textContent = s.ollamaUrl;
        const ollamaModelLabel = document.getElementById('ollamaModelLabel');
        if (ollamaModelLabel) ollamaModelLabel.textContent = s.model;
        const manualHint = document.querySelector('.manual-hint');
        if (manualHint) manualHint.textContent = s.manualHint;
        const addBtn = document.getElementById('addComponentBtn');
        if (addBtn) addBtn.setAttribute('aria-label', s.addComponentAria);
        const placeholders = [
          document.getElementById('regularWord'),
          document.getElementById('logicalMeaning'),
          document.getElementById('internationalMeaning'),
          document.getElementById('naturalisticWord'),
          document.getElementById('explanationChain'),
          document.getElementById('rootFormInput'),
          document.getElementById('rootMeaningInput')
        ];
        placeholders.forEach((el, i) => { if (el) el.setAttribute('placeholder', s.placeholders[i]); });
        const manualPrompt = document.getElementById('manualPrompt');
        if (manualPrompt) manualPrompt.setAttribute('placeholder', s.manualPromptPlaceholder);
        const manualResponse = document.getElementById('manualEmbeddingResponse');
        if (manualResponse) manualResponse.setAttribute('placeholder', s.manualResponsePlaceholder);

      }
      apply(localStorage.getItem('interal.lang') === 'en' ? 'en' : 'ru');
      document.addEventListener('interal:languagechange', (e) => apply(e.detail.lang));
    })();
  </script>
  <script src="../shared/copy-plain.js"></script>
  <script src="../shared/ui.js?v=share-state-fix-20260628" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
