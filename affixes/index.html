<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Affixes — Interal</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon%20interal%2032.png" />
  <link rel="stylesheet" href="../shared/ui.css?v=affixes-20260702" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="affixes-page">
  <main class="vord-page-shell">
    <header class="vord-page-hero">
      <h1 id="pageTitle">Affixes</h1>
    </header>

    <section class="card vord-panel form-card">
      <form id="affixForm" class="affix-form" autocomplete="off">
        <div class="field">
          <label id="formLabel" for="formInput">Аффикс</label>
          <input class="interal-input" id="formInput" type="text" autocomplete="off" placeholder="Например: -ion, re-, -ilo">
        </div>

        <div class="field">
          <label id="meaningLabel" for="meaningInput">Значение</label>
          <textarea class="interal-textarea" id="meaningInput" placeholder="Например: действие, результат действия"></textarea>
        </div>

        <div class="field">
          <label id="typeLabel" for="morphemeTypeInput">Тип аффикса</label>
          <select class="interal-select" id="morphemeTypeInput">
            <option value="suffix">Суффикс</option>
            <option value="prefix">Префикс</option>
          </select>
        </div>

        <div class="field">
          <label id="commentLabel" for="commentInput">Комментарий (необязательно)</label>
          <textarea class="interal-textarea" id="commentInput"></textarea>
        </div>

        <div class="form-actions">
          <button class="interal-btn interal-btn--primary" id="checkButton" type="submit">Проверить</button>
        </div>
      </form>
    </section>

    <div id="noticeBox" class="notice-box" hidden aria-live="polite"></div>
  </main>

  <div id="jsonCardModal" aria-hidden="true">
    <div class="modal-inner" role="dialog" aria-modal="true" aria-labelledby="jsonCardTitle">
      <button id="closeJsonCardBtn" class="json-card-close-btn" type="button" aria-label="Закрыть"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke-width="2.4" stroke-linecap="round" /></svg></button>
      <h3 class="json-card-title" id="jsonCardTitle">Карточка аффикса</h3>
      <p class="json-card-status" id="jsonCardStatus">Проверка выполнена</p>
      <pre class="json-card-output"><code id="jsonCardOutput"></code></pre>
      <div class="json-card-actions">
        <button id="copyJsonCardBtn" class="json-card-icon-btn menu-copy-btn" type="button" aria-label="Копировать JSON" title="Копировать JSON"><span class="menu-copy-icon-stack" aria-hidden="true"><img class="menu-copy-icon menu-copy-icon-link" src="../elements/Copy.svg" alt=""><svg class="menu-copy-icon menu-copy-icon-check" viewBox="0 0 24 24" focusable="false"><path d="M5 12.5l4.2 4.2L19 7" /></svg></span></button>
        <button id="closeJsonCardTextBtn" class="interal-btn interal-btn--secondary" type="button">Закрыть</button>
      </div>
    </div>
  </div>

  <script src="../shared/copy-plain.js"></script>
  <script src="../shared/ui.js?v=affixes-20260702"></script>
  <script src="./script.js"></script>
</body>
</html>
