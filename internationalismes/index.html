<!doctype html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internationalismes</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <div>
        <h1 id="pageTitle"></h1>
        <p id="pageLead"></p>
      </div>

      </div>
    </header>
    <div id="app"></div>
  </main>
  <script src="./script.js"></script>
</body>
</html>
