<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon%20interal%2032.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="favicon/favicon%20interal%2064.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="favicon/favicon%20interal%20512.png" />
  <title>Interal</title>
  <link rel="stylesheet" href="shared/ui.css" />

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Jost", "Helvetica Neue", Helvetica, Arial, sans-serif; min-height: 100vh; padding: 16px; line-height:1.5; }
    body.homepage.has-global-menu { padding-top: 72px; }
   .home-wrap { width:min(1240px,100%); margin: 0 auto; }
    .hero { width:100%; border-radius:24px; overflow:hidden; margin-bottom:12px; position:relative; min-height: clamp(170px, 30vh, 280px); display:grid; place-items:center; background: var(--surface-soft); }
    .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,.42));z-index:0;}
    .hero-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: .92;
      justify-self: center;
      align-self: center;
    }
    .home-brand { position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; justify-content:center; align-items:center; text-decoration:none; color:#fff; gap:4px; text-align:center; padding: 24px; }
    .home-logo { width:160px; height:160px; filter: brightness(0) invert(1); }
    .home-title { margin: 0; font-size: clamp(2rem, 4vw, 2.6rem); letter-spacing: .5px; color:#fff; text-shadow: none; }
    .homepage .container {
      width: 100%;
      text-align: center;
      display: grid !important;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin:0;
      padding:0;
      gap: 10px;
      align-items: stretch;
    }
    .tool-link {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr);
      width: 100%;
      min-height: 92px;
      padding: 10px 12px;
      text-decoration: none;
      border-radius: var(--radius-lg);
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-sm);
      justify-items: stretch !important;
      align-content: center;
      align-items: center;
      grid-template-rows: auto auto;
      transition: transform .2s ease, border-color .2s ease, background-color .2s ease;
      column-gap: 12px;
      row-gap: 4px;
    }
    .tool-icon-wrap {
      width: 100%;
      height: 100%;
      border-radius: var(--radius-md);
      background: var(--surface-elevated);
      border: 1px solid var(--border-subtle);
      display: grid;
      place-items: center;
      margin-bottom: 0;
      transition: background-color .35s ease, transform .35s cubic-bezier(.2,.8,.2,1);
      grid-row: 1 / span 2;
      align-self: stretch;
    }
    .tool-icon { width: 72%; height: 72%; max-width: 64px; max-height: 64px; }
    .tool-link-main {
      line-height:1.3;
      font-weight: 700;
      text-decoration: none;
      font-size: 1.02rem;
      color: var(--text);
      text-shadow: none;
      letter-spacing: .2px;
    }
    body.homepage .tool-link {
      justify-items: stretch !important;
      align-content: stretch !important;
      text-align: left !important;
      gap: 0;
    }
    .tool-link-sub {
      display: block;
      font-size: .9rem;
      margin-top: 0;
      color: var(--text-muted);
      text-shadow: none;
      line-height: 1.2;
    }
    .tool-link-main, .tool-link-sub {
      align-self: center;
    }
    .tool-link-main { margin-top: 2px; }
    .tool-link-sub { margin-bottom: 2px; }

    @media (min-width: 980px) {
      body.homepage .top-desktop-controls { display: none !important; }
      .home-wrap {
        display: grid;
        grid-template-columns: minmax(560px, 1.25fr) minmax(320px, 0.75fr);
        gap: 14px;
        align-items: stretch;
      }
      .hero {
        margin-bottom: 0;
        min-height: clamp(220px, 46vh, 360px);
        place-items: center;
      }
      .hero-bg {
        justify-self: stretch;
        align-self: stretch;
        object-position: left center;
      }
      .home-brand { align-items: center; text-align: center; justify-content: center; padding-left: 24px; padding-right: 24px; }
      .homepage .container {
        grid-template-columns: 1fr;
        gap: 8px;
        align-self: stretch;
      }
      .tool-link {
        min-height: 92px;
      }
    }
    @media (min-width: 861px) {
      .hero-bg { border-radius: inherit; }
    }
    @media (max-width: 860px) {
      .homepage .container { grid-template-columns: 1fr !important; }
      .tool-link { width: 100%; min-height: 90px; grid-template-columns: 76px minmax(0, 1fr); }
      .hero { min-height: clamp(150px, 24vh, 230px); border-radius:22px; margin-bottom: 8px; }
      .hero-bg { width:100%; height:100%; object-fit:cover; border-radius: inherit; }
      .home-brand { padding: 18px 12px; justify-content:center; }
      .home-logo { width: clamp(64px, 18vw, 96px); height: clamp(64px, 18vw, 96px); }
      .home-title { font-size: clamp(1.2rem, 5.5vw, 1.8rem); max-width: 100%; word-break: break-word; }
    }
    body.homepage:not(.dark-theme) .hero-bg { opacity: 1; object-position: center; }
     .tool-link:hover, .tool-link:focus-visible { transform: translateY(-2px); background: var(--surface-hover); border-color: var(--border-subtle); }
    .tool-link:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  </style>
</head>
<body class="homepage">
  <div class="home-wrap">
     <div class="hero"><img class="hero-bg" src="elements/trippy_gold_black_loop.svg" alt="" /><a class="home-brand" href="index.html" aria-label="Interal home">
        <img class="home-logo" src="favicon/favicon%20interal%20512.png" alt="Interal logo" />
        <h1 class="home-title">Interal</h1>
    </a></div><div class="container">

      <a class="tool-link" href="similarita/">
        <span class="tool-icon-wrap"><img class="tool-icon" src="elements/similarita.svg" alt="" aria-hidden="true" /></span>
        <span class="tool-link-main" data-i18n="home.similaritaMain">Similaritá</span>
        <span class="tool-link-sub" data-i18n="home.similaritaSub">Похожесть</span>
      </a>
      <a class="tool-link" href="associativvordes/">
        <span class="tool-icon-wrap"><img class="tool-icon" src="elements/associativ%20vordes.svg" alt="" aria-hidden="true" /></span>
        <span class="tool-link-main" data-i18n="home.assocMain">Associativ vordes</span>
        <span class="tool-link-sub" data-i18n="home.assocSub">Ассоциативные слова</span>
      </a>
      <a class="tool-link" href="determinatorofvalentyp/">
        <span class="tool-icon-wrap"><img class="tool-icon" src="elements/determinator%20of%20valen%20typ.svg" alt="" aria-hidden="true" /></span>
        <span class="tool-link-main" data-i18n="home.determMain">Determinator of valen typ</span>
        <span class="tool-link-sub" data-i18n="home.determSub">Определитель типа значения</span>
      </a>
    </div>
  </div>

  <script src="shared/ui.js"></script>
  <script>
    (function () {
      const dict = {
        ru: {
          'home.similaritaMain': 'Similaritá',
          'home.assocMain': 'Associativ vordes',
          'home.determMain': 'Determinator of valen typ',
          'home.similaritaSub': 'Похожесть',
          'home.assocSub': 'Ассоциативные слова',
          'home.determSub': 'Определитель типа значения'
        },
        en: {
          'home.similaritaMain': 'Similaritá',
          'home.assocMain': 'Associativ vordes',
          'home.determMain': 'Determinator of valen typ',
          'home.similaritaSub': 'Similarity',
          'home.assocSub': 'Associative words',
          'home.determSub': 'Value type determinator'
        }
      };
      function apply(lang) {
        document.querySelectorAll('[data-i18n]').forEach((el) => {
          const key = el.getAttribute('data-i18n');
          el.textContent = (dict[lang] && dict[lang][key]) || (dict.ru[key] || el.textContent);
        });
      }
      apply(localStorage.getItem('interal.lang') === 'en' ? 'en' : 'ru');
      document.addEventListener('interal:languagechange', (e) => apply(e.detail.lang));
    })();
  </script>
</body>
</html>
