<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Minimalist Russian Flag</title>
  <desc id="desc">A rounded, playful minimalist Russian tricolor flag with soft shadows, inspired by modern language-learning app UI aesthetics.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#172033" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="flagShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.46" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.06"/>
    </linearGradient>
    <clipPath id="roundedFlag">
      <rect x="180" y="190" width="840" height="420" rx="72" ry="72"/>
    </clipPath>
  </defs>

  <rect width="1200" height="800" fill="#F6F8FC"/>

  <g filter="url(#softShadow)">
    <rect x="180" y="190" width="840" height="420" rx="72" ry="72" fill="#ffffff"/>
    <g clip-path="url(#roundedFlag)">
      <rect x="180" y="190" width="840" height="140" fill="#FFFFFF"/>
      <rect x="180" y="330" width="840" height="140" fill="#2D62D9"/>
      <rect x="180" y="470" width="840" height="140" fill="#F0443E"/>
      <path d="M180 190 C330 165 470 215 620 190 C770 165 890 215 1020 190 L1020 610 C885 635 765 585 620 610 C470 635 330 585 180 610 Z" fill="url(#flagShine)" opacity="0.95"/>
      <path d="M180 190 C330 165 470 215 620 190 C770 165 890 215 1020 190" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
    </g>
    <rect x="180" y="190" width="840" height="420" rx="72" ry="72" fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.92"/>
  </g>

  <circle cx="260" cy="270" r="16" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="298" cy="245" r="8" fill="#FFFFFF" opacity="0.55"/>
</svg>
