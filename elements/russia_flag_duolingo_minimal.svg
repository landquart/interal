<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Minimalist Russian Flag</title>
  <desc id="desc">A rounded, playful minimalist Russian tricolor flag with soft shadows, inspired by modern language-learning app UI aesthetics.</desc>
  <defs>
    <linearGradient id="flagShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.46" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.05"/>
    </linearGradient>
    <clipPath id="roundedFlag">
      <rect x="0" y="0" width="1200" height="800" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedFlag)">
    <rect x="0" y="0" width="1200" height="267" fill="#FFFFFF"/>
    <rect x="0" y="267" width="1200" height="266" fill="#2D62D9"/>
    <rect x="0" y="533" width="1200" height="267" fill="#F0443E"/>
    <rect x="0" y="0" width="1200" height="800" fill="url(#flagShine)" opacity="0.95"/>
  </g>
</svg>
