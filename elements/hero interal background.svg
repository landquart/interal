  </g>
  <g class="motion-field hero-warm-right-field">
    <animateTransform attributeName="transform" type="translate" values="180 90;-220 -130;-60 190;180 90" keyTimes="0;.34;.67;1" dur="4.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".48;.64;.56;.48" keyTimes="0;.34;.67;1" dur="4.4s" repeatCount="indefinite"/>
    <rect x="-700" y="-650" width="3960" height="3195" fill="url(#warmRightWash)"/>
  </g>
  <g class="static-field"><rect x="-700" y="-650" width="3960" height="3195" fill="url(#plum)"/></g>
  <g class="static-field"><rect x="-700" y="-650" width="3960" height="3195" fill="url(#lavender)"/></g>
