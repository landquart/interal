<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1895" viewBox="0 0 2560 1895" preserveAspectRatio="none">
  <defs>
    <style>
      .static-field { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion-field { display: none; }
        .static-field { display: inline; }
        .hero-amber-core { stop-color: #D78B32 !important; }
        .hero-warm-core { stop-color: #E56F5D !important; }
      }
    </style>
    <radialGradient id="plum" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1060 1730) scale(1900 1320)">
      <stop stop-color="#684270" stop-opacity=".9"/>
      <stop offset=".52" stop-color="#684270" stop-opacity=".46"/>
      <stop offset="1" stop-color="#684270" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lavender" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(2340 90) scale(1600 980)">
      <stop stop-color="#B8A7DF" stop-opacity=".78"/>
      <stop offset=".52" stop-color="#B8A7DF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#B8A7DF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberWash" x1="-420" y1="80" x2="2050" y2="1510" gradientUnits="userSpaceOnUse">
      <stop class="hero-amber-core" stop-color="#D78B32" stop-opacity=".72">
        <animate attributeName="stop-color" values="#D78B32;#E56F5D;#E0A04A;#D78B32" dur="4.8s" repeatCount="indefinite"/>
      </stop>
      <stop offset=".24" stop-color="#E0A04A" stop-opacity=".56"/>
      <stop offset=".48" stop-color="#F08B6A" stop-opacity=".40"/>
      <stop offset=".72" stop-color="#684270" stop-opacity=".26"/>
      <stop offset="1" stop-color="#3658B0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="warmRightWash" x1="3020" y1="1820" x2="840" y2="520" gradientUnits="userSpaceOnUse">
      <stop class="hero-warm-core" stop-color="#E56F5D" stop-opacity=".50">
        <animate attributeName="stop-color" values="#E56F5D;#D78B32;#F08B6A;#E56F5D" dur="5.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset=".30" stop-color="#D78B32" stop-opacity=".38"/>
      <stop offset=".58" stop-color="#F08B6A" stop-opacity=".28"/>
      <stop offset=".78" stop-color="#684270" stop-opacity=".18"/>
      <stop offset="1" stop-color="#3658B0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="2560" height="1895" fill="#3658B0"/>
  <g class="motion-field hero-plum-field">
