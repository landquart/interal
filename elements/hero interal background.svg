  <rect width="2560" height="1895" fill="#3658B0"/>
  <g class="motion-field hero-plum-field">
    <animateTransform attributeName="transform" type="translate" values="-160 90;210 -120;90 220;-160 90" keyTimes="0;.34;.67;1" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".66;.54;.84;.66" keyTimes="0;.34;.67;1" dur="3.6s" repeatCount="indefinite"/>
    <rect x="-700" y="-650" width="3960" height="3195" fill="url(#plumWash)"/>
  </g>
  <g class="motion-field hero-lavender-field">
    <animateTransform attributeName="transform" type="translate" values="130 -90;-230 140;-40 250;130 -90" keyTimes="0;.34;.67;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".60;.82;.52;.60" keyTimes="0;.34;.67;1" dur="4s" repeatCount="indefinite"/>
    <rect x="-700" y="-650" width="3960" height="3195" fill="url(#lavenderWash)"/>
  </g>
  <g class="motion-field hero-amber-field">
    <animateTransform attributeName="transform" type="translate" values="-360 -160;420 150;100 300;-360 -160" keyTimes="0;.34;.67;1" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".76;.94;.70;.76" keyTimes="0;.34;.67;1" dur="3.2s" repeatCount="indefinite"/>
    <rect x="-700" y="-650" width="3960" height="3195" fill="url(#amberWash)"/>
  </g>
  <g class="motion-field hero-warm-right-field">
    <animateTransform attributeName="transform" type="translate" values="240 120;-300 -180;-80 240;240 120" keyTimes="0;.34;.67;1" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".58;.78;.64;.58" keyTimes="0;.34;.67;1" dur="3.6s" repeatCount="indefinite"/>
    <rect x="-700" y="-650" width="3960" height="3195" fill="url(#warmRightWash)"/>
  </g>
  <g class="static-field"><rect x="-700" y="-650" width="3960" height="3195" fill="url(#plumWash)"/></g>
  <g class="static-field"><rect x="-700" y="-650" width="3960" height="3195" fill="url(#lavenderWash)"/></g>
  <g class="static-field"><rect x="-700" y="-650" width="3960" height="3195" fill="url(#amberWash)"/></g>
  <g class="static-field"><rect x="-700" y="-650" width="3960" height="3195" fill="url(#warmRightWash)"/></g>
