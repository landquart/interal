<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1895" viewBox="0 0 2560 1895" preserveAspectRatio="none">
  <defs>
    <style>
      .static-field { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion-field { display: none; }
        .static-field { display: inline; }
        .hero-amber-core { stop-color: #E0A04A !important; }
        .hero-warm-core { stop-color: #D78B32 !important; }
      }
    </style>
    <radialGradient id="plum" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1060 1730) scale(1900 1320)">
      <stop stop-color="#684270" stop-opacity=".9"/>
      <stop offset=".52" stop-color="#684270" stop-opacity=".46"/>
      <stop offset="1" stop-color="#684270" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lavender" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(2340 90) scale(1600 980)">
      <stop stop-color="#B8A7DF" stop-opacity=".78"/>
      <stop offset=".52" stop-color="#B8A7DF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#B8A7DF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 120) scale(980 720)">
      <stop class="hero-amber-core" stop-color="#E0A04A" stop-opacity=".88">
        <animate attributeName="stop-color" values="#E0A04A;#F08B6A;#E0A04A" dur="9.6s" repeatCount="indefinite"/>
      </stop>
      <stop offset=".42" stop-color="#D78B32" stop-opacity=".52"/>
      <stop offset="1" stop-color="#D78B32" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(2440 1640) scale(880 660)">
      <stop class="hero-warm-core" stop-color="#D78B32" stop-opacity=".56">
        <animate attributeName="stop-color" values="#D78B32;#E56F5D;#D78B32" dur="10.4s" repeatCount="indefinite"/>
      </stop>
      <stop offset=".38" stop-color="#E56F5D" stop-opacity=".34"/>
      <stop offset="1" stop-color="#E56F5D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="2560" height="1895" fill="#3658B0"/>
  <g class="motion-field hero-plum-field">
    <animateTransform attributeName="transform" type="translate" values="-90 60;140 -80;60 160;-90 60" keyTimes="0;.34;.67;1" dur="7.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".68;.54;.86;.68" keyTimes="0;.34;.67;1" dur="7.2s" repeatCount="indefinite"/>
    <rect x="-700" y="-650" width="3960" height="3195" fill="url(#plum)"/>
  </g>
  <g class="motion-field hero-lavender-field">
    <animateTransform attributeName="transform" type="translate" values="90 -60;-160 100;-40 190;90 -60" keyTimes="0;.34;.67;1" dur="8.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".60;.84;.52;.60" keyTimes="0;.34;.67;1" dur="8.1s" repeatCount="indefinite"/>
    <rect x="-700" y="-650" width="3960" height="3195" fill="url(#lavender)"/>
  </g>
  <g class="motion-field hero-amber-field">
    <animateTransform attributeName="transform" type="translate" values="-80 -40;140 70;30 160;-80 -40" keyTimes="0;.34;.67;1" dur="6.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".56;.82;.48;.56" keyTimes="0;.34;.67;1" dur="6.9s" repeatCount="indefinite"/>
    <rect x="-700" y="-650" width="3960" height="3195" fill="url(#amber)"/>
  </g>
  <g class="motion-field hero-warm-right-field">
    <animateTransform attributeName="transform" type="translate" values="90 50;-100 -80;-40 120;90 50" keyTimes="0;.34;.67;1" dur="8.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".44;.50;.66;.44" keyTimes="0;.34;.67;1" dur="8.7s" repeatCount="indefinite"/>
    <rect x="-700" y="-650" width="3960" height="3195" fill="url(#warmRight)"/>
  </g>
  <g class="static-field"><rect x="-700" y="-650" width="3960" height="3195" fill="url(#plum)"/></g>
  <g class="static-field"><rect x="-700" y="-650" width="3960" height="3195" fill="url(#lavender)"/></g>
  <g class="static-field"><rect x="-700" y="-650" width="3960" height="3195" fill="url(#amber)"/></g>
  <g class="static-field"><rect x="-700" y="-650" width="3960" height="3195" fill="url(#warmRight)"/></g>
