    <animate attributeName="opacity" values=".66;.56;.82;.66" keyTimes="0;.34;.67;1" dur="4.5s" repeatCount="indefinite"/>
    <rect x="-700" y="-650" width="3960" height="3195" fill="url(#plum)"/>
  </g>
  <g class="motion-field hero-lavender-field">
    <animateTransform attributeName="transform" type="translate" values="100 -70;-180 110;-30 200;100 -70" keyTimes="0;.34;.67;1" dur="4.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".60;.80;.54;.60" keyTimes="0;.34;.67;1" dur="4.9s" repeatCount="indefinite"/>
    <rect x="-700" y="-650" width="3960" height="3195" fill="url(#lavender)"/>
  </g>
  <g class="motion-field hero-amber-field">
    <animateTransform attributeName="transform" type="translate" values="-280 -120;320 110;80 240;-280 -120" keyTimes="0;.34;.67;1" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".70;.88;.66;.70" keyTimes="0;.34;.67;1" dur="3.8s" repeatCount="indefinite"/>
