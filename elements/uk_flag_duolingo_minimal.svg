<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Minimalist Duolingo-style flag of the United Kingdom">
  <defs>
    <clipPath id="clip">
      <rect x="20" y="20" width="1160" height="760" rx="90" ry="90"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="800" fill="#2F7CF6"/>

    <!-- White diagonals -->
    <polygon points="0,0 140,0 1200,660 1200,800 1060,800 0,140" fill="#FFFFFF"/>
    <polygon points="1200,0 1060,0 0,660 0,800 140,800 1200,140" fill="#FFFFFF"/>

    <!-- Red diagonals -->
    <polygon points="0,0 78,0 1200,701 1200,800 1122,800 0,99" fill="#FF4B4B"/>
    <polygon points="1200,0 1122,0 0,701 0,800 78,800 1200,99" fill="#FF4B4B"/>

    <!-- White central cross -->
    <rect x="0" y="310" width="1200" height="180" fill="#FFFFFF"/>
    <rect x="510" y="0" width="180" height="800" fill="#FFFFFF"/>

    <!-- Red central cross -->
    <rect x="0" y="350" width="1200" height="100" fill="#FF4B4B"/>
    <rect x="550" y="0" width="100" height="800" fill="#FF4B4B"/>
  </g>
</svg>
