  <title>Registre of lexical cartes</title>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: "Jost", "Helvetica Neue", Helvetica, Arial, sans-serif; line-height: 1.5; }
    body.has-global-menu { padding-top: 94px; }

    .registry-panel,
    .registry-card,
    .registry-modal-card {

      box-shadow: var(--shadow-sm);

    .registry-panel { padding: 18px; margin-bottom: 14px; display: grid; gap: 18px; }

    .registry-controls { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; align-items: end; }
    .field { display: grid; gap: 6px; min-width: 0; }
    .field--search { grid-column: span 6; }
    .field--type, .field--pos, .field--group { grid-column: span 3; }
    .field--author, .field--pi, .field--sort { grid-column: span 3; }
    .field--reset { grid-column: span 3; }
    .field label { color: var(--text-muted); font-size: .85rem; font-weight: 700; }

      width: 100%; min-height: 44px; border-radius: var(--radius-sm); border: 1px solid var(--control-border);

    .registry-search-wrap input { padding-left: 42px; }

    .field select:focus-visible,
    .registry-btn:focus-visible {
      outline: 2px solid var(--focus-outline); outline-offset: 2px; box-shadow: 0 0 0 5px var(--focus-ring);
    }
    .registry-btn {
      min-height: 44px; border-radius: var(--radius-sm); border: 1px solid var(--button-secondary-border);
      background: var(--button-secondary-bg); color: var(--button-secondary-text); padding: 0 14px; font: inherit; font-weight: 700;
      cursor: pointer; transition: transform .18s ease, background-color .18s ease, border-color .18s ease;

    .registry-btn--primary { background: var(--button-primary-bg); color: var(--button-primary-text); border-color: transparent; }
    .registry-btn--primary:hover {
      background:
        linear-gradient(
          180deg,
          color-mix(in srgb, var(--button-primary-bg) 88%, #ffffff 12%),
          var(--button-primary-bg)
        );
      border-color: transparent;
      color: var(--button-primary-text);
    }
    body.dark-theme .registry-btn--primary:hover {
      background:
        linear-gradient(
          180deg,
          color-mix(in srgb, var(--button-primary-bg) 84%, #ffffff 16%),
          var(--button-primary-bg)
        );
    }
    .registry-summary { margin: 14px 0; color: var(--text-muted); font-weight: 700; }
    .registry-message { margin: 14px 0; padding: 16px; border-radius: var(--radius-md); background: var(--surface-soft); color: var(--text); border: 1px solid var(--border-subtle); }

    .card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .card-tag { display: inline-flex; align-items: center; min-height: 28px; border-radius: var(--radius-pill); padding: 3px 10px; background: var(--surface-soft); border: 1px solid var(--border-subtle); color: var(--text); font-size: .86rem; font-weight: 700; }
    .card-tag--type { background: color-mix(in srgb, var(--brand-gold) 14%, var(--surface-elevated)); border-color: var(--brand-gold-border); color: var(--brand-gold-text); }
    .card-row--pi .card-value { color: var(--brand-gold-text); font-size: 1.15rem; font-weight: 800; }
    .card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .card-row { min-width: 0; padding: 10px; border-radius: var(--radius-sm); background: var(--surface-elevated); border: 1px solid var(--border-subtle); }
    .card-label { display: block; color: var(--text-muted); font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
    .card-value { display: block; color: var(--text); overflow-wrap: anywhere; white-space: pre-wrap; }
    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .registry-modal { position: fixed; inset: 0; z-index: var(--z-page-modal); display: none; place-items: center; padding: 18px; }
    .registry-modal.is-open { display: grid; }
    .registry-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.52); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .registry-modal-card { position: relative; z-index: 1; width: min(900px, 100%); max-height: min(82vh, 760px); padding: 16px; display: grid; grid-template-rows: auto minmax(220px, 1fr) auto; gap: 12px; }
    .registry-modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .registry-modal-title { margin: 0; font-size: 1.25rem; color: var(--text); }

    .registry-modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    .registry-copy-icon-btn { width: 46px; min-height: 46px; padding: 0; justify-content: center; }
    .registry-toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(18px); z-index: var(--z-toast); opacity: 0; pointer-events: none; border-radius: var(--radius-pill); background: var(--button-primary-bg); color: var(--button-primary-text); padding: 10px 14px; font-weight: 800; transition: opacity .18s ease, transform .18s ease; }
    .registry-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .giscus-modal {
      position: fixed;
      inset: 0;
      z-index: var(--z-page-modal);
      display: none;
      place-items: center;
      padding: 18px;
    }

    .giscus-modal.is-open {
      display: grid;
    }

    .giscus-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .52);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .giscus-modal-card {
      position: relative;
      z-index: 1;
      width: min(900px, 100%);
      max-height: min(82vh, 760px);
      overflow: auto;
      padding: 16px;
      display: grid;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;

      font-size: 1.25rem;

  </style>

        return card.translation_language && card.translation_language !== state.lang
          ? `${card.translation_word} (${card.translation_language})`
          : card.translation_word;
      }
      function formatDate(value) { if (!value) return t('noValue'); const date = new Date(value); if (Number.isNaN(date.getTime())) return value; return new Intl.DateTimeFormat(state.lang === 'en' ? 'en-US' : 'ru-RU', { dateStyle: 'medium', timeStyle: 'short' }).format(date); }
      function formatNumber(value) { return typeof value === 'number' && Number.isFinite(value) ? new Intl.NumberFormat(state.lang === 'en' ? 'en-US' : 'ru-RU', { maximumFractionDigits: 6 }).format(value) : t('noValue'); }
      function finalPercentageCode(card) {
        if (typeof card.final_percentage_code === 'string' && card.final_percentage_code.trim()) return card.final_percentage_code.trim();
        return typeof card.pi_percent === 'number' ? 'PI' : '';
      }
      function finalPercentageValue(card) {
        if (typeof card.final_percentage_value === 'number' && Number.isFinite(card.final_percentage_value)) return card.final_percentage_value;
        return typeof card.pi_percent === 'number' && Number.isFinite(card.pi_percent) ? card.pi_percent : null;
      }
      function formatFinalPercentage(card) {
        const code = finalPercentageCode(card);
        const value = finalPercentageValue(card);
        return code && value !== null ? `${code}: ${formatNumber(value)}%` : '';
      }
      function showToast(message) { els.toast.textContent = message; els.toast.classList.add('show'); clearTimeout(showToast.timer); showToast.timer = setTimeout(() => els.toast.classList.remove('show'), 1800); }
      function setCopyButtonCopied(button, copied) {
        clearTimeout(button._copyStateTimer);
        button.classList.toggle('is-copied', copied);
        if (copied) button._copyStateTimer = setTimeout(() => button.classList.remove('is-copied'), 1800);
      }
      async function copyText(text, ok, fail) { try { await navigator.clipboard.writeText(text); showToast(ok); return true; } catch (_) { showToast(fail); return false; } }
      function setOptions(select, options) { const current = select.value; select.replaceChildren(...options.map(([value, label]) => { const option = document.createElement('option'); option.value = value; option.textContent = label; return option; })); if (options.some(([value]) => value === current)) select.value = current; window.refreshCustomSelect?.(select); }
      function readFiltersFromDom() {
        state.filters.search = els.search.value || '';
        state.filters.type = els.type.value || '';
        state.filters.pos = els.pos.value || '';
        state.filters.group = els.group.value || '';
        state.filters.author = els.author.value || '';
        state.filters.minPi = els.minPi.value || '';
        state.filters.sort = els.sort.value || 'word';
      }
      function applyFiltersToDom() {
        els.search.value = state.filters.search;
        els.type.value = state.filters.type;
        els.pos.value = state.filters.pos;
        els.group.value = state.filters.group;
        els.author.value = state.filters.author;
        els.minPi.value = state.filters.minPi;
        els.sort.value = state.filters.sort || 'word';

        window.initCustomSelects?.(document.querySelector('.registry-controls'));
      }
      function resetFiltersState() {
        state.filters = { ...DEFAULT_FILTERS };
        applyFiltersToDom();
      }
      function updateStaticI18n() {
        document.documentElement.lang = currentLang();
        state.lang = currentLang();
        document.title = t('title');
        document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
        document.querySelectorAll('[data-i18n-attr]').forEach((el) => {
          el.dataset.i18nAttr.split(',').forEach((pair) => { const [attr, key] = pair.split(':'); if (attr && key) el.setAttribute(attr.trim(), t(key.trim())); });
        });
        els.search.placeholder = t('searchPlaceholder');
        els.author.placeholder = t('authorPlaceholder');
        setOptions(els.type, [['', t('allTypes')], ...TYPE_CODES.map((code) => [code, TYPE_LABELS[code]])]);
        setOptions(els.pos, [['', t('allParts')], ...POS_VALUES.map((pos) => [pos, posLabel(pos)])]);
        const extraGroups = Array.from(new Set(state.cards.flatMap((card) => Array.isArray(card.supported_groups) ? card.supported_groups : []))).filter((group) => !BASE_GROUPS.includes(group)).sort((a, b) => a.localeCompare(b));
        setOptions(els.group, [['', t('allGroups')], ...BASE_GROUPS.map((group) => [group, groupLabel(group)]), ...extraGroups.map((group) => [group, groupLabel(group)])]);
        setOptions(els.sort, SORTS.map(([value, key]) => [value, t(key)]));
        els.type.value = state.filters.type;
        els.pos.value = state.filters.pos;
        els.group.value = state.filters.group;
        els.sort.value = SORTS.some(([value]) => value === state.filters.sort) ? state.filters.sort : 'word';

        window.initCustomSelects?.(document.querySelector('.registry-controls'));
      }
      function cardMatches(card) {
        const filters = state.filters;

        const query = normalize(filters.search);
        const author = normalize(filters.author);
        const minPi = filters.minPi === '' ? null : Number(filters.minPi);
        const haystack = normalize(`${card.search_blob || ''} ${codeOf(card)} ${card.vord_type || ''} ${typeLabel(card)}`);
        if (query && !haystack.includes(query)) return false;
        if (filters.type && codeOf(card) !== filters.type) return false;
        if (filters.pos && card.part_of_speech !== filters.pos) return false;
        if (filters.group && !(Array.isArray(card.supported_groups) && card.supported_groups.includes(filters.group))) return false;
        if (author && !normalize(card.author).includes(author)) return false;
        const percentage = finalPercentageValue(card);
        if (minPi !== null && Number.isFinite(minPi) && (percentage === null || percentage < minPi)) return false;
        return true;
      }
      function sortedCards(cards) {
        const sort = state.filters.sort || 'word';

        return [...cards].sort((a, b) => {
          if (sort === 'accepted') return Date.parse(b.accepted_at || 0) - Date.parse(a.accepted_at || 0) || a.word.localeCompare(b.word);
          if (sort === 'created') return Date.parse(b.created_at || 0) - Date.parse(a.created_at || 0) || a.word.localeCompare(b.word);
          if (sort === 'pi') return (finalPercentageValue(b) ?? -Infinity) - (finalPercentageValue(a) ?? -Infinity) || a.word.localeCompare(b.word);
          return (a.word || '').localeCompare(b.word || '', state.lang === 'en' ? 'en' : 'ru');
        });
      }
      function row(label, value, modifier = '') { const wrap = document.createElement('div'); wrap.className = `card-row${modifier ? ` card-row--${modifier}` : ''}`; const l = document.createElement('span'); l.className = 'card-label'; l.textContent = label; const v = document.createElement('span'); v.className = 'card-value'; v.textContent = value || t('noValue'); wrap.append(l, v); return wrap; }

      function slugify(value) {
        return String(value || '')
          .toLowerCase()
          .trim()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[^\p{L}\p{N}]+/gu, '-')
          .replace(/^-+|-+$/g, '');
      }

      function discussionTerm(card) {
        if (card.id) return `card-${card.id}`;
        return `registre-${slugify(card.word || 'card')}`;
      }

      function createGiscusScript(card) {
        const script = document.createElement('script');

        script.src = 'https://giscus.app/client.js';
        script.setAttribute('data-repo', 'landquart/interal');
        script.setAttribute('data-repo-id', 'R_kgDOR_zU5g');
        script.setAttribute('data-category', 'Announcements');
        script.setAttribute('data-category-id', 'DIC_kwDOR_zU5s4C-Th7');
        script.setAttribute('data-mapping', 'specific');
        script.setAttribute('data-term', discussionTerm(card));
        script.setAttribute('data-strict', '1');
        script.setAttribute('data-reactions-enabled', '1');
        script.setAttribute('data-emit-metadata', '0');
        script.setAttribute('data-input-position', 'top');
        script.setAttribute('data-theme', 'preferred_color_scheme');
        script.setAttribute('data-lang', state.lang);
        script.setAttribute('crossorigin', 'anonymous');
        script.async = true;

        return script;
      }

      function loadGiscus(card) {
        els.giscusContainer.replaceChildren();
        els.giscusContainer.appendChild(createGiscusScript(card));
      }

      function openDiscussion(card, trigger) {
        state.lastDiscussionFocused = trigger || document.activeElement;
        const word = card.word || card.id || t('noValue');
        els.giscusTitle.textContent = `${t('discussionTitle')}: ${word}`;

        els.giscusModal.classList.add('is-open');
        els.giscusModal.setAttribute('aria-hidden', 'false');

        loadGiscus(card);
        els.giscusX.focus();
      }

      function closeDiscussion() {
        els.giscusModal.classList.remove('is-open');
        els.giscusModal.setAttribute('aria-hidden', 'true');
        els.giscusContainer.replaceChildren();
        if (state.lastDiscussionFocused) {
          state.lastDiscussionFocused.focus();
        }
      }
      function renderCard(card) {
        const article = document.createElement('article'); article.className = `registry-card${card.accepted_at ? ' is-accepted' : ''}`;
        const head = document.createElement('div'); head.className = 'card-head';
        const titleWrap = document.createElement('div'); const title = document.createElement('h2'); title.className = 'card-word'; title.textContent = card.word || t('noValue'); const ipa = document.createElement('div'); ipa.className = 'card-ipa'; ipa.textContent = card.ipa ? `/${card.ipa}/` : t('noValue'); titleWrap.append(title, ipa);
        const tags = document.createElement('div'); tags.className = 'card-tags'; [typeLabel(card), posLabel(card.part_of_speech), formatFinalPercentage(card)].filter(Boolean).forEach((item, index) => { const tag = document.createElement('span'); tag.className = `card-tag${index === 0 ? ' card-tag--type' : ''}`; tag.textContent = item; tags.append(tag); });
        head.append(titleWrap, tags);
        const grid = document.createElement('div'); grid.className = 'card-grid';
        grid.append(row(t('type'), typeLabel(card)), row(t('partOfSpeech'), posLabel(card.part_of_speech)), row(t('translation'), translationForSiteLanguage(card)));
        const percentageCode = finalPercentageCode(card);
        const percentageValue = finalPercentageValue(card);
        if (percentageCode && percentageValue !== null) grid.append(row(percentageCode, `${formatNumber(percentageValue)}%`, 'pi'));
        grid.append(row(t('groups'), groupListLabel(card.supported_groups)), row(t('author'), card.author), row(t('authorContact'), card.author_contact_url ? `${card.author_contact_type} — ${card.author_contact_url}` : ''), row(t('createdAt'), formatDate(card.created_at)), row(t('acceptedAt'), formatDate(card.accepted_at)), row(t('id'), card.id));
        const actions = document.createElement('div');
        actions.className = 'card-actions';

        const open = document.createElement('button');
        open.type = 'button';
        open.className = 'registry-btn registry-btn--primary';
        open.textContent = t('openJson');
        open.addEventListener('click', () => openJson(card, open));

        const copyId = document.createElement('button');
        copyId.type = 'button';
        copyId.className = 'registry-btn';
        copyId.textContent = t('copyId');
        copyId.addEventListener('click', () => copyText(card.id || '', t('idCopied'), t('idCopyFailed')));

        const discussion = document.createElement('button');
        discussion.type = 'button';
        discussion.className = 'registry-btn';
        discussion.dataset.discussionTerm = discussionTerm(card);
        discussion.textContent = t('startDiscussion');
        discussion.addEventListener('click', () => openDiscussion(card, discussion));

        actions.append(open, copyId, discussion);
        article.append(head, grid, actions);
        return article;
      }
      function render() {
        updateStaticI18n();
        if (!state.registry) {
          if (state.messageKey) {
            els.message.hidden = false;
            els.message.textContent = t(state.messageKey);
          }
          return;
        }
        state.messageKey = '';
        const filtered = sortedCards(state.cards.filter(cardMatches));
        els.summary.textContent = t('found')(filtered.length, state.cards.length);
        els.message.hidden = true; els.message.textContent = '';
        els.list.replaceChildren(...filtered.map(renderCard));
        if (!state.cards.length) { els.message.hidden = false; els.message.textContent = t('emptyRegistry'); }
        else if (!filtered.length) { els.message.hidden = false; els.message.textContent = t('nothingFound'); }
      }
      async function loadFullJson(card) {
        if (!card.detail_path) throw new Error('Missing detail_path');
        if (state.fullJsonCache.has(card.detail_path)) return state.fullJsonCache.get(card.detail_path);
        const response = await fetch(`../${card.detail_path}`, { cache: 'no-store' });
        if (!response.ok) throw new Error('Could not load JSON');
        const json = JSON.stringify(await response.json(), null, 2);
        state.fullJsonCache.set(card.detail_path, json); return json;
      }
      async function openJson(card, trigger) {
        state.lastFocused = trigger || document.activeElement;
        try { els.jsonView.value = await loadFullJson(card); openModal(); } catch (_) { showToast(t('jsonLoadFailed')); }
      }
      function openModal() { els.modal.classList.add('is-open'); els.modal.setAttribute('aria-hidden', 'false'); els.jsonView.focus(); }
      function closeModal() { els.modal.classList.remove('is-open'); els.modal.setAttribute('aria-hidden', 'true'); els.jsonView.value = ''; if (state.lastFocused) state.lastFocused.focus(); }
      async function loadRegistry() {
        updateStaticI18n();
        try {
          const response = await fetch('../cards/registry.json', { cache: 'no-store' });
          if (!response.ok) throw new Error('Registry not found');
          const registry = await response.json();
          if (!registry || !Array.isArray(registry.cards)) throw new Error('Invalid registry');
          state.registry = registry; state.cards = registry.cards.filter((card) => !card.status || card.status === 'accepted' || card.accepted_at);
          render();
        } catch (error) {
          els.summary.textContent = ''; els.list.replaceChildren(); state.messageKey = error.message === 'Invalid registry' ? 'invalidRegistry' : 'loadError'; els.message.hidden = false; els.message.textContent = t(state.messageKey);
        }
      }
      [els.search, els.type, els.pos, els.group, els.author, els.minPi, els.sort].forEach((el) => {
        el.addEventListener('input', () => {
          readFiltersFromDom();
          render();
        });

        el.addEventListener('change', () => {
          readFiltersFromDom();
          render();
        });
      });
      els.reset.addEventListener('click', async () => {
        const shouldReset = await (
          window.InteralUI?.confirmReset?.({
            title: state.lang === 'en' ? 'Reset?' : 'Сбросить?',
            message: t('resetConfirm'),
            confirmLabel: state.lang === 'en' ? 'Reset' : 'Сбросить',
            cancelLabel: state.lang === 'en' ? 'Cancel' : 'Отмена'
          })
          ?? Promise.resolve(window.confirm(t('resetConfirm')))
        );

        if (!shouldReset) return;

        resetFiltersState();
        render();
      });
      els.modalX.addEventListener('click', closeModal);
      els.modal.addEventListener('click', (event) => {
        if (event.target.dataset.modalClose === 'true') closeModal();
      });

      els.giscusX.addEventListener('click', closeDiscussion);
      els.giscusModal.addEventListener('click', (event) => {
        if (event.target.dataset.giscusClose === 'true') closeDiscussion();
      });

      els.modalCopy.addEventListener('click', async () => {
        if (await copyText(els.jsonView.value, t('jsonCopied'), t('jsonCopyFailed'))) {
          setCopyButtonCopied(els.modalCopy, true);
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return;

        if (els.giscusModal.classList.contains('is-open')) {
          closeDiscussion();
          return;
        }

        if (els.modal.classList.contains('is-open')) {
          closeModal();
        }
      });

      document.addEventListener('interal:languagechange', (event) => {
        state.lang = currentLang();
        document.documentElement.lang = currentLang();
        render();
      });

      applyFiltersToDom();
      loadRegistry();
    })();
  </script>
</body>
</html>
