<title>Similaritá</title>

<style>
.similarita-page {
  margin: 0;
  padding: 0 16px 32px;
  background-color: var(--bg);
  min-height: 100vh;
  color: var(--text);
  font-family: "Jost", "Helvetica Neue", Helvetica, Arial, sans-serif;
  line-height: 1.5;
}

.similarita-page.has-global-menu { padding-top: 86px; }

@media (max-width: 768px) {
  .similarita-page {
    padding-left: 12px;
    padding-right: 12px;
    padding-bottom: 24px;
  }

  .similarita-page.has-global-menu { padding-top: 86px; }
}

.similarita-page .card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  max-width: 640px;
  margin: 0 auto 20px auto;
  padding: 24px;
  border-radius: var(--radius-lg);
}

.similarita-page .card h2 {
  text-align: center;
  margin-top: 0;
  margin-bottom: 14px;
  letter-spacing: 0.2px;
  font-weight: 600;
  color: var(--text);
}

.similarita-page .card > h2 {
  font-size: 1.25rem;
}

.similarita-page label {
  display: block;
  margin-top: 14px;
  font-size: 14px;
  color: var(--text-muted);
  font-weight: 600;
  font-family: "Jost", "Helvetica Neue", Helvetica, Arial, sans-serif;
}

.similarita-page input,
.similarita-page select {
  width: 100%;
  padding: 11px 12px;
  margin-top: 6px;
  font-size: 16px;
  box-sizing: border-box;
  border: 1px solid var(--border-control);
  border-radius: var(--radius-md);
  background: var(--surface-elevated);
  color: var(--text);
  font-family: "Jost", "Helvetica Neue", Helvetica, Arial, sans-serif;
}

.similarita-page input::placeholder {
  color: var(--placeholder);
}

.similarita-page input:focus-visible,
.similarita-page select:focus-visible {
  border-color: var(--border-strong);
}


.similarita-page .card-tools {
  position: absolute;
  top: 12px;
  right: 12px;
  display: flex;
  justify-content: flex-end;
  z-index: 2;
}

.similarita-page .card-reset-btn {
  width: 38px;
  height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border-control);
  border-radius: var(--radius-md);
  background: var(--surface-elevated);
  color: var(--text);
  box-shadow: none;
  padding: 0;
}

.similarita-page .card-reset-btn:hover,
.similarita-page .card-reset-btn:focus-visible {
  filter: brightness(1.08);
  transform: translateY(-1px);
}

.similarita-page .card-reset-btn.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.similarita-page .tool-btn {
  width: 100%;
  margin-top: 16px;
  padding: 12px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.2px;
  background: var(--button-primary-bg);
  color: var(--button-primary-text);
  border: 1px solid var(--button-primary-bg);
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.similarita-page .tool-btn:hover,
.similarita-page .tool-btn:focus-visible {
  transform: translateY(-1px);
}

.similarita-page .tool-btn:focus-visible {
  outline: 2px solid var(--focus-outline);
  outline-offset: 2px;
}

.similarita-page .result {
  margin-top: 14px;
  padding: 10px 12px;
  font-size: 15px;
  border-radius: var(--radius-md);
  background: var(--surface-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text);
}

.similarita-page .result-row {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  padding: 4px 0;
}

.similarita-page .result-row span:first-child {
  color: var(--text-muted);
  font-weight: 600;
}

.similarita-page .result-row span:last-child {
  text-align: right;
  overflow-wrap: anywhere;
}

.similarita-page .result-warning {
  margin-top: 8px;
  color: var(--text-muted);
  font-size: 14px;
}

.similarita-page #explainText {
  font-family: "Jost", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 14px;
  margin-bottom: 20px;
}

.similarita-page .explain-title {
  margin: 0 0 14px;
  text-align: center;
  font-size: 1.6rem;
  font-weight: 800;
  line-height: 1.2;
}

.similarita-page .explain-body {
  margin: 0;
  white-space: pre-wrap;
}

.similarita-page .modal-inner {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
}

.similarita-page #explainModal {
  position: fixed;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  box-sizing: border-box;
  background: rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: var(--z-page-modal);
}

.similarita-page #explainModal.show {
  opacity: 1;
  pointer-events: auto;
}

body.dark-theme .similarita-page #explainModal {
  background: rgba(0, 0, 0, 0.62);
}
</style>

function t(key) {
  const lang = localStorage.getItem("interal.lang") === "en" ? "en" : "ru";
  return (i18n[lang] && i18n[lang][key]) || i18n.ru[key] || key;
}

function applyTranslations() {
  const lang = localStorage.getItem("interal.lang") === "en" ? "en" : "ru";

  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const key = el.getAttribute("data-i18n");
    el.textContent = (i18n[lang] && i18n[lang][key]) || i18n.ru[key] || el.textContent;
  });

  document.title = "Similaritá";

  const resetText = t("sim.reset");
  resetBtn.setAttribute("aria-label", resetText);
  resetBtn.setAttribute("title", resetText);
}

function hasUserInputForReset() {
  const interalWord = String(wordInteralInput.value || "").trim();
  const nationalWord = String(wordOtherInput.value || "").trim();
  const hasSelectedLanguage = otherLanguageSelect.value !== "en";
  return interalWord.length > 0 || nationalWord.length > 0 || hasSelectedLanguage;
}

function syncResetButtonVisibility() {
  resetBtn.classList.toggle("is-hidden", !hasUserInputForReset());
}

function resetAll() {
  const shouldReset = window.confirm(t("sim.resetWarning"));
  if (!shouldReset) return;

  abortActiveRun();

  wordInteralInput.value = "";

  resultBox.style.display = "none";
  resultBox.innerHTML = "";

  explainBtn.style.display = "none";
  explanationText = "";
  syncResetButtonVisibility();
}

  abortActiveRun();

function normalize(text) {
  return String(text || "").trim().toLowerCase().normalize("NFC");
}

function stripDiacritics(text) {
  return String(text || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .normalize("NFC");
}

function stripInteralStressMarks(word) {
  return String(word || "")
    .normalize("NFC")
    .replace(/[áà]/g, "a")
    .replace(/[éè]/g, "e")
    .replace(/[íì]/g, "i")
    .replace(/[óò]/g, "o")
    .replace(/[úù]/g, "u");
}

function isInteralVowel(ch) {
  return INTERAL_VOWELS.has(ch);
}

function transliterateRussian(text) {
  return String(text || "")
    .toLowerCase()
    .normalize("NFC")
    .split("")
    .map((ch) => RU_TO_LATIN[ch] ?? ch)
    .join("");
}

function transliterateGreek(text) {
  let s = stripDiacritics(String(text || "").toLowerCase()).replace(/ς/g, "σ");

  s = s
    .replace(/αι/g, "e")
    .replace(/ει/g, "i")
    .replace(/οι/g, "i")
    .replace(/υι/g, "i")
    .replace(/ου/g, "u")
    .replace(/αυ/g, "av")
    .replace(/ευ/g, "ev")
    .replace(/ηυ/g, "iv")
    .replace(/μπ/g, "b")
    .replace(/ντ/g, "d")
    .replace(/γκ/g, "g")
    .replace(/γγ/g, "ng")
    .replace(/γχ/g, "nch")
    .replace(/γξ/g, "nx");

  const map = {
    "α": "a",
    "β": "v",
    "γ": "g",
    "δ": "d",
    "ε": "e",
    "ζ": "z",
    "η": "i",
    "θ": "th",
    "ι": "i",
    "κ": "k",
    "λ": "l",
    "μ": "m",
    "ν": "n",
    "ξ": "x",
    "ο": "o",
    "π": "p",
    "ρ": "r",
    "σ": "s",
    "τ": "t",
    "υ": "y",
    "φ": "f",
    "χ": "ch",
    "ψ": "ps",
    "ω": "o"
  };

  return s.split("").map((ch) => map[ch] ?? ch).join("");
}

function normalizeGraphicInput(word, langCode) {
  const normalized = normalize(word);

  if (langCode === "interal") return stripInteralStressMarks(normalized);
  if (langCode === "ru") return transliterateRussian(normalized);
  if (langCode === "el") return transliterateGreek(normalized);

  return stripDiacritics(normalized)
    .replace(/ß/g, "ss")
    .replace(/æ/g, "ae")
    .replace(/œ/g, "oe")
    .replace(/ø/g, "o")
    .replace(/ð/g, "d")
    .replace(/þ/g, "th")
    .replace(/ł/g, "l");
}

function interalToIPA(input) {
  const original = normalize(input);
  const word = stripInteralStressMarks(original);

  if (!word) return "";

  let ipa = "";
  let i = 0;

  while (i < word.length) {
    const rest = word.slice(i);
    const ch = word[i];
    const prev = word[i - 1] || "";
    const next = word[i + 1] || "";
    const next2 = word[i + 2] || "";

    if (
      i === 0 &&
      ch === "h" &&
      isInteralVowel(next) &&
      OPTIONAL_SILENT_INITIAL_H.has(word)
    ) {
      i += 1;
      continue;
    }

    if (
      ch === "q" &&
      (word === "que" || word === "quel" || word === "quelc")
    ) {
      ipa += "k";
      i += 2;
      continue;
    }

    if (ch === "x" && X_KZ_WORDS.has(word)) {
      ipa += "kz";
      i += 1;
      continue;
    }

    if (rest.startsWith("ch")) {
      ipa += "t͡ɕ";
      i += 2;
      continue;
    }

    if (rest.startsWith("sh")) {
      ipa += "ʂ";
      i += 2;
      continue;
    }

    if (rest.startsWith("ph")) {
      ipa += "f";
      i += 2;
      continue;
    }

    if (rest.startsWith("rh")) {
      ipa += "r";
      i += 2;
      continue;
    }

    if (rest.startsWith("th")) {
      ipa += "t";
      i += 2;
      continue;
    }

    if (rest.startsWith("zz")) {
      ipa += "t͡s";
      i += 2;
      continue;
    }

    if (rest.startsWith("qu")) {
      ipa += "kw";
      i += 2;
      continue;
    }

    if (rest.startsWith("gu") && isInteralVowel(next2)) {
      ipa += "gw";
      i += 2;
      continue;
    }

    if (ch === "t" && next === "i" && ["a", "e", "o", "u"].includes(next2)) {
      ipa += "t͡s";
      i += 1;
      continue;
    }

    if (ch === "c") {
      ipa += ["i", "e", "y"].includes(next) ? "t͡s" : "k";
      i += 1;
      continue;
    }

    if (ch === "s" && isInteralVowel(prev) && isInteralVowel(next)) {
      ipa += "z";
      i += 1;
      continue;
    }

    if (
      ch === "u" &&
      (prev === "a" || prev === "e") &&
      !INTERAL_U_EXCEPTIONS.has(word)
    ) {
      ipa += "w";
      i += 1;
      continue;
    }

    if (ch === "y") {
      ipa += (isInteralVowel(prev) || isInteralVowel(next)) ? "j" : "i";
      i += 1;
      continue;
    }

    switch (ch) {
      case "a": ipa += "a"; break;
      case "b": ipa += "b"; break;
      case "d": ipa += "d"; break;
      case "e": ipa += "e"; break;
      case "f": ipa += "f"; break;
      case "g": ipa += "g"; break;
      case "h": ipa += "x"; break;
      case "i": ipa += "i"; break;
      case "j": ipa += "ʒ"; break;
      case "k": ipa += "k"; break;
      case "l": ipa += "l"; break;
      case "m": ipa += "m"; break;
      case "n": ipa += "n"; break;
      case "o": ipa += "o"; break;
      case "p": ipa += "p"; break;
      case "q": ipa += "k"; break;
      case "r": ipa += "r"; break;
      case "s": ipa += "s"; break;
      case "t": ipa += "t"; break;
      case "u": ipa += "u"; break;
      case "v": ipa += "v"; break;
      case "w": ipa += "w"; break;
      case "x": ipa += "ks"; break;
      case "z": ipa += "z"; break;
      default: ipa += ch; break;
    }

    i += 1;
  }

  return ipa;
}

function interalIPAForAline(word) {
  return interalToIPA(word)
    .replace(/t͡ɕ/g, "t͡ʃ")
    .replace(/ʂ/g, "ʃ")
    .replace(/x/g, "h");
}

function levenshtein(a, b) {
  const n = a.length;
  const m = b.length;
  const dp = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));

  for (let i = 0; i <= n; i++) dp[i][0] = i;
  for (let j = 0; j <= m; j++) dp[0][j] = j;

  for (let i = 1; i <= n; i++) {
    for (let j = 1; j <= m; j++) {
      let cost;

      if (a[i - 1] === b[j - 1]) {
        cost = 0;
      } else if (
        (i > 1 && a[i - 1] === b[j - 2]) ||
        (j > 1 && a[i - 2] === b[j - 1])
      ) {
        cost = 0.5;
      } else {
        cost = 1;
      }

      dp[i][j] = Math.min(
        dp[i - 1][j] + 1,
        dp[i][j - 1] + 1,
        dp[i - 1][j - 1] + cost
      );
    }
  }

  return dp[n][m];
}

function graphicSimilarity(a, b) {
  const d = levenshtein(a, b);
  const maxLen = Math.max(a.length, b.length);

  if (maxLen === 0) return 0;

  return clamp01(1 - d / maxLen);
}

async function safeFetchJSON(url) {
  try {
    const response = await fetch(url, { cache: "no-cache" });
    if (!response.ok) return null;
    return await response.json();
  } catch (error) {
    console.warn("Cannot load JSON:", url, error);
    return null;
  }
}

async function loadPieVordes() {
  if (!pieVordesPromise) {
    pieVordesPromise = (async () => {
      const direct = await safeFetchJSON("./pie_vordes");
      if (direct && Array.isArray(direct.items)) return direct;

      const json = await safeFetchJSON("./pie_vordes.json");
      if (json && Array.isArray(json.items)) return json;

      return { languages: LANG_CODES, items: [] };
    })().catch((error) => {
      console.warn("pie_vordes failed:", error);
      pieVordesPromise = null;
      return { languages: LANG_CODES, items: [] };
    });
  }

  return pieVordesPromise;
}

function splitVariants(value) {
  if (!value) return [];

  if (Array.isArray(value)) {
    return value.flatMap(splitVariants);
  }

  if (typeof value === "object") {
    return splitVariants(value.word || value.words || value.form || value.forms || "");
  }

  return String(value)
    .split(/\s*\/\s*|,\s*|;\s*|\s+\|\s+/)
    .map((x) => x.trim())
    .filter(Boolean);
}

function getPieCell(item, langCode) {
  const cell = item && item[langCode];

  if (!cell) {
    return { words: [], ipa: "" };
  }

  if (typeof cell === "string") {
    return {
      words: splitVariants(cell),
      ipa: item.ipa && item.ipa[langCode] ? String(item.ipa[langCode]) : ""
    };
  }

  if (Array.isArray(cell)) {
    return {
      words: splitVariants(cell),
      ipa: item.ipa && item.ipa[langCode] ? String(item.ipa[langCode]) : ""
    };
  }

  if (typeof cell === "object") {
    return {
      words: splitVariants(cell.word || cell.words || cell.form || cell.forms || ""),
      ipa: String(cell.ipa || "")
    };
  }

  return { words: [], ipa: "" };
}

function getPieForms(item, langCode) {
  return getPieCell(item, langCode).words;
}

function getPieIPA(item, langCode) {
  const cell = getPieCell(item, langCode);
  if (cell.ipa) return cell.ipa;

  if (item && item.ipa && item.ipa[langCode]) {
    return String(item.ipa[langCode]);
  }

  return "";
}

function findPieRowByNationalWord(data, nationalWord, selectedLang) {
  const querySelected = normalizeGraphicInput(nationalWord, selectedLang);

  for (const item of data.items || []) {
    const forms = getPieForms(item, selectedLang);

    for (const form of forms) {
      const normalizedForm = normalizeGraphicInput(form, selectedLang);

      if (normalizedForm && normalizedForm === querySelected) {
        return {
          item,
          matchedWord: form,
          matchedLang: selectedLang,
          method: "exact_selected_language",
          score: 1
        };
      }
    }
  }

  let bestInSelected = null;

  for (const item of data.items || []) {
    const forms = getPieForms(item, selectedLang);

    for (const form of forms) {
      const normalizedForm = normalizeGraphicInput(form, selectedLang);
      if (!normalizedForm) continue;

      const score = graphicSimilarity(querySelected, normalizedForm);

      if (!bestInSelected || score > bestInSelected.score) {
        bestInSelected = {
          item,
          matchedWord: form,
          matchedLang: selectedLang,
          method: "similar_selected_language",
          score
        };
      }
    }
  }

  if (bestInSelected && bestInSelected.score >= 0.86) {
    return bestInSelected;
  }

  let bestInAll = null;

  for (const item of data.items || []) {
    for (const lang of LANG_CODES) {
      const queryForLang = normalizeGraphicInput(nationalWord, lang);
      const forms = getPieForms(item, lang);

      for (const form of forms) {
        const normalizedForm = normalizeGraphicInput(form, lang);
        if (!normalizedForm) continue;

        if (normalizedForm === queryForLang) {
          return {
            item,
            matchedWord: form,
            matchedLang: lang,
            method: "exact_other_language",
            score: 1
          };
        }

        const score = graphicSimilarity(queryForLang, normalizedForm);

        if (!bestInAll || score > bestInAll.score) {
          bestInAll = {
            item,
            matchedWord: form,
            matchedLang: lang,
            method: "similar_other_language",
            score
          };
        }
      }
    }
  }

  if (bestInAll && bestInAll.score >= 0.9) {
    return bestInAll;
  }

  return null;
}

async function resolveNationalWordData(nationalWord, selectedLang) {
  const data = await loadPieVordes();
  const rowMatch = findPieRowByNationalWord(data, nationalWord, selectedLang);

  if (!rowMatch) {
    return {
      wordForComparison: nationalWord,
      wordForIPA: nationalWord,
      row: null,
      pieWord: "",
      pieIPA: "",
      pie: "",
      status: "",
      note: "",
      source: "manual input; pie_vordes not found",
      route: [`pie_vordes:not_found:${selectedLang}:${nationalWord}`]
    };
  }

  const selectedForms = getPieForms(rowMatch.item, selectedLang);
  const selectedCellWord = selectedForms[0] || nationalWord;
  const selectedIPA = getPieIPA(rowMatch.item, selectedLang);

  const matchedSelectedLanguage = rowMatch.matchedLang === selectedLang;
  const wordForComparison = matchedSelectedLanguage ? nationalWord : selectedCellWord;
  const wordForIPA = matchedSelectedLanguage ? nationalWord : selectedCellWord;

  return {
    wordForComparison,
    wordForIPA,
    row: rowMatch.item,
    pieWord: selectedCellWord,
    pieIPA: selectedIPA,
    pie: rowMatch.item.pie || "",
    status: rowMatch.item.status || "",
    note: rowMatch.item.note || "",
    source: "similarita/pie_vordes",
    route: [
      `pie_vordes:matched:${rowMatch.matchedLang}:${rowMatch.matchedWord}`,
      `method:${rowMatch.method}:${Number(rowMatch.score || 0).toFixed(3)}`,
      `selected:${selectedLang}:${selectedCellWord}`
    ]
  };
}

async function fetchWiktionaryHTMLFrom(apiUrl, title, signal) {
  const key = `${apiUrl}:${title}`;
  if (htmlCache.has(key)) return htmlCache.get(key);

  try {
    const url =
      apiUrl + "?" +
      new URLSearchParams({
        action: "parse",
        page: title,
        prop: "text",
        format: "json",
        origin: "*",
        redirects: "1"
      });

    const response = await fetch(url, { signal });
    if (!response.ok) return "";

    const data = await response.json();
    if (data.error) return "";

    const html = data.parse && data.parse.text ? data.parse.text["*"] : "";

    if (html) htmlCache.set(key, html);

    return html;
  } catch (error) {
    if (error && error.name === "AbortError") throw error;
    return "";
  }
}

async function searchWiktionaryTitles(apiUrl, word, signal) {
  const key = `open:${apiUrl}:${word}`;
  if (searchCache.has(key)) return searchCache.get(key);

  try {
    const url =
      apiUrl + "?" +
      new URLSearchParams({
        action: "opensearch",
        search: word,
        limit: "7",
        namespace: "0",
        format: "json",
        origin: "*"
      });

    const response = await fetch(url, { signal });
    if (!response.ok) return [];

    const data = await response.json();
    const titles = Array.isArray(data[1]) ? data[1] : [];

    searchCache.set(key, titles);

    return titles;
  } catch (error) {
    if (error && error.name === "AbortError") throw error;
    return [];
  }
}

function wiktionaryCandidates(word, langCode) {
  const raw = String(word || "").trim();
  const lower = raw.toLowerCase();
  const noDiacritics = stripDiacritics(raw);

  const candidates = [
    raw,
    lower,
    noDiacritics,
    stripDiacritics(lower)
  ];

  if (langCode === "de" && lower) {
    candidates.push(lower.charAt(0).toUpperCase() + lower.slice(1));
    candidates.push(noDiacritics.charAt(0).toUpperCase() + noDiacritics.slice(1));
  }

  if (langCode === "ru") {
    candidates.push(...reverseApproximateRussian(raw));
  }

  if (langCode === "el") {
    candidates.push(...reverseApproximateGreek(raw));
  }

  return [...new Set(candidates.filter(Boolean))].slice(0, 20);
}

function reverseApproximateRussian(text) {
  const base = String(text || "").trim().toLowerCase();

  if (!base || /[а-яё]/i.test(base)) return [];

  const multi = {
    "shch": ["щ"],
    "zh": ["ж"],
    "ch": ["ч"],
    "sh": ["ш"],
    "je": ["е"],
    "jo": ["ё"],
    "ju": ["ю"],
    "ja": ["я"],
    "c": ["ц"],
    "h": ["х"],
    "j": ["й"]
  };

  const single = {
    a: "а",
    b: "б",
    v: "в",
    g: "г",
    d: "д",
    e: "э",
    z: "з",
    i: "и",
    k: "к",
    l: "л",
    m: "м",
    n: "н",
    o: "о",
    p: "п",
    r: "р",
    s: "с",
    t: "т",
    u: "у",
    f: "ф",
    y: "ы",
    "'": "ь"
  };

  return reverseApproximateTransliteration(base, multi, single, 20);
}

function reverseApproximateGreek(text) {
  const base = String(text || "").trim().toLowerCase();

  if (!base || /[\u0370-\u03ff]/.test(base)) return [];

  const multi = {
    "th": ["θ"],
    "ch": ["χ"],
    "ps": ["ψ"],
    "av": ["αυ"],
    "ev": ["ευ"],
    "iv": ["ηυ"],
    "ou": ["ου"],
    "u": ["ου"],
    "i": ["ι", "η", "υ", "ει", "οι"],
    "e": ["ε", "αι"],
    "o": ["ο", "ω"],
    "x": ["ξ"],
    "b": ["μπ"],
    "d": ["δ", "ντ"],
    "g": ["γ", "γκ"]
  };

  const single = {
    a: "α",
    v: "β",
    z: "ζ",
    k: "κ",
    l: "λ",
    m: "μ",
    n: "ν",
    p: "π",
    r: "ρ",
    s: "σ",
    t: "τ",
    f: "φ"
  };

  return reverseApproximateTransliteration(base, multi, single, 20);
}

function reverseApproximateTransliteration(base, multi, single, limit) {
  const keys = Object.keys(multi).sort((a, b) => b.length - a.length);
  let results = [""];

  for (let i = 0; i < base.length;) {
    let matched = "";
    let values = [];

    for (const key of keys) {
      if (base.startsWith(key, i)) {
        matched = key;
        values = multi[key];
        break;
      }
    }

    if (matched) {
      results = expandCandidateList(results, values, limit);
      i += matched.length;
      continue;
    }

    const ch = base[i];
    results = expandCandidateList(results, [single[ch] || ch], limit);
    i += 1;
  }

  return results;
}

function expandCandidateList(prefixes, additions, limit) {
  const out = [];

  for (const prefix of prefixes) {
    for (const addition of additions) {
      out.push(prefix + addition);
      if (out.length >= limit) return out;
    }
  }

  return out;
}

async function gatherWiktionaryCandidates(apiUrl, word, langCode, signal) {
  const exact = wiktionaryCandidates(word, langCode);
  const openRaw = await searchWiktionaryTitles(apiUrl, word, signal);

  const stripped = stripDiacritics(word);
  const openStripped = stripped !== word
    ? await searchWiktionaryTitles(apiUrl, stripped, signal)
    : [];

  return [...new Set([...exact, ...openRaw, ...openStripped].filter(Boolean))].slice(0, 28);
}

function normalizeHeadingText(text) {
  return String(text || "")
    .replace(/\[edit\]/gi, "")
    .replace(/\s+/g, " ")
    .trim();
}

function getLanguageSection(doc, langCode) {
  const labels = WIKTIONARY_LANG_LABELS[langCode] || [];
  const headings = [...doc.querySelectorAll("h2, .mw-heading2")];

  const heading = headings.find((el) => {
    const headline = el.querySelector(".mw-headline");
    const headingText = normalizeHeadingText(headline ? headline.textContent : el.textContent);
    const headingId = (headline && headline.id) || el.id || "";

    return labels.some((label) => {
      const normalizedId = label.replace(/\s+/g, "_");
      return headingText === label || headingId === normalizedId;
    });
  });

  if (!heading) return null;

  const sectionWrapper = heading.closest("section");
  if (sectionWrapper) return sectionWrapper;

  const section = document.createElement("div");
  let node = heading.nextElementSibling;

  while (node) {
    const isNextLanguageHeading =
      node.tagName === "H2" ||
      node.classList.contains("mw-heading2") ||
      !!node.querySelector(":scope > h2");

    if (isNextLanguageHeading) break;

    section.appendChild(node.cloneNode(true));
    node = node.nextElementSibling;
  }

  return section;
}

function extractIPAsFromEnglishWiktionaryHTML(html, langCode) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const section = getLanguageSection(doc, langCode);

  return [
    ...extractIPAsFromElement(section),
    ...extractIPAsFromElement(doc)
  ].filter(onlyUnique);
}

function extractIPAsFromLocalWiktionaryHTML(html, langCode) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const section = getLanguageSection(doc, langCode);

  return [
    ...extractIPAsFromElement(section),
    ...extractIPAsFromElement(doc)
  ].filter(onlyUnique);
}

function extractIPAsFromElement(root) {
  if (!root) return [];

  const result = [];
  const ipaElements = [...root.querySelectorAll(".IPA, [class~='IPA'], [class*='IPA']")];

  for (const element of ipaElements) {
    const ipa = cleanIPA(element.textContent);
    if (ipa) result.push(ipa);
  }

  const text = normalizeWiktionaryText(root.textContent || "");

  const patterns = [
    /IPA[^/\[]*([/\[][^/\]\[]+[/\]])/gi,
    /МФА[^/\[]*([/\[][^/\]\[]+[/\]])/gi,
    /Aussprache[^/\[]*([/\[][^/\]\[]+[/\]])/gi,
    /Prononciation[^/\[]*([/\[][^/\]\[]+[/\]])/gi,
    /Pronunciaci[oó]n[^/\[]*([/\[][^/\]\[]+[/\]])/gi,
    /Pronuncia[^/\[]*([/\[][^/\]\[]+[/\]])/gi,
    /Προφορά[^/\[]*([/\[][^/\]\[]+[/\]])/gi
  ];

  for (const pattern of patterns) {
    const matches = [...text.matchAll(pattern)];

    for (const match of matches) {
      const ipa = cleanIPA(match[1]);
      if (ipa) result.push(ipa);
    }
  }

  return [...new Set(result)];
}

function cleanIPA(text) {
  let s = String(text || "")
    .trim()
    .normalize("NFC")
    .replace(/\s+/g, " ")
    .replace(/ɡ/g, "g")
    .replace(/:/g, "ː");

  const bracketed = s.match(/[\/\[]([^\/\]\[]+)[\/\]]/);

  if (bracketed) {
    s = bracketed[1];
  } else {
    s = s.replace(/^[\/\[]/, "").replace(/[\/\]]$/, "");
  }

  s = s
    .split(/[;,]/)[0]
    .replace(/\([^)]*\)/g, "")
    .replace(/^\s*IPA\s*:?\s*/i, "")
    .replace(/^\s*МФА\s*:?\s*/i, "")
    .replace(/^\s*[-–—]\s*/, "")
    .trim();

  return s;
}

function normalizeWiktionaryText(text) {
  return String(text || "")
    .replace(/\u00a0/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function normalizeIPAForAline(ipa) {
  return String(ipa || "")
    .normalize("NFC")
    .replace(/[\/\[\]()]/g, "")
    .replace(/[ˈˌ.]/g, "")
    .replace(/[ːˑ]/g, "")
    .replace(/[ʰʱʲˠʷˤ˞]/g, "")
    .replace(/[̥̬̪̺̻̩̯̝̞̟̠̹̜̈̃̚]/g, "")
    .replace(/ɡ/g, "g")
    .replace(/ɫ/g, "l")
    .replace(/ɐ|ə/g, "a")
    .trim();
}

async function getNationalIPA(word, langCode, nationalData, signal) {
  const raw = String(word || "").trim();
  const cacheKey = `${langCode}:${raw}`;

  if (ipaCache.has(cacheKey)) return ipaCache.get(cacheKey);

  if (nationalData && nationalData.pieIPA) {
    const result = {
      ipa: nationalData.pieIPA,
      variants: [nationalData.pieIPA],
      title: raw,
      source: "similarita/pie_vordes",
      route: [...(nationalData.route || []), `pie_vordes:ipa:${langCode}`]
    };

    ipaCache.set(cacheKey, result);
    return result;
  }

  const fallback = IPA_FALLBACKS[langCode]?.[normalize(raw)];

  if (fallback) {
    const result = {
      ipa: fallback,
      variants: [fallback],
      title: raw,
      source: "local IPA fallback",
      route: [`fallback:${langCode}:${raw}`]
    };

    ipaCache.set(cacheKey, result);
    return result;
  }

  const wiki = await getWiktionaryIPA(raw, langCode, signal);

  ipaCache.set(cacheKey, wiki);
  return wiki;
}

async function getWiktionaryIPA(word, langCode, signal) {
  const raw = String(word || "").trim();
  const route = [];
  const enApi = WIKTIONARY_APIS.en;
  const localApi = WIKTIONARY_APIS[langCode];

  const enCandidates = await gatherWiktionaryCandidates(enApi, raw, langCode, signal);

  for (const title of enCandidates) {
    route.push(`en:${title}`);

    const html = await fetchWiktionaryHTMLFrom(enApi, title, signal);
    if (!html) continue;

    const variants = extractIPAsFromEnglishWiktionaryHTML(html, langCode);

    if (variants.length) {
      return {
        ipa: variants[0],
        variants,
        title,
        source: `en.wiktionary.org/wiki/${encodeURIComponent(title)}`,
        route
      };
    }
  }

  if (localApi && localApi !== enApi) {
    const localCandidates = await gatherWiktionaryCandidates(localApi, raw, langCode, signal);

    for (const title of localCandidates) {
      route.push(`${langCode}:${title}`);

      const html = await fetchWiktionaryHTMLFrom(localApi, title, signal);
      if (!html) continue;

      const variants = extractIPAsFromLocalWiktionaryHTML(html, langCode);

      if (variants.length) {
        return {
          ipa: variants[0],
          variants,
          title,
          source: `${langCode}.wiktionary.org/wiki/${encodeURIComponent(title)}`,
          route
        };
      }
    }
  }

  return {
    ipa: "",
    variants: [],
    title: "",
    source: "",
    route
  };
}

function calcAlineSimilarity(ipaA, ipaB) {
  if (!window.ALINE) {
    throw new Error(t("sim.alineMissing"));
  }

  const cleanA = normalizeIPAForAline(ipaA);
  const cleanB = normalizeIPAForAline(ipaB);

  if (!cleanA || !cleanB) return null;

  if (window.ALINE.explain) {
    const explanation = window.ALINE.explain(cleanA, cleanB, ALINE_OPTIONS);

    if (typeof explanation.normalized === "number") {
      return explanation;
    }

    if (typeof explanation.similarity === "number") {
      return {
        ...explanation,
        normalized: explanation.similarity
      };
    }

    return {
      ...explanation,
      normalized: 0
    };
  }

  if (window.ALINE.normalizedSimilarity) {
    return {
      normalized: window.ALINE.normalizedSimilarity(cleanA, cleanB, ALINE_OPTIONS),
      tokensA: [],
      tokensB: [],
      alignments: [],
      unknownA: [],
      unknownB: []
    };
  }

  throw new Error(t("sim.alineMissing"));
}

function chooseBestIPAForAline(interalIPAComparable, otherIPAResult) {
  const variants = [
    otherIPAResult.ipa,
    ...(otherIPAResult.variants || [])
  ].filter(Boolean).filter(onlyUnique);

  let best = null;

  for (const ipa of variants) {
    const aline = calcAlineSimilarity(interalIPAComparable, ipa);
    if (!aline) continue;

    const score = clamp01(aline.normalized);

    if (!best || score > best.score) {
      best = {
        ipa,
        score,
        aline
      };
    }
  }

  return best;
}

async function calculateSimilarity() {
  const currentRun = ++runId;
  const signal = createRunSignal();

  const interalWord = String(wordInteralInput.value || "").trim();
  const nationalInputWord = String(wordOtherInput.value || "").trim();
  const nationalLang = otherLanguageSelect.value;

  resultBox.style.display = "block";
  explainBtn.style.display = "none";
  explanationText = "";

  if (!interalWord) {
    resultBox.textContent = t("sim.fillInteral");
    return;
  }

  if (!nationalInputWord) {
    resultBox.textContent = t("sim.fillNational");
    return;
  }

  resultBox.textContent = t("sim.searching");

  try {
    const nationalData = await resolveNationalWordData(nationalInputWord, nationalLang);

    if (currentRun !== runId) return;

    const nationalWordForComparison = nationalData.wordForComparison || nationalInputWord;
    const nationalWordForIPA = nationalData.wordForIPA || nationalInputWord;

    const graphicInteral = normalizeGraphicInput(interalWord, "interal");
    const graphicNational = normalizeGraphicInput(nationalWordForComparison, nationalLang);
    const graphic = graphicSimilarity(graphicInteral, graphicNational);

    const interalIPA = interalToIPA(interalWord);
    const interalIPAComparable = interalIPAForAline(interalWord);

    const nationalIPAResult = await getNationalIPA(nationalWordForIPA, nationalLang, nationalData, signal);

    if (currentRun !== runId) return;

    let phonetic = null;
    let general = null;
    let aline = null;

    if (interalIPAComparable && nationalIPAResult.ipa) {
      const best = chooseBestIPAForAline(interalIPAComparable, nationalIPAResult);

      if (best) {
        nationalIPAResult.ipa = best.ipa;
        phonetic = best.score;
        aline = best.aline;
        general = (graphic + phonetic) / 2;
      }
    }

    const payload = {
      interalWord,
      nationalInputWord,
      nationalWordForComparison,
      nationalWordForIPA,
      nationalLang,
      nationalData,
      graphicInteral,
      graphicNational,
      graphic,
      interalIPA,
      interalIPAComparable,
      nationalIPAResult,
      phonetic,
      general,
      aline
    };

    renderResult(payload);
    buildExplanation(payload);

    explainBtn.style.display = "block";
  } catch (error) {
    if (error && error.name === "AbortError") return;

    resultBox.style.display = "block";
    resultBox.textContent = error.message || String(error);
    explainBtn.style.display = "none";
  }
}

function renderResult(data) {
  const rows = [
    [t("sim.graphicTitle"), formatScore(data.graphic)],
    [`${t("sim.graphicForm")} Interal`, data.graphicInteral],
    [`${t("sim.graphicForm")} ${LANG_NAMES[data.nationalLang]}`, data.graphicNational],
    [`${t("sim.ipa")} Interal`, data.interalIPA ? `/${data.interalIPA}/` : t("sim.ipaNotFound")],
    [`${t("sim.ipa")} ${LANG_NAMES[data.nationalLang]}`, data.nationalIPAResult.ipa ? `/${data.nationalIPAResult.ipa}/` : t("sim.ipaNotFound")],
    [t("sim.phoneticTitle"), data.phonetic === null ? "—" : formatScore(data.phonetic)],
    [t("sim.generalTitle"), data.general === null ? "—" : formatScore(data.general)]
  ];

  resultBox.innerHTML = rows.map(([label, value]) => `
    <div class="result-row">
      <span>${escapeHTML(label)}</span>
      <span>${escapeHTML(value)}</span>
    </div>
  `).join("");

  if (data.nationalData && data.nationalData.row) {
    resultBox.innerHTML += `
      <div class="result-warning">
        ${escapeHTML(t("sim.pieRow"))}: id ${escapeHTML(data.nationalData.row.id || "—")}; PIE ${escapeHTML(data.nationalData.pie || "—")}; status ${escapeHTML(data.nationalData.status || "—")}
      </div>
    `;
  } else {
    resultBox.innerHTML += `
      <div class="result-warning">
        pie_vordes: строка не найдена; национальное слово использовано напрямую, IPA искалось в fallback/Wiktionary.
      </div>
    `;
  }

  if (!data.nationalIPAResult.ipa) {
    resultBox.innerHTML += `
      <div class="result-warning">
        ${escapeHTML(t("sim.ipaNotFound"))}. Route: ${escapeHTML(data.nationalIPAResult.route && data.nationalIPAResult.route.length ? data.nationalIPAResult.route.join(" → ") : "—")}
      </div>
    `;
  }

  if (data.aline && ((data.aline.unknownA || []).length || (data.aline.unknownB || []).length)) {
    resultBox.innerHTML += `
      <div class="result-warning">
        Unknown IPA segments:
        Interal: ${escapeHTML((data.aline.unknownA || []).join(", ") || "none")};
        ${escapeHTML(LANG_NAMES[data.nationalLang])}: ${escapeHTML((data.aline.unknownB || []).join(", ") || "none")}
      </div>
    `;
  }
}

function buildExplanation(data) {
  const alignment = data.aline && data.aline.alignments && data.aline.alignments[0]
    ? data.aline.alignments[0]
    : [];

  const tokensA = data.aline && data.aline.tokensA ? data.aline.tokensA.join(" ") : "—";
  const tokensB = data.aline && data.aline.tokensB ? data.aline.tokensB.join(" ") : "—";

  const unknownA = data.aline && data.aline.unknownA && data.aline.unknownA.length
    ? data.aline.unknownA.join(", ")
    : t("sim.none");

  const unknownB = data.aline && data.aline.unknownB && data.aline.unknownB.length
    ? data.aline.unknownB.join(", ")
    : t("sim.none");

  const row = data.nationalData && data.nationalData.row ? data.nationalData.row : null;

  explanationText =
`Similaritá

${t("sim.word")} Interal: ${data.interalWord}
${t("sim.graphicForm")} Interal: ${data.graphicInteral}
${t("sim.ipa")} Interal: ${data.interalIPA ? `/${data.interalIPA}/` : t("sim.ipaNotFound")}
IPA for ALINE Interal: /${data.interalIPAComparable}/

${t("sim.word")} ${LANG_NAMES[data.nationalLang]} input: ${data.nationalInputWord}
${t("sim.word")} ${LANG_NAMES[data.nationalLang]} used for comparison: ${data.nationalWordForComparison}
${t("sim.word")} ${LANG_NAMES[data.nationalLang]} used for IPA: ${data.nationalWordForIPA}
${t("sim.language")}: ${LANG_NAMES[data.nationalLang]}
${t("sim.graphicForm")} ${LANG_NAMES[data.nationalLang]}: ${data.graphicNational}
${t("sim.ipa")} ${LANG_NAMES[data.nationalLang]}: ${data.nationalIPAResult.ipa ? `/${data.nationalIPAResult.ipa}/` : t("sim.ipaNotFound")}
${t("sim.source")}: ${data.nationalIPAResult.source || "—"}
${t("sim.lookupRoute")}: ${data.nationalIPAResult.route && data.nationalIPAResult.route.length ? data.nationalIPAResult.route.join(" → ") : "—"}

pie_vordes:
Found: ${row ? "yes" : "no"}
${row ? `ID: ${row.id || "—"}
PIE: ${data.nationalData.pie || "—"}
Status: ${data.nationalData.status || "—"}
Note: ${data.nationalData.note || "—"}` : "The national word was not found in pie_vordes. The calculator used the entered national word directly and searched IPA in fallback/Wiktionary."}
Route: ${data.nationalData.route && data.nationalData.route.length ? data.nationalData.route.join(" → ") : "—"}

${t("sim.graphicTitle")}
${t("sim.formula")}: 1 − (Levenshtein distance / max length)
${t("sim.result")}: ${formatScore(data.graphic)}

${t("sim.phoneticTitle")}
Method: ALINE
${t("sim.tokens")} Interal: ${tokensA}
${t("sim.tokens")} ${LANG_NAMES[data.nationalLang]}: ${tokensB}

${t("sim.alignment")}:
${alignment.length ? alignment.map((pair) => Array.isArray(pair) ? `${pair[0]} ↔ ${pair[1]}` : String(pair)).join("\n") : "—"}

${t("sim.unknownSegments")} Interal: ${unknownA}
${t("sim.unknownSegments")} ${LANG_NAMES[data.nationalLang]}: ${unknownB}

${t("sim.result")}: ${data.phonetic === null ? "—" : formatScore(data.phonetic)}

${t("sim.generalTitle")}
${t("sim.formula")}: (${t("sim.graphicTitle")} + ${t("sim.phoneticTitle")}) / 2
${data.general === null ? "—" : `(${formatScore(data.graphic)} + ${formatScore(data.phonetic)}) / 2 = ${formatScore(data.general)}`}

Process:
1. Interal candidate is entered manually.
2. National word is entered manually.
3. The selected national language determines graphic normalization and the primary pie_vordes lookup.
4. The calculator searches the national word in pie_vordes among en/de/fr/es/it/ru/el.
5. If a row is found, its selected-language form and IPA are used where available.
6. If IPA is absent in pie_vordes, local fallback and Wiktionary are used.
7. Interal IPA is generated locally.
8. Graphic, phonetic and general similarity are calculated.`;
}

function showExplain() {
  if (!explanationText) return;

  const [title, ...restLines] = explanationText.split("\n");

  explainText.innerHTML = "";

  const titleElement = document.createElement("h3");
  titleElement.className = "explain-title";
  titleElement.textContent = title.trim();

  const bodyElement = document.createElement("div");
  bodyElement.className = "explain-body";
  bodyElement.textContent = restLines.join("\n").trim();

  explainText.append(titleElement, bodyElement);
  explainModal.classList.add("show");
}

function closeExplain() {
  explainModal.classList.remove("show");
}

function debounce(fn, delay = 1200) {
  let timer = null;

  return function (...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), delay);
  };
}

function formatScore(value) {
  return clamp01(value).toFixed(3);
}

function clamp01(x) {
  if (!Number.isFinite(x)) return 0;
  return Math.max(0, Math.min(1, x));
}

function onlyUnique(value, index, array) {
  return value && array.indexOf(value) === index;
}

function escapeHTML(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

const calculateDebounced = debounce(() => {
  const interalWord = String(wordInteralInput.value || "").trim();
  const nationalWord = String(wordOtherInput.value || "").trim();

  if (interalWord.length >= 2 && nationalWord.length >= 1) {
    calculateSimilarity();
  }
}, 1200);

explainModal.onclick = function(e) {
  if (e.target === explainModal) {
    closeExplain();
  }
};

applyTranslations();
syncResetButtonVisibility();

calcBtn.addEventListener("click", calculateSimilarity);
resetBtn.addEventListener("click", resetAll);
wordInteralInput.addEventListener("input", calculateDebounced);
wordInteralInput.addEventListener("input", syncResetButtonVisibility);
wordOtherInput.addEventListener("input", calculateDebounced);
wordOtherInput.addEventListener("input", syncResetButtonVisibility);
otherLanguageSelect.addEventListener("change", calculateSimilarity);
otherLanguageSelect.addEventListener("change", syncResetButtonVisibility);
explainBtn.addEventListener("click", showExplain);
document.getElementById("closeExplainBtn").addEventListener("click", closeExplain);
document.addEventListener("interal:languagechange", applyTranslations);
</script>
