function normalize(text) {
  return String(text || "").trim().toLowerCase().normalize("NFC");
}

function stripDiacritics(text) {
  return String(text || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .normalize("NFC");
}

function levenshtein(a, b) {
  const n = a.length;
  const m = b.length;
  const dp = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));

  for (let i = 0; i <= n; i++) dp[i][0] = i;
  for (let j = 0; j <= m; j++) dp[0][j] = j;

  for (let i = 1; i <= n; i++) {
    for (let j = 1; j <= m; j++) {
      let cost;

      if (a[i - 1] === b[j - 1]) {
        cost = 0;
      } else if (
        (i > 1 && a[i - 1] === b[j - 2]) ||
        (j > 1 && a[i - 2] === b[j - 1])
      ) {
        cost = 0.5;
      } else {
        cost = 1;
      }

      dp[i][j] = Math.min(
        dp[i - 1][j] + 1,
        dp[i][j - 1] + 1,
        dp[i - 1][j - 1] + cost
      );
    }
  }

  return dp[n][m];
}

function graphicSimilarity(a, b) {
  const d = levenshtein(a, b);
  const maxLen = Math.max(a.length, b.length);
  if (maxLen === 0) return 0;
  return clamp01(1 - d / maxLen);
}

const RU_TO_LATIN = {
  "а": "a",
  "б": "b",
  "в": "v",
  "г": "g",
  "д": "d",
  "е": "je",
  "ё": "jo",
  "ж": "zh",
  "з": "z",
  "и": "i",
  "й": "j",
  "к": "k",
  "л": "l",
  "м": "m",
  "н": "n",
  "о": "o",
  "п": "p",
  "р": "r",
  "с": "s",
  "т": "t",
  "у": "u",
  "ф": "f",
  "х": "h",
  "ц": "c",
  "ч": "ch",
  "ш": "sh",
  "щ": "shch",
  "ъ": "",
  "ы": "y",
  "ь": "'",
  "э": "e",
  "ю": "ju",
  "я": "ja"
};

function transliterateRussian(text) {
  return String(text || "")
    .toLowerCase()
    .normalize("NFC")
    .split("")
    .map((ch) => RU_TO_LATIN[ch] ?? ch)
    .join("");
}

function transliterateGreek(text) {
  let s = stripDiacritics(String(text || "").toLowerCase())
    .replace(/ς/g, "σ");

  s = s
    .replace(/αι/g, "e")
    .replace(/ει/g, "i")
    .replace(/οι/g, "i")
    .replace(/υι/g, "i")
    .replace(/ου/g, "u")
    .replace(/αυ/g, "av")
    .replace(/ευ/g, "ev")
    .replace(/ηυ/g, "iv")
    .replace(/μπ/g, "b")
    .replace(/ντ/g, "d")
    .replace(/γκ/g, "g")
    .replace(/γγ/g, "ng")
    .replace(/γχ/g, "nch")
    .replace(/γξ/g, "nx");

  const map = {
    "α": "a",
    "β": "v",
    "γ": "g",
    "δ": "d",
    "ε": "e",
    "ζ": "z",
    "η": "i",
    "θ": "th",
    "ι": "i",
    "κ": "k",
    "λ": "l",
    "μ": "m",
    "ν": "n",
    "ξ": "x",
    "ο": "o",
    "π": "p",
    "ρ": "r",
    "σ": "s",
    "τ": "t",
    "υ": "y",
    "φ": "f",
    "χ": "ch",
    "ψ": "ps",
    "ω": "o"
  };

  return s.split("").map((ch) => map[ch] ?? ch).join("");
}

function normalizeGraphicInput(word, langCode) {
  const normalized = normalize(word);

  if (langCode === "ru") return transliterateRussian(normalized);
  if (langCode === "el") return transliterateGreek(normalized);

  return stripDiacritics(normalized)
    .replace(/ß/g, "ss")
    .replace(/æ/g, "ae")
    .replace(/œ/g, "oe")
    .replace(/ø/g, "o")
    .replace(/ð/g, "d")
    .replace(/þ/g, "th")
    .replace(/ł/g, "l");
}

const WIKTIONARY_APIS = {
  en: "https://en.wiktionary.org/w/api.php",
  de: "https://de.wiktionary.org/w/api.php",

};

const WIKTIONARY_LANG_LABELS = {
  en: ["English"],
  de: ["German", "Deutsch"],
  fr: ["French", "Français"],
  es: ["Spanish", "Español"],
  it: ["Italian", "Italiano"],
  ru: ["Russian", "Русский"],
  el: ["Greek", "Modern Greek", "Ελληνικά"]
};

};

const ipaCache = new Map();
const htmlCache = new Map();
const searchCache = new Map();
const translationCache = new Map();

async function fetchWiktionaryHTMLFrom(apiUrl, title) {
  const key = `${apiUrl}:${title}`;
  if (htmlCache.has(key)) return htmlCache.get(key);

  const url =
    apiUrl + "?" +
    new URLSearchParams({
      action: "parse",
      page: title,
      prop: "text",
      format: "json",
      origin: "*",
      redirects: "1"
    });

  const response = await fetch(url);
  if (!response.ok) return "";

  const data = await response.json();
  if (data.error) return "";

  const html = data.parse && data.parse.text ? data.parse.text["*"] : "";
  htmlCache.set(key, html);

  return html;
}

async function searchWiktionaryTitles(apiUrl, word) {
  const key = `open:${apiUrl}:${word}`;
  if (searchCache.has(key)) return searchCache.get(key);

  const url =
    apiUrl + "?" +
    new URLSearchParams({
      action: "opensearch",
      search: word,
      limit: "10",
      namespace: "0",
      format: "json",
      origin: "*"
    });

  const response = await fetch(url);
  if (!response.ok) return [];

  const data = await response.json();
  const titles = Array.isArray(data[1]) ? data[1] : [];
  searchCache.set(key, titles);

  return titles;
}

async function fullTextWiktionarySearch(apiUrl, word) {
  const key = `full:${apiUrl}:${word}`;
  if (searchCache.has(key)) return searchCache.get(key);

  const url =
    apiUrl + "?" +
    new URLSearchParams({
      action: "query",
      list: "search",
      srsearch: word,
      srlimit: "10",
      srnamespace: "0",
      format: "json",
      origin: "*"
    });

  const response = await fetch(url);
  if (!response.ok) return [];

  const data = await response.json();
  const items = data.query && Array.isArray(data.query.search) ? data.query.search : [];
  const titles = items.map((item) => item.title).filter(Boolean);

  searchCache.set(key, titles);

  return titles;
}

function wiktionaryCandidates(word, langCode) {
  const raw = String(word || "").trim();
  const lower = raw.toLowerCase();
  const noDiacritics = stripDiacritics(raw);
  const candidates = [raw, lower, noDiacritics, stripDiacritics(lower)];

  if (langCode === "de" && lower) {
    candidates.push(lower.charAt(0).toUpperCase() + lower.slice(1));
    candidates.push(noDiacritics.charAt(0).toUpperCase() + noDiacritics.slice(1));
  }

  if (langCode === "ru") {
    candidates.push(...reverseApproximateRussian(raw));
  }

  if (langCode === "el") {
    candidates.push(...reverseApproximateGreek(raw));
  }

  return [...new Set(candidates.filter(Boolean))];
}

function reverseApproximateRussian(text) {
  const base = String(text || "").trim().toLowerCase();
  if (!base || /[а-яё]/i.test(base)) return [];

  const multi = {
    "shch": ["щ"],
    "zh": ["ж"],
    "ch": ["ч"],
    "sh": ["ш"],
    "je": ["е"],
    "jo": ["ё"],
    "ju": ["ю"],
    "ja": ["я"],
    "c": ["ц"],
    "h": ["х"],
    "j": ["й"]
  };

  const single = {
    a: "а",
    b: "б",
    v: "в",
    g: "г",
    d: "д",
    e: "э",
    z: "з",
    i: "и",
    k: "к",
    l: "л",
    m: "м",
    n: "н",
    o: "о",
    p: "п",
    r: "р",
    s: "с",
    t: "т",
    u: "у",
    f: "ф",
    y: "ы",
    "'": "ь"
  };

  return reverseApproximateTransliteration(base, multi, single, 32);
}

function reverseApproximateGreek(text) {
  const base = String(text || "").trim().toLowerCase();
  if (!base || /[\u0370-\u03ff]/.test(base)) return [];

  const multi = {
    "th": ["θ"],
    "ch": ["χ"],
    "ps": ["ψ"],
    "av": ["αυ"],
    "ev": ["ευ"],
    "iv": ["ηυ"],
    "ou": ["ου"],
    "u": ["ου"],
    "i": ["ι", "η", "υ", "ει", "οι"],
    "e": ["ε", "αι"],
    "o": ["ο", "ω"],
    "x": ["ξ"],
    "b": ["μπ"],
    "d": ["δ", "ντ"],
    "g": ["γ", "γκ"]
  };

  const single = {
    a: "α",
    v: "β",
    z: "ζ",
    k: "κ",
    l: "λ",
    m: "μ",
    n: "ν",
    p: "π",
    r: "ρ",
    s: "σ",
    t: "τ",
    f: "φ"
  };

  return reverseApproximateTransliteration(base, multi, single, 32);
}

function reverseApproximateTransliteration(base, multi, single, limit) {
  const keys = Object.keys(multi).sort((a, b) => b.length - a.length);
  let results = [""];

  for (let i = 0; i < base.length;) {
    let matched = "";
    let values = [];

    for (const key of keys) {
      if (base.startsWith(key, i)) {
        matched = key;
        values = multi[key];
        break;
      }
    }

    if (matched) {
      results = expandCandidateList(results, values, limit);
      i += matched.length;
      continue;
    }

    const ch = base[i];
    results = expandCandidateList(results, [single[ch] || ch], limit);
    i += 1;
  }

  return results;
}

function expandCandidateList(prefixes, additions, limit) {
  const out = [];

  for (const prefix of prefixes) {
    for (const addition of additions) {
      out.push(prefix + addition);
      if (out.length >= limit) return out;
    }
  }

  return out;
}

async function gatherWiktionaryCandidates(apiUrl, word, langCode) {
  const exact = wiktionaryCandidates(word, langCode);
  const open = await searchWiktionaryTitles(apiUrl, word);
  const full = await fullTextWiktionarySearch(apiUrl, word);

  return [...new Set([...exact, ...open, ...full].filter(Boolean))].slice(0, 40);
}

function normalizeHeadingText(text) {
  return String(text || "")
    .replace(/\[edit\]/gi, "")
    .replace(/\s+/g, " ")

function getLanguageSection(doc, langCode) {
  const labels = WIKTIONARY_LANG_LABELS[langCode] || [];
  const headings = [...doc.querySelectorAll("h2, .mw-heading2")];

  const heading = headings.find((el) => {
    const headline = el.querySelector(".mw-headline");
    const headingText = normalizeHeadingText(headline ? headline.textContent : el.textContent);
    const headingId = (headline && headline.id) || el.id || "";

    return labels.some((label) => {
      const normalizedId = label.replace(/\s+/g, "_");
      return headingText === label || headingId === normalizedId;
    });
  });

  if (!heading) return null;

  const sectionWrapper = heading.closest("section");
  if (sectionWrapper) return sectionWrapper;

  const section = document.createElement("div");
  let node = heading.nextElementSibling;

  while (node) {
    const isNextLanguageHeading =
      node.tagName === "H2" ||
      node.classList.contains("mw-heading2") ||
      !!node.querySelector(":scope > h2");

    if (isNextLanguageHeading) break;

    section.appendChild(node.cloneNode(true));
    node = node.nextElementSibling;
  }

  return section;
}

function extractIPAFromEnglishWiktionaryHTML(html, langCode) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const section = getLanguageSection(doc, langCode);
  return extractFirstIPAFromElement(section);
}

function extractIPAFromLocalWiktionaryHTML(html, langCode) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const section = getLanguageSection(doc, langCode);
  return extractFirstIPAFromElement(section) || extractFirstIPAFromElement(doc);
}

function extractFirstIPAFromElement(root) {
  if (!root) return "";

  const ipaElements = [...root.querySelectorAll(".IPA, [class~='IPA'], [class*='IPA']")];

  for (const element of ipaElements) {
    const ipa = cleanIPA(element.textContent);
    if (ipa) return ipa;
  }

  const text = normalizeWiktionaryText(root.textContent || "");

  const patterns = [
    /IPA[^/\[]*([/\[][^/\]\[]+[/\]])/i,
    /МФА[^/\[]*([/\[][^/\]\[]+[/\]])/i,
    /Aussprache[^/\[]*([/\[][^/\]\[]+[/\]])/i,
    /Prononciation[^/\[]*([/\[][^/\]\[]+[/\]])/i,
    /Pronunciaci[oó]n[^/\[]*([/\[][^/\]\[]+[/\]])/i,
    /Pronuncia[^/\[]*([/\[][^/\]\[]+[/\]])/i,
    /Προφορά[^/\[]*([/\[][^/\]\[]+[/\]])/i,
    /([/\[][\u0250-\u02AF\u1D00-\u1D7F\u0300-\u036F.a-zɡβðθχʁʃʒʂʐɕʑçʝŋɲʎɾʋˈˌːˑ͜͡ʲʷʰʱ̯̩̥̬̪̠̟̃]+[/\]])/i
  ];

  for (const pattern of patterns) {
    const match = text.match(pattern);
    if (match) {
      const ipa = cleanIPA(match[1]);
      if (ipa) return ipa;
    }
  }

  return "";
}

function normalizeWiktionaryText(text) {
  return String(text || "")
    .replace(/\u00a0/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function cleanIPA(text) {
  let s = String(text || "")
    .trim()
    .normalize("NFC")
    .replace(/\s+/g, " ")
    .replace(/ɡ/g, "g")
    .replace(/:/g, "ː");

  const bracketed = s.match(/[\/\[]([^\/\]\[]+)[\/\]]/);
  if (bracketed) {
    s = bracketed[1];
  } else {
    s = s.replace(/^[\/\[]/, "").replace(/[\/\]]$/, "");
  }

  s = s
    .split(/[;,]/)[0]
    .replace(/^\s*IPA\s*:?\s*/i, "")
    .replace(/^\s*МФА\s*:?\s*/i, "")
    .replace(/[()]/g, "")
    .replace(/^\s*[-–—]\s*/, "")
    .trim();

  return s;
}

async function getOnlineIPA(word, langCode) {
  const raw = String(word || "").trim();
  const key = `${langCode}:${raw}`;

  if (ipaCache.has(key)) return ipaCache.get(key);

  const enApi = WIKTIONARY_APIS.en;
  const localApi = WIKTIONARY_APIS[langCode];
  const route = [];

  const enCandidates = await gatherWiktionaryCandidates(enApi, raw, langCode);

  for (const title of enCandidates) {
    route.push(`en:${title}`);
    const html = await fetchWiktionaryHTMLFrom(enApi, title);
    if (!html) continue;

    const ipa = extractIPAFromEnglishWiktionaryHTML(html, langCode);

    if (ipa) {
      const result = {
        ipa,
        title,
        source: `en.wiktionary.org/wiki/${encodeURIComponent(title)}`,
        route
      };

      ipaCache.set(key, result);
      return result;
    }
  }

  if (localApi && localApi !== enApi) {
    const localCandidates = await gatherWiktionaryCandidates(localApi, raw, langCode);

    for (const title of localCandidates) {
      route.push(`${langCode}:${title}`);
      const html = await fetchWiktionaryHTMLFrom(localApi, title);
      if (!html) continue;

      const ipa = extractIPAFromLocalWiktionaryHTML(html, langCode);

      if (ipa) {
        const result = {
          ipa,
          title,
          source: `${langCode}.wiktionary.org/wiki/${encodeURIComponent(title)}`,
          route
        };

        ipaCache.set(key, result);
        return result;
      }
    }
  }

  return { ipa: "", title: "", source: "", route };
}

const TRANSLATION_LANG_NAMES = {
  de: ["German", "Deutsch"],
  fr: ["French", "Français"],
  es: ["Spanish", "Español"],
  it: ["Italian", "Italiano"],
  ru: ["Russian", "Русский"],
  el: ["Greek", "Modern Greek", "Ελληνικά"]
};

async function getEnglishLemma(sourceWord, sourceLang) {
  const raw = String(sourceWord || "").trim();

  if (sourceLang === "en") {
    return {
      word: raw,
      source: "input",
      route: ["input:English"]
    };
  }

  const cacheKey = `english:${sourceLang}:${raw}`;
  if (translationCache.has(cacheKey)) return translationCache.get(cacheKey);

  const enApi = WIKTIONARY_APIS.en;
  const localApi = WIKTIONARY_APIS[sourceLang];
  const route = [];

  const enCandidates = await gatherWiktionaryCandidates(enApi, raw, sourceLang);

  for (const title of enCandidates) {
    route.push(`en:${title}`);
    const html = await fetchWiktionaryHTMLFrom(enApi, title);
    if (!html) continue;

    const english = extractEnglishGlossFromEnglishWiktionary(html, sourceLang);
    if (english) {
      const result = {
        word: english,
        source: `en.wiktionary.org/wiki/${encodeURIComponent(title)}`,
        route
      };

      translationCache.set(cacheKey, result);
      return result;
    }
  }

  if (localApi && localApi !== enApi) {
    const localCandidates = await gatherWiktionaryCandidates(localApi, raw, sourceLang);

    for (const title of localCandidates) {
      route.push(`${sourceLang}:${title}`);
      const html = await fetchWiktionaryHTMLFrom(localApi, title);
      if (!html) continue;

      const english = extractEnglishTranslationFromLocalWiktionary(html);
      if (english) {
        const result = {
          word: english,
          source: `${sourceLang}.wiktionary.org/wiki/${encodeURIComponent(title)}`,
          route
        };

        translationCache.set(cacheKey, result);
        return result;
      }
    }
  }

  const result = { word: "", source: "", route };
  translationCache.set(cacheKey, result);

  return result;
}

function extractEnglishGlossFromEnglishWiktionary(html, sourceLang) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const section = getLanguageSection(doc, sourceLang);
  if (!section) return "";

  const definitionItems = [...section.querySelectorAll("ol > li")];

  for (const li of definitionItems) {
    const anchors = [...li.querySelectorAll("a")];

    for (const a of anchors) {
      const term = cleanTranslationTerm(a.textContent);
      if (isGoodEnglishLemma(term)) return term;
    }

    const fromText = extractEnglishLemmaFromText(li.textContent);
    if (fromText) return fromText;
  }

  return "";
}

function extractEnglishTranslationFromLocalWiktionary(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const text = normalizeWiktionaryText(doc.body ? doc.body.textContent : doc.textContent);

  const patterns = [
    /English\s*[:—-]\s*([A-Za-z][A-Za-z' -]{1,40})/i,
    /Английский\s*[:—-]\s*([A-Za-z][A-Za-z' -]{1,40})/i,
    /англ\.\s*([A-Za-z][A-Za-z' -]{1,40})/i
  ];

  for (const pattern of patterns) {
    const match = text.match(pattern);
    if (match) {
      const term = cleanTranslationTerm(match[1]);
      if (isGoodEnglishLemma(term)) return term;
    }
  }

  return "";
}

function extractEnglishLemmaFromText(text) {
  const cleaned = normalizeWiktionaryText(text)
    .replace(/\([^)]*\)/g, "")
    .replace(/\[[^\]]*\]/g, "");

  const firstPart = cleaned
    .split(/[.;:]/)[0]
    .replace(/^(a|an|the|to)\s+/i, "")
    .trim();

  const candidates = firstPart
    .split(/[,/]| or | and /i)
    .map(cleanTranslationTerm)
    .filter(isGoodEnglishLemma);

  return candidates[0] || "";
}

function isGoodEnglishLemma(term) {
  if (!term) return false;
  if (!/^[A-Za-z][A-Za-z' -]{0,40}$/.test(term)) return false;

  const banned = new Set([
    "IPA",
    "audio",
    "file",
    "appendix",
    "category",
    "wikipedia",
    "wiktionary",
    "edit",
    "citation"
  ]);

  return !banned.has(term.toLowerCase());
}

async function getTranslationsFromEnglishLemma(englishWord) {
  const key = `translations:en:${englishWord}`;
  if (translationCache.has(key)) return translationCache.get(key);

  const enApi = WIKTIONARY_APIS.en;
  const route = [];
  const result = {};

  const candidates = await gatherWiktionaryCandidates(enApi, englishWord, "en");

  for (const title of candidates) {
    route.push(`en:${title}`);
    const html = await fetchWiktionaryHTMLFrom(enApi, title);
    if (!html) continue;

    const extracted = extractTranslationsFromEnglishWiktionary(html);

    if (Object.keys(extracted).length > 0) {
      Object.assign(result, extracted);
      result.en = englishWord;

      const packed = { translations: result, source: `en.wiktionary.org/wiki/${encodeURIComponent(title)}`, route };
      translationCache.set(key, packed);

      return packed;
    }
  }

  result.en = englishWord;

  const packed = { translations: result, source: "", route };
  translationCache.set(key, packed);

  return packed;
}

function extractTranslationsFromEnglishWiktionary(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const section = getLanguageSection(doc, "en");
  if (!section) return {};

  const result = {};

  for (const lang of LANGS) {
    if (lang.code === "en") continue;

    const term = extractTranslationByLangAttribute(section, lang.code) ||
                 extractTranslationByLanguageLine(section, lang.code);

    if (term) result[lang.code] = term;
  }

  return result;
}

function extractTranslationByLangAttribute(section, langCode) {
  const roots = [
    ...section.querySelectorAll(".translations, .NavContent, table, ul, li")
  ];

  const searchRoots = roots.length ? roots : [section];

  for (const root of searchRoots) {
    const nodes = [
      ...root.querySelectorAll(`[lang|="${langCode}"], [xml\\:lang|="${langCode}"]`)
    ];

    for (const node of nodes) {
      const term = cleanTranslationTerm(node.textContent);
      if (isValidWordForLanguage(term, langCode)) return term;
    }
  }

  return "";
}

function extractTranslationByLanguageLine(section, langCode) {
  const names = TRANSLATION_LANG_NAMES[langCode] || [];
  const text = normalizeWiktionaryText(section.textContent || "");

  for (const name of names) {
    const pattern = new RegExp(`${escapeRegExp(name)}\\\\s*[:：]\\\\s*([^;\\\\n•]+)`, "i");
    const match = text.match(pattern);

    if (match) {
      const parts = match[1]
        .split(/[,;]/)
        .map(cleanTranslationTerm)
        .filter((term) => isValidWordForLanguage(term, langCode));

      if (parts[0]) return parts[0];
    }
  }

  return "";
}

function cleanTranslationTerm(text) {
  return String(text || "")
    .normalize("NFC")
    .replace(/\[[^\]]*\]/g, "")
    .replace(/\([^)]*\)/g, "")
    .replace(/[;:]/g, " ")
    .replace(/[“”"«»]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function isValidWordForLanguage(term, langCode) {
  if (!term) return false;

  const s = term.trim();

  if (s.length > 60) return false;
  if (/^(translation|translations|edit|show|hide)$/i.test(s)) return false;

  if (langCode === "ru") return /[а-яё]/i.test(s);
  if (langCode === "el") return /[\u0370-\u03ff]/.test(s);

  return /[A-Za-zÀ-ž]/.test(s);
}

const ALINE_OPTIONS = {
  mergePlainAffricates: true,
  mergeDiphthongs: false,
  gapPenalty: -0.65,
  expansionPenalty: -0.18,
  returnGapsInAlignment: true,
  maxAlignments: 1
};

function calcAlineSimilarity(ipaA, ipaB) {
  if (!window.ALINE) {
    throw new Error(t("sim.alineMissing"));
  }

  return ALINE.explain(ipaA, ipaB, ALINE_OPTIONS);
}

async function calcAllLanguages() {
  const runId = ++currentRunId;
  const rawWord = String(sourceWordInput.value || "").trim();
  const sourceLang = sourceLanguageSelect.value;

  multiResult.style.display = "block";
  combinedExplainBtn.style.display = "none";
  combinedExplanation = "";

  if (!rawWord) {
    multiResult.textContent = t("sim.fillWord");
    return;
  }

  multiResult.textContent = t("sim.searching");

  const sourceIPAResult = await getOnlineIPA(rawWord, sourceLang);
  const englishLemma = await getEnglishLemma(rawWord, sourceLang);

  if (runId !== currentRunId) return;

  if (!englishLemma.word) {
    renderMultiResult([{
      langCode: sourceLang,
      langName: LANG_NAMES[sourceLang],
      word: rawWord,
      ipa: sourceIPAResult.ipa || "",
      graphic: null,
      phonetic: null,
      general: null,
      status: "English lemma not found",
      source: sourceIPAResult.source || "",
      route: sourceIPAResult.route || []
    }]);

    combinedExplanation =
`Similaritá

Source word: ${rawWord}
Source language: ${LANG_NAMES[sourceLang]}
IPA: ${sourceIPAResult.ipa || t("sim.ipaNotFound")}

English equivalent was not found, therefore translations to the other six languages could not be extracted.`;

    combinedExplainBtn.style.display = "block";
    return;
  }

  const translationPack = await getTranslationsFromEnglishLemma(englishLemma.word);

  if (runId !== currentRunId) return;

  const sourceGraphic = normalizeGraphicInput(rawWord, sourceLang);
  const sourceIPA = sourceIPAResult.ipa || "";
  const rows = [];

  for (const lang of LANGS) {
    let targetWord = "";

    if (lang.code === sourceLang) {
      targetWord = rawWord;
    } else if (lang.code === "en") {
      targetWord = englishLemma.word;
    } else {
      targetWord = translationPack.translations[lang.code] || "";
    }

    if (!targetWord) {
      rows.push({
        langCode: lang.code,
        langName: lang.name,
        word: t("sim.translationNotFound"),
        ipa: "",
        graphic: null,
        phonetic: null,
        general: null,
        status: t("sim.translationNotFound"),
        source: "",
        route: []
      });
      continue;
    }

    const targetIPAResult = lang.code === sourceLang
      ? sourceIPAResult
      : await getOnlineIPA(targetWord, lang.code);

    if (runId !== currentRunId) return;

    const targetIPA = targetIPAResult.ipa || "";
    const targetGraphic = normalizeGraphicInput(targetWord, lang.code);

    let graphic = graphicSimilarity(sourceGraphic, targetGraphic);
    let phonetic = null;
    let general = null;
    let status = "";

    if (sourceIPA && targetIPA) {
      if (lang.code === sourceLang && normalize(targetWord) === normalize(rawWord)) {
        phonetic = 1;
      } else {
        const aline = calcAlineSimilarity(sourceIPA, targetIPA);
        phonetic = aline.normalized;
      }

      general = (graphic + phonetic) / 2;
    } else {
      status = t("sim.ipaNotFound");
    }

    rows.push({
      langCode: lang.code,
      langName: lang.name,
      word: targetWord,
      ipa: targetIPA,
      graphic,
      phonetic,
      general,
      status,
      source: targetIPAResult.source || "",
      route: targetIPAResult.route || []
    });
  }

  renderMultiResult(rows);
  buildExplanation(rawWord, sourceLang, sourceIPAResult, englishLemma, translationPack, rows);
  combinedExplainBtn.style.display = "block";
}

function renderMultiResult(rows) {
  multiResult.innerHTML = `
    <div class="result-table-wrap">
      <table class="result-table">
        <thead>
          <tr>
            <th>Language</th>
            <th>Word</th>
            <th>IPA</th>
            <th class="num">G</th>
            <th class="num">P</th>
            <th class="num">Total</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map((row) => `
            <tr>
              <td>${escapeHTML(row.langName)}</td>
              <td>${escapeHTML(row.word || "—")}</td>
              <td>${escapeHTML(row.ipa ? `/${row.ipa}/` : "—")}</td>
              <td class="num">${row.graphic === null ? "—" : formatScore(row.graphic)}</td>
              <td class="num">${row.phonetic === null ? "—" : formatScore(row.phonetic)}</td>
              <td class="num">${row.general === null ? "—" : formatScore(row.general)}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function buildExplanation(sourceWord, sourceLang, sourceIPAResult, englishLemma, translationPack, rows) {
  const rowText = rows.map((row) => {
    return `${row.langName}
Word: ${row.word || "—"}
IPA: ${row.ipa ? `/${row.ipa}/` : "—"}
Graphic: ${row.graphic === null ? "—" : formatScore(row.graphic)}
Phonetic: ${row.phonetic === null ? "—" : formatScore(row.phonetic)}
General: ${row.general === null ? "—" : formatScore(row.general)}
Source: ${row.source || "—"}
Route: ${row.route && row.route.length ? row.route.join(" → ") : "—"}`;
  }).join("\n\n");

  combinedExplanation =
`Similaritá

Source word: ${sourceWord}
Source language: ${LANG_NAMES[sourceLang]}
Source IPA: ${sourceIPAResult.ipa ? `/${sourceIPAResult.ipa}/` : t("sim.ipaNotFound")}
English lemma: ${englishLemma.word || "—"}
English lemma source: ${englishLemma.source || "—"}
Translation source: ${translationPack.source || "—"}

Formula:
general = (graphic similarity + phonetic similarity) / 2

${rowText}`;
}

function showExplain() {
  if (!combinedExplanation) return;

  const [title, ...restLines] = combinedExplanation.split("\n");

  explainText.innerHTML = "";

  const titleElement = document.createElement("h3");
  titleElement.className = "explain-title";
  titleElement.textContent = title.trim();

  const bodyElement = document.createElement("div");
  bodyElement.className = "explain-body";
  bodyElement.textContent = restLines.join("\n").trim();

  explainText.append(titleElement, bodyElement);
  explainModal.classList.add("show");
}

function closeExplain() {
  explainModal.classList.remove("show");
}

function debounce(fn, delay = 900) {
  let timer = null;

  return function (...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), delay);
  };
}

function formatScore(value) {
  return clamp01(value).toFixed(3);
}

function clamp01(x) {
  if (!Number.isFinite(x)) return 0;
  return Math.max(0, Math.min(1, x));
}

function escapeHTML(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeRegExp(value) {
  return String(value || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

const calcAllDebounced = debounce(() => {
  const word = String(sourceWordInput.value || "").trim();

  if (word.length >= 2) {
    calcAllLanguages().catch((error) => {
      multiResult.style.display = "block";
      multiResult.textContent = error.message || String(error);
      combinedExplainBtn.style.display = "none";
    });
  }
}, 900);

explainModal.onclick = function(e) {
  if (e.target === explainModal) {
    closeExplain();
  }
};

applyTranslations();

calcAllBtn.addEventListener("click", () => {
  calcAllLanguages().catch((error) => {
    multiResult.style.display = "block";
    multiResult.textContent = error.message || String(error);
    combinedExplainBtn.style.display = "none";
  });
});

sourceWordInput.addEventListener("input", calcAllDebounced);
sourceLanguageSelect.addEventListener("change", calcAllDebounced);
combinedExplainBtn.addEventListener("click", showExplain);
document.getElementById("closeExplainBtn").addEventListener("click", closeExplain);
resetBtn.addEventListener("click", resetAll);
document.addEventListener("interal:languagechange", applyTranslations);
</script>

<script src="../shared/ui.js"></script>
