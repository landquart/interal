function normalize(text){
    return String(text || "").trim().toLowerCase().normalize("NFC");
}

function levenshtein(a, b) {
    const n = a.length, m = b.length;
    const dp = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));

    for (let i = 0; i <= n; i++) dp[i][0] = i;
    for (let j = 0; j <= m; j++) dp[0][j] = j;

    for (let i = 1; i <= n; i++) {
        for (let j = 1; j <= m; j++) {
            let cost;
            if (a[i - 1] === b[j - 1]) {
                cost = 0;
            } else if (
                (i > 1 && a[i - 1] === b[j - 2]) ||
                (j > 1 && a[i - 2] === b[j - 1])
            ) {
                cost = 0.5;
            } else {
                cost = 1;
            }

            dp[i][j] = Math.min(
                dp[i - 1][j] + 1,
                dp[i][j - 1] + 1,
                dp[i - 1][j - 1] + cost
            );
        }
    }

    return dp[n][m];
}

function graphicSimilarity(a, b) {
    const d = levenshtein(a, b);
    const maxLen = Math.max(a.length, b.length);
    if (maxLen === 0) return 0;
    return clamp01(1 - d / maxLen);
}

const INTERAL_U_EXCEPTIONS = new Set([
  "authentic", "pausa", "haus", "audir", "aura", "fauna",
  "sauna", "caus", "applaudir", "laudar"
]);

const OPTIONAL_SILENT_INITIAL_H = new Set([
  "historia", "halleluya", "haver", "havet", "hallo", "halló",
  "hazard", "hysteria", "hystéria", "hotel", "honest", "homonym"
]);

const X_KZ_WORDS = new Set([
  "examen", "exámen", "exemple", "exercise", "exister"
]);

const INTERAL_VOWELS = new Set(["a", "e", "i", "o", "u", "y"]);

function stripInteralStressMarks(word) {
  return String(word || "")
    .normalize("NFC")
    .replace(/[áà]/g, "a")
    .replace(/[éè]/g, "e")
    .replace(/[íì]/g, "i")
    .replace(/[óò]/g, "o")
    .replace(/[úù]/g, "u");
}

function findExplicitInteralStressIndex(word) {
  const normalized = String(word || "").normalize("NFC");
  const stressChars = new Set(["á", "à", "é", "è", "í", "ì", "ó", "ò", "ú", "ù"]);

  for (let i = 0; i < normalized.length; i++) {
    if (stressChars.has(normalized[i])) return i;
  }

  return -1;
}

function isInteralVowel(ch) {
  return INTERAL_VOWELS.has(ch);
}

function isInteralConsonant(ch) {
  return /^[a-z]$/.test(ch) && !isInteralVowel(ch);
}

function lastVowelBefore(word, index) {
  for (let i = Math.min(index - 1, word.length - 1); i >= 0; i--) {
    if (isInteralVowel(word[i])) return i;
  }
  return -1;
}

function lastVowelIndex(word) {
  for (let i = word.length - 1; i >= 0; i--) {
    if (isInteralVowel(word[i])) return i;
  }
  return -1;
}

function calculateInteralStressIndex(input) {
  const raw = normalize(input);
  const explicit = findExplicitInteralStressIndex(raw);
  const word = stripInteralStressMarks(raw);

  if (explicit >= 0) return explicit;
  if (!word) return -1;

  if (word.endsWith("abil")) return word.lastIndexOf("abil");
  if (word.endsWith("ibil")) return word.lastIndexOf("ibil");

  if (word.endsWith("ita") || word.endsWith("ite")) return lastVowelIndex(word);
  if (word.endsWith("yer")) return word.length - 2;
  if (word.endsWith("eria")) return word.length - 2;

  const finalStressSuffixes = ["ic", "er", "or", "ing", "im", "um", "us", "is", "ul", "ix"];
  for (const suffix of finalStressSuffixes) {
    if (word.endsWith(suffix) && word.length > suffix.length + 1) {
      const index = lastVowelBefore(word, word.length - suffix.length);
      if (index >= 0) return index;
    }
  }

  const lastConsonant = [...word].map((ch, i) => isInteralConsonant(ch) ? i : -1).filter(i => i >= 0).pop();

  if (
    Number.isInteger(lastConsonant) &&
    lastConsonant > 1 &&
    word[lastConsonant - 1] === "u" &&
    isInteralVowel(word[lastConsonant - 2])
  ) {
    return lastConsonant - 2;
  }

  const consonantIndexes = [...word].map((ch, i) => isInteralConsonant(ch) ? i : -1).filter(i => i >= 0);
  if (consonantIndexes.length === 1) {
    const after = word.slice(consonantIndexes[0] + 1).split("").filter(isInteralVowel);
    if (after.length >= 2) {
      const vowelIndexes = [...word].map((ch, i) => isInteralVowel(ch) ? i : -1).filter(i => i >= 0);
      return vowelIndexes[vowelIndexes.length - 2] ?? -1;
    }
  }

  let stressBase = word;

  stressBase = stressBase
    .replace(/(es|im|en|em)$/u, "")
    .replace(/s$/u, "");

  const lastCons = [...stressBase].map((ch, i) => isInteralConsonant(ch) ? i : -1).filter(i => i >= 0).pop();

  if (Number.isInteger(lastCons)) {
    const index = lastVowelBefore(stressBase, lastCons);
    if (index >= 0) return index;
  }

  return lastVowelIndex(word);
}

function interalToIPA(input, options = {}) {
  const opts = {
    softC: "t͡s",
    hVariant: "x",
    jVariant: "ʒ",
    silentInitialH: true,
    silentUInQue: true,
    includeStress: false,
    ...options
  };

  const original = normalize(input);
  const word = stripInteralStressMarks(original);
  const stressIndex = opts.includeStress ? calculateInteralStressIndex(original) : -1;

  if (!word) return "";

  let ipa = "";
  let i = 0;

  function addIPA(sourceIndex, value) {
    if (sourceIndex === stressIndex && value && !ipa.endsWith("ˈ")) {
      ipa += "ˈ";
    }
    ipa += value;
  }

  while (i < word.length) {
    const rest = word.slice(i);
    const ch = word[i];
    const prev = word[i - 1] || "";
    const next = word[i + 1] || "";
    const next2 = word[i + 2] || "";

    if (
      i === 0 &&
      ch === "h" &&
      opts.silentInitialH &&
      isInteralVowel(next) &&
      OPTIONAL_SILENT_INITIAL_H.has(word)
    ) {
      i += 1;
      continue;
    }

    if (
      opts.silentUInQue &&
      ch === "q" &&
      (word === "que" || word === "quel" || word === "quelc")
    ) {
      addIPA(i, "k");
      i += 2;
      continue;
    }

    if (ch === "x" && X_KZ_WORDS.has(word)) {
      addIPA(i, "kz");
      i += 1;
      continue;
    }

    if (rest.startsWith("ch")) {
      addIPA(i, "t͡ɕ");
      i += 2;
      continue;
    }

    if (rest.startsWith("sh")) {
      addIPA(i, "ʂ");
      i += 2;
      continue;
    }

    if (rest.startsWith("ph")) {
      addIPA(i, "f");
      i += 2;
      continue;
    }

    if (rest.startsWith("rh")) {
      addIPA(i, "r");
      i += 2;
      continue;
    }

    if (rest.startsWith("th")) {
      addIPA(i, "t");
      i += 2;
      continue;
    }

    if (rest.startsWith("zz")) {
      addIPA(i, "t͡s");
      i += 2;
      continue;
    }

    if (rest.startsWith("qu")) {
      addIPA(i, "kw");
      i += 2;
      continue;
    }

    if (rest.startsWith("gu") && isInteralVowel(next2)) {
      addIPA(i, "gw");
      i += 2;
      continue;
    }

    if (ch === "t" && next === "i" && ["a", "e", "o", "u"].includes(next2)) {
      addIPA(i, "t͡s");
      i += 1;
      continue;
    }

    if (ch === "c") {
      addIPA(i, ["i", "e", "y"].includes(next) ? opts.softC : "k");
      i += 1;
      continue;
    }

    if (ch === "s" && isInteralVowel(prev) && isInteralVowel(next)) {
      addIPA(i, "z");
      i += 1;
      continue;
    }

    if (
      ch === "u" &&
      (prev === "a" || prev === "e") &&
      !INTERAL_U_EXCEPTIONS.has(word)
    ) {
      addIPA(i, "w");
      i += 1;
      continue;
    }

    if (ch === "y") {
      addIPA(i, (isInteralVowel(prev) || isInteralVowel(next)) ? "j" : "i");
      i += 1;
      continue;
    }

    switch (ch) {
      case "a": addIPA(i, "a"); break;
      case "b": addIPA(i, "b"); break;
      case "d": addIPA(i, "d"); break;
      case "e": addIPA(i, "e"); break;
      case "f": addIPA(i, "f"); break;
      case "g": addIPA(i, "g"); break;
      case "h": addIPA(i, opts.hVariant); break;
      case "i": addIPA(i, "i"); break;
      case "j": addIPA(i, opts.jVariant); break;
      case "k": addIPA(i, "k"); break;
      case "l": addIPA(i, "l"); break;
      case "m": addIPA(i, "m"); break;
      case "n": addIPA(i, "n"); break;
      case "o": addIPA(i, "o"); break;
      case "p": addIPA(i, "p"); break;
      case "q": addIPA(i, "k"); break;
      case "r": addIPA(i, "r"); break;
      case "s": addIPA(i, "s"); break;
      case "t": addIPA(i, "t"); break;
      case "u": addIPA(i, "u"); break;
      case "v": addIPA(i, "v"); break;
      case "w": addIPA(i, "w"); break;
      case "x": addIPA(i, "ks"); break;
      case "z": addIPA(i, "z"); break;
      default: addIPA(i, ch); break;
    }

    i += 1;
  }

  return ipa;
}

const WIKTIONARY_LANG_LABELS = {
  en: ["English"],
  de: ["German"],
  fr: ["French"],
  es: ["Spanish"],
  it: ["Italian"],
  ru: ["Russian"],
  el: ["Greek", "Modern Greek"]
};

const WIKTIONARY_LANG_NAMES = {
  en: "English",
  de: "German",
  fr: "French",
  es: "Spanish",
  it: "Italian",
  ru: "Russian",
  el: "Greek"
};

const ipaCache = new Map();

function wiktionaryCandidates(word, langCode) {
  const raw = String(word || "").trim();
  const lower = raw.toLowerCase();
  const candidates = [raw, lower];

  if (langCode === "de" && lower) {
    candidates.push(lower.charAt(0).toUpperCase() + lower.slice(1));
  }

  return [...new Set(candidates.filter(Boolean))];
}

async function fetchWiktionaryHTML(title) {
  const url =
    "https://en.wiktionary.org/w/api.php?" +
    new URLSearchParams({
      action: "parse",
      page: title,
      prop: "text",
      format: "json",
      origin: "*"
    });

  const response = await fetch(url);
  if (!response.ok) throw new Error("Wiktionary request failed");

  const data = await response.json();
  if (data.error) return "";

  return data.parse && data.parse.text ? data.parse.text["*"] : "";
}

function normalizeHeadingText(text) {
  return String(text || "")
    .replace(/\[edit\]/gi, "")
    .trim();
}

function extractIPAFromWiktionaryHTML(html, langCode) {
  const labels = WIKTIONARY_LANG_LABELS[langCode] || [];
  const doc = new DOMParser().parseFromString(html, "text/html");
  const headings = [...doc.querySelectorAll("h2")];

  const languageHeading = headings.find((h2) => {
    const headline = h2.querySelector(".mw-headline");
    const headingText = normalizeHeadingText(headline ? headline.textContent : h2.textContent);
    const headingId = (headline && headline.id) || h2.id || "";

    return labels.some((label) => {
      const normalizedId = label.replace(/\s+/g, "_");
      return headingText === label || headingId === normalizedId;
    });
  });

  if (!languageHeading) return "";

  const section = document.createElement("div");
  let node = languageHeading.nextElementSibling;

  while (node && node.tagName !== "H2") {
    section.appendChild(node.cloneNode(true));
    node = node.nextElementSibling;
  }

  const ipaElements = [...section.querySelectorAll(".IPA")];
  if (!ipaElements.length) return "";

  for (const element of ipaElements) {
    const ipa = cleanIPA(element.textContent);
    if (ipa) return ipa;
  }

  return "";
}

function cleanIPA(text) {
  let s = String(text || "")
    .trim()
    .normalize("NFC")
    .replace(/\s+/g, " ")
    .replace(/ɡ/g, "g")
    .replace(/:/g, "ː");

  const bracketed = s.match(/[\/\[]([^\/\]\[]+)[\/\]]/);
  if (bracketed) {
    s = bracketed[1];
  } else {
    s = s.replace(/^[\/\[]/, "").replace(/[\/\]]$/, "");
  }

  s = s
    .split(/[;,]/)[0]
    .replace(/^\s*IPA\s*:?\s*/i, "")
    .replace(/[()]/g, "")
    .trim();

  return s;
}

async function getOnlineIPA(word, langCode) {
  const key = `${langCode}:${String(word || "").trim()}`;
  if (ipaCache.has(key)) return ipaCache.get(key);

  for (const candidate of wiktionaryCandidates(word, langCode)) {
    const html = await fetchWiktionaryHTML(candidate);
    if (!html) continue;

    const ipa = extractIPAFromWiktionaryHTML(html, langCode);
    if (ipa) {
      const result = {
        ipa,
        title: candidate,
        source: `en.wiktionary.org/wiki/${encodeURIComponent(candidate)}`
      };
      ipaCache.set(key, result);
      return result;
    }
  }

  const result = { ipa: "", title: "", source: "" };
  ipaCache.set(key, result);
  return result;
}

const ALINE_OPTIONS = {
  mergePlainAffricates: true,
  mergeDiphthongs: false,
  gapPenalty: -0.65,
  expansionPenalty: -0.18,
  returnGapsInAlignment: true,
  maxAlignments: 1
};

function calcAlineSimilarity(ipaA, ipaB) {
  if (!window.ALINE) {
    throw new Error(t("sim.alineMissing"));
  }

  return ALINE.explain(ipaA, ipaB, ALINE_OPTIONS);
}

function formatScore(value) {
  return clamp01(value).toFixed(3);
}

function renderResult(rows, warning = "") {
  combinedResult.innerHTML = rows.map(([label, value]) => `
    <div class="result-row">
      <span>${escapeHTML(label)}</span>
      <span>${escapeHTML(value)}</span>
    </div>
  `).join("") + (warning ? `<div class="result-warning">${escapeHTML(warning)}</div>` : "");
}

function buildAlignmentText(alignment) {
  if (!alignment || !alignment.length) return t("sim.none");
  return alignment.map((pair) => `${pair[0]} ↔ ${pair[1]}`).join("\n");
}

async function calcCombined() {
  const interalWord = normalize(wordInteral.value);
  const otherWord = normalize(wordOther.value);
  const langCode = otherLanguage.value;
  const langName = WIKTIONARY_LANG_NAMES[langCode] || langCode;

  combinedResult.style.display = "block";
  combinedExplainBtn.style.display = "none";

  if (!interalWord || !otherWord) {
    combinedResult.textContent = t("sim.fillWords");
    combinedExplanation = "";
    return;
  }

  combinedResult.textContent = t("sim.searchingIpa");

  const graphic = graphicSimilarity(interalWord, otherWord);
  const interalIPA = interalToIPA(interalWord, { includeStress: false });
  const onlineIPA = await getOnlineIPA(otherWord, langCode);

  if (!onlineIPA.ipa) {
    renderResult([
      [t("sim.graphicTitle"), formatScore(graphic)],
      [t("sim.interalIpa"), `/${interalIPA}/`],
      [t("sim.otherIpa"), t("sim.wiktionaryNotFound")],
      [t("sim.language"), langName]
    ], t("sim.wiktionaryNotFound"));

    combinedExplanation =
`${t("sim.combinedTitle")}

${t("sim.graphicTitle")}
${t("sim.formula")}: 1 − (Levenshtein distance / max length)
${t("sim.result")}: ${formatScore(graphic)}

${t("sim.interalIpa")}: /${interalIPA}/
${t("sim.otherIpa")}: ${t("sim.wiktionaryNotFound")}
${t("sim.language")}: ${langName}

${t("sim.generalTitle")} не рассчитана, потому что Wiktionary не вернул IPA для второго слова.`;
    combinedExplainBtn.style.display = "block";
    return;
  }

  const aline = calcAlineSimilarity(interalIPA, onlineIPA.ipa);
  const phonetic = aline.normalized;
  const general = (graphic + phonetic) / 2;

  renderResult([
    [t("sim.graphicTitle"), formatScore(graphic)],
    [t("sim.interalIpa"), `/${interalIPA}/`],
    [t("sim.otherIpa"), `/${onlineIPA.ipa}/`],
    [t("sim.phoneticTitle"), formatScore(phonetic)],
    [t("sim.generalTitle"), formatScore(general)]
  ]);

  const alignment = aline.alignments && aline.alignments[0] ? aline.alignments[0] : [];

  combinedExplanation =
`${t("sim.combinedTitle")}

${t("sim.graphicTitle")}
${t("sim.formula")}: 1 − (Levenshtein distance / max length)
Interal: ${interalWord}
${langName}: ${otherWord}
${t("sim.result")}: ${formatScore(graphic)}

${t("sim.interalIpa")}
Interal → IPA по правилам чтения Interal (§42–58): /${interalIPA}/

${t("sim.otherIpa")}
${langName} → IPA из Wiktionary: /${onlineIPA.ipa}/
${t("sim.source")}: ${onlineIPA.source}

${t("sim.phoneticTitle")}
Метод: ALINE
${t("sim.tokens")} Interal: ${aline.tokensA.join(" ")}
${t("sim.tokens")} ${langName}: ${aline.tokensB.join(" ")}

${t("sim.alignment")}:
${buildAlignmentText(alignment)}

${t("sim.unknownSegments")} Interal: ${aline.unknownA.length ? aline.unknownA.join(", ") : t("sim.none")}
${t("sim.unknownSegments")} ${langName}: ${aline.unknownB.length ? aline.unknownB.join(", ") : t("sim.none")}

${t("sim.result")}: ${formatScore(phonetic)}

${t("sim.generalTitle")}
${t("sim.formula")}: (${t("sim.graphicTitle")} + ${t("sim.phoneticTitle")}) / 2
(${formatScore(graphic)} + ${formatScore(phonetic)}) / 2 = ${formatScore(general)}
`;

  combinedExplainBtn.style.display = "block";
}

function showExplain(){
  if (!combinedExplanation) return;

  const [title, ...restLines] = combinedExplanation.split("\n");

  explainText.innerHTML = "";

  const titleElement = document.createElement("h3");
  titleElement.className = "explain-title";
  titleElement.textContent = title.trim();

  const bodyElement = document.createElement("div");
  bodyElement.className = "explain-body";
  bodyElement.textContent = restLines.join("\n").trim();

  explainText.append(titleElement, bodyElement);
  explainModal.classList.add("show");
}

function closeExplain(){
    explainModal.classList.remove("show");
}

function clamp01(x) {
  if (!Number.isFinite(x)) return 0;
  return Math.max(0, Math.min(1, x));
}

function escapeHTML(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

// Закрытие модального при клике вне окна
explainModal.onclick = function(e){
    if(e.target === explainModal){
        closeExplain();
    }
};

applyTranslations();

document.getElementById("calcCombinedBtn").addEventListener("click", () => {
  calcCombined().catch((error) => {
    combinedResult.style.display = "block";
    combinedResult.textContent = error.message || String(error);
    combinedExplainBtn.style.display = "none";
  });
});
document.getElementById("combinedExplainBtn").addEventListener("click", showExplain);
document.getElementById("closeExplainBtn").addEventListener("click", closeExplain);
document.addEventListener("interal:languagechange", applyTranslations);
</script>
<script src="../shared/ui.js"></script>
