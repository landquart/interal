<head>

<style>

.similarita-page {
    margin: 0;
    padding: 0 16px 32px;
    background-color: var(--bg);
    min-height: 100vh;
    color: var(--text);
    font-family: "Jost", "Helvetica Neue", Helvetica, Arial, sans-serif;
    line-height: 1.5;
}

.similarita-page.has-global-menu { padding-top: 86px; }

@media (max-width: 768px) {
    .similarita-page {
        padding-left: 12px;
        padding-right: 12px;
        padding-bottom: 24px;
    }
    .similarita-page.has-global-menu { padding-top: 86px; }
}

.similarita-page .card {
    background: var(--surface);
    border: 1px solid var(--border-subtle);
    max-width: 520px;
    margin: 0 auto 20px auto;
    padding: 24px;
    border-radius: var(--radius-lg);
}

.similarita-page .card h2 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 14px;
    letter-spacing: 0.2px;
    font-weight: 600;
    color: var(--text);
}

.similarita-page .card > h2 { font-size: 1.25rem; }

.similarita-page label {
    display: block;
    margin-top: 14px;
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 600;
}

.similarita-page input,
.similarita-page select {
    width: 100%;
    padding: 11px 12px;
    margin-top: 6px;
    font-size: 16px;
    box-sizing: border-box;
    border: 1px solid var(--border-control);
    border-radius: var(--radius-md);
    background: var(--surface-elevated);
    color: var(--text);
}
.similarita-page input::placeholder { color: var(--placeholder); }
.similarita-page input:focus-visible,
.similarita-page select:focus-visible {
    border-color: var(--border-strong);
}

.similarita-page .tool-btn {
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2px;
    background: var(--button-primary-bg);
    color: var(--button-primary-text);
    border: 1px solid var(--button-primary-bg);
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.similarita-page .tool-btn:hover,
.similarita-page .tool-btn:focus-visible {
    transform: translateY(-1px);
}
.similarita-page .tool-btn:focus-visible {
    outline: 2px solid var(--focus-outline);
    outline-offset: 2px;
}
.similarita-page .actions-row { display:flex; gap:10px; margin-top:16px; }
.similarita-page .actions-row .tool-btn { margin-top:0; }
.similarita-page .icon-btn-square { width:48px; min-width:48px; padding:0; display:inline-flex; align-items:center; justify-content:center; }

.similarita-page .result {
    margin-top: 14px;
    padding: 10px 12px;
    font-size: 15px;
    border-radius: var(--radius-md);
    background: var(--surface-elevated);
    border: 1px solid var(--border-subtle);
    color: var(--text);
}

.similarita-page .result-row {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    padding: 4px 0;
}

.similarita-page .result-row span:first-child {
    color: var(--text-muted);
    font-weight: 600;
}

.similarita-page .result-row span:last-child {
    text-align: right;
    overflow-wrap: anywhere;
}

.similarita-page .result-warning {
    margin-top: 8px;
    color: var(--text-muted);
    font-size: 14px;
}

.similarita-page ul { padding-left: 18px; }
.similarita-page #explainText { font-family: "Jost", "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; margin-bottom: 20px; }
.similarita-page .explain-title { margin: 0 0 14px; text-align: center; font-size: 1.6rem; font-weight: 800; line-height: 1.2; }
.similarita-page .explain-body { margin: 0; white-space: pre-wrap; }
.similarita-page .modal-inner {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
}
.similarita-page #explainModal {
    position: fixed;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: var(--z-page-modal);
}
.similarita-page #explainModal.show { opacity: 1; pointer-events: auto; }

body.dark-theme .similarita-page #explainModal {
    background: rgba(0, 0, 0, 0.62);
}
.similarita-page .info-card p, .similarita-page .info-card li { color: var(--text); font-size: 14px; }
.similarita-page .info-card a { color: var(--text); }

function resetAll() {

  wordOther.value = "";
  otherLanguage.value = "en";

  combinedResult.innerHTML = "";
  combinedExplainBtn.style.display = "none";
  combinedExplanation = "";

function normalize(text){
    return String(text || "").trim().toLowerCase().normalize("NFC");
}

function stripDiacritics(text) {
  return String(text || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .normalize("NFC");
}

function levenshtein(a, b) {
    const n = a.length, m = b.length;
    const dp = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));

    for (let i = 0; i <= n; i++) dp[i][0] = i;
    for (let j = 0; j <= m; j++) dp[0][j] = j;

    for (let i = 1; i <= n; i++) {
        for (let j = 1; j <= m; j++) {
            let cost;
            if (a[i - 1] === b[j - 1]) {
                cost = 0;
            } else if (
                (i > 1 && a[i - 1] === b[j - 2]) ||
                (j > 1 && a[i - 2] === b[j - 1])
            ) {
                cost = 0.5;
            } else {
                cost = 1;
            }

            dp[i][j] = Math.min(
                dp[i - 1][j] + 1,
                dp[i][j - 1] + 1,
                dp[i - 1][j - 1] + cost
            );
        }
    }

    return dp[n][m];
}

function graphicSimilarity(a, b) {
    const d = levenshtein(a, b);
    const maxLen = Math.max(a.length, b.length);
    if (maxLen === 0) return 0;
    return clamp01(1 - d / maxLen);
}

/*
 * Graphic transliteration for Russian and Greek.
 * This is used only for graphic similarity, not for Wiktionary IPA lookup.
 * IPA lookup should use the original spelling where possible.
 */
const RU_TO_LATIN = {
  "а": "a",
  "б": "b",
  "в": "v",
  "г": "g",
  "д": "d",
  "е": "je",
  "ё": "jo",
  "ж": "zh",
  "з": "z",
  "и": "i",
  "й": "j",
  "к": "k",
  "л": "l",
  "м": "m",
  "н": "n",
  "о": "o",
  "п": "p",
  "р": "r",
  "с": "s",
  "т": "t",
  "у": "u",
  "ф": "f",
  "х": "h",
  "ц": "c",
  "ч": "ch",
  "ш": "sh",
  "щ": "shch",
  "ъ": "",
  "ы": "y",
  "ь": "'",
  "э": "e",
  "ю": "ju",
  "я": "ja"
};

function transliterateRussian(text) {
  return String(text || "")
    .toLowerCase()
    .normalize("NFC")
    .split("")
    .map((ch) => RU_TO_LATIN[ch] ?? ch)
    .join("");
}

function transliterateGreek(text) {
  let s = stripDiacritics(String(text || "").toLowerCase())
    .replace(/ς/g, "σ");

  /*
   * Frequent Modern Greek digraphs.
   * This is graphic transliteration for comparison with Latin forms,
   * not strict phonetic transcription.
   */
  s = s
    .replace(/αι/g, "e")
    .replace(/ει/g, "i")
    .replace(/οι/g, "i")
    .replace(/υι/g, "i")
    .replace(/ου/g, "u")
    .replace(/αυ/g, "av")
    .replace(/ευ/g, "ev")
    .replace(/ηυ/g, "iv")
    .replace(/μπ/g, "b")
    .replace(/ντ/g, "d")
    .replace(/γκ/g, "g")
    .replace(/γγ/g, "ng")
    .replace(/γχ/g, "nch")
    .replace(/γξ/g, "nx");

  const map = {
    "α": "a",
    "β": "v",
    "γ": "g",
    "δ": "d",
    "ε": "e",
    "ζ": "z",
    "η": "i",
    "θ": "th",
    "ι": "i",
    "κ": "k",
    "λ": "l",
    "μ": "m",
    "ν": "n",
    "ξ": "x",
    "ο": "o",
    "π": "p",
    "ρ": "r",
    "σ": "s",
    "τ": "t",
    "υ": "y",
    "φ": "f",
    "χ": "ch",
    "ψ": "ps",
    "ω": "o"
  };

  return s.split("").map((ch) => map[ch] ?? ch).join("");
}

function normalizeGraphicInput(word, langCode) {
  const normalized = normalize(word);

  if (langCode === "ru") return transliterateRussian(normalized);
  if (langCode === "el") return transliterateGreek(normalized);

  return stripDiacritics(normalized)
    .replace(/ß/g, "ss")
    .replace(/æ/g, "ae")
    .replace(/œ/g, "oe")
    .replace(/ø/g, "o")
    .replace(/ð/g, "d")
    .replace(/þ/g, "th")
    .replace(/ł/g, "l");
}

function hasCyrillic(text) {
  return /[а-яё]/i.test(text);
}

function hasGreek(text) {
  return /[\u0370-\u03ff]/.test(text);
}

function lookupWarningForInput(word, langCode) {
  if (langCode === "ru" && !hasCyrillic(word)) {
    return "Для более точного поиска IPA русского слова в Wiktionary лучше вводить слово кириллицей.";
  }

  if (langCode === "el" && !hasGreek(word)) {
    return "Для более точного поиска IPA греческого слова в Wiktionary лучше вводить слово греческим письмом.";
  }

  return "";
}

const INTERAL_U_EXCEPTIONS = new Set([
  "authentic", "pausa", "haus", "audir", "aura", "fauna",
  "sauna", "caus", "applaudir", "laudar"
]);

const OPTIONAL_SILENT_INITIAL_H = new Set([
  "historia", "halleluya", "haver", "havet", "hallo", "halló",
  "hazard", "hysteria", "hystéria", "hotel", "honest", "homonym"
]);

const X_KZ_WORDS = new Set([
  "examen", "exámen", "exemple", "exercise", "exister"
]);

const INTERAL_VOWELS = new Set(["a", "e", "i", "o", "u", "y"]);

function stripInteralStressMarks(word) {
  return String(word || "")
    .normalize("NFC")
    .replace(/[áà]/g, "a")
    .replace(/[éè]/g, "e")
    .replace(/[íì]/g, "i")
    .replace(/[óò]/g, "o")
    .replace(/[úù]/g, "u");
}

function findExplicitInteralStressIndex(word) {
  const normalized = String(word || "").normalize("NFC");
  const stressChars = new Set(["á", "à", "é", "è", "í", "ì", "ó", "ò", "ú", "ù"]);

  for (let i = 0; i < normalized.length; i++) {
    if (stressChars.has(normalized[i])) return i;
  }

  return -1;
}

function isInteralVowel(ch) {
  return INTERAL_VOWELS.has(ch);
}

function isInteralConsonant(ch) {
  return /^[a-z]$/.test(ch) && !isInteralVowel(ch);
}

function lastVowelBefore(word, index) {
  for (let i = Math.min(index - 1, word.length - 1); i >= 0; i--) {
    if (isInteralVowel(word[i])) return i;
  }
  return -1;
}

function lastVowelIndex(word) {
  for (let i = word.length - 1; i >= 0; i--) {
    if (isInteralVowel(word[i])) return i;
  }
  return -1;
}

function calculateInteralStressIndex(input) {
  const raw = normalize(input);
  const explicit = findExplicitInteralStressIndex(raw);
  const word = stripInteralStressMarks(raw);

  if (explicit >= 0) return explicit;
  if (!word) return -1;

  if (word.endsWith("abil")) return word.lastIndexOf("abil");
  if (word.endsWith("ibil")) return word.lastIndexOf("ibil");

  if (word.endsWith("ita") || word.endsWith("ite")) return lastVowelIndex(word);
  if (word.endsWith("yer")) return word.length - 2;
  if (word.endsWith("eria")) return word.length - 2;

  const finalStressSuffixes = ["ic", "er", "or", "ing", "im", "um", "us", "is", "ul", "ix"];
  for (const suffix of finalStressSuffixes) {
    if (word.endsWith(suffix) && word.length > suffix.length + 1) {
      const index = lastVowelBefore(word, word.length - suffix.length);
      if (index >= 0) return index;
    }
  }

  const lastConsonant = [...word].map((ch, i) => isInteralConsonant(ch) ? i : -1).filter(i => i >= 0).pop();

  if (
    Number.isInteger(lastConsonant) &&
    lastConsonant > 1 &&
    word[lastConsonant - 1] === "u" &&
    isInteralVowel(word[lastConsonant - 2])
  ) {
    return lastConsonant - 2;
  }

  const consonantIndexes = [...word].map((ch, i) => isInteralConsonant(ch) ? i : -1).filter(i => i >= 0);
  if (consonantIndexes.length === 1) {
    const after = word.slice(consonantIndexes[0] + 1).split("").filter(isInteralVowel);
    if (after.length >= 2) {
      const vowelIndexes = [...word].map((ch, i) => isInteralVowel(ch) ? i : -1).filter(i => i >= 0);
      return vowelIndexes[vowelIndexes.length - 2] ?? -1;
    }
  }

  let stressBase = word;

  stressBase = stressBase
    .replace(/(es|im|en|em)$/u, "")
    .replace(/s$/u, "");

  const lastCons = [...stressBase].map((ch, i) => isInteralConsonant(ch) ? i : -1).filter(i => i >= 0).pop();

  if (Number.isInteger(lastCons)) {
    const index = lastVowelBefore(stressBase, lastCons);
    if (index >= 0) return index;
  }

  return lastVowelIndex(word);
}

function interalToIPA(input, options = {}) {
  const opts = {
    softC: "t͡s",
    hVariant: "x",
    jVariant: "ʒ",
    silentInitialH: true,
    silentUInQue: true,
    includeStress: false,
    ...options
  };

  const original = normalize(input);
  const word = stripInteralStressMarks(original);
  const stressIndex = opts.includeStress ? calculateInteralStressIndex(original) : -1;

  if (!word) return "";

  let ipa = "";
  let i = 0;

  function addIPA(sourceIndex, value) {
    if (sourceIndex === stressIndex && value && !ipa.endsWith("ˈ")) {
      ipa += "ˈ";
    }
    ipa += value;
  }

  while (i < word.length) {
    const rest = word.slice(i);
    const ch = word[i];
    const prev = word[i - 1] || "";
    const next = word[i + 1] || "";
    const next2 = word[i + 2] || "";

    if (
      i === 0 &&
      ch === "h" &&
      opts.silentInitialH &&
      isInteralVowel(next) &&
      OPTIONAL_SILENT_INITIAL_H.has(word)
    ) {
      i += 1;
      continue;
    }

    if (
      opts.silentUInQue &&
      ch === "q" &&
      (word === "que" || word === "quel" || word === "quelc")
    ) {
      addIPA(i, "k");
      i += 2;
      continue;
    }

    if (ch === "x" && X_KZ_WORDS.has(word)) {
      addIPA(i, "kz");
      i += 1;
      continue;
    }

    if (rest.startsWith("ch")) {
      addIPA(i, "t͡ɕ");
      i += 2;
      continue;
    }

    if (rest.startsWith("sh")) {
      addIPA(i, "ʂ");
      i += 2;
      continue;
    }

    if (rest.startsWith("ph")) {
      addIPA(i, "f");
      i += 2;
      continue;
    }

    if (rest.startsWith("rh")) {
      addIPA(i, "r");
      i += 2;
      continue;
    }

    if (rest.startsWith("th")) {
      addIPA(i, "t");
      i += 2;
      continue;
    }

    if (rest.startsWith("zz")) {
      addIPA(i, "t͡s");
      i += 2;
      continue;
    }

    if (rest.startsWith("qu")) {
      addIPA(i, "kw");
      i += 2;
      continue;
    }

    if (rest.startsWith("gu") && isInteralVowel(next2)) {
      addIPA(i, "gw");
      i += 2;
      continue;
    }

    if (ch === "t" && next === "i" && ["a", "e", "o", "u"].includes(next2)) {
      addIPA(i, "t͡s");
      i += 1;
      continue;
    }

    if (ch === "c") {
      addIPA(i, ["i", "e", "y"].includes(next) ? opts.softC : "k");
      i += 1;
      continue;
    }

    if (ch === "s" && isInteralVowel(prev) && isInteralVowel(next)) {
      addIPA(i, "z");
      i += 1;
      continue;
    }

    if (
      ch === "u" &&
      (prev === "a" || prev === "e") &&
      !INTERAL_U_EXCEPTIONS.has(word)
    ) {
      addIPA(i, "w");
      i += 1;
      continue;
    }

    if (ch === "y") {
      addIPA(i, (isInteralVowel(prev) || isInteralVowel(next)) ? "j" : "i");
      i += 1;
      continue;
    }

    switch (ch) {
      case "a": addIPA(i, "a"); break;
      case "b": addIPA(i, "b"); break;
      case "d": addIPA(i, "d"); break;
      case "e": addIPA(i, "e"); break;
      case "f": addIPA(i, "f"); break;
      case "g": addIPA(i, "g"); break;
      case "h": addIPA(i, opts.hVariant); break;
      case "i": addIPA(i, "i"); break;
      case "j": addIPA(i, opts.jVariant); break;
      case "k": addIPA(i, "k"); break;
      case "l": addIPA(i, "l"); break;
      case "m": addIPA(i, "m"); break;
      case "n": addIPA(i, "n"); break;
      case "o": addIPA(i, "o"); break;
      case "p": addIPA(i, "p"); break;
      case "q": addIPA(i, "k"); break;
      case "r": addIPA(i, "r"); break;
      case "s": addIPA(i, "s"); break;
      case "t": addIPA(i, "t"); break;
      case "u": addIPA(i, "u"); break;
      case "v": addIPA(i, "v"); break;
      case "w": addIPA(i, "w"); break;
      case "x": addIPA(i, "ks"); break;
      case "z": addIPA(i, "z"); break;
      default: addIPA(i, ch); break;
    }

    i += 1;
  }

  return ipa;
}

const WIKTIONARY_APIS = {
  en: "https://en.wiktionary.org/w/api.php",
  de: "https://de.wiktionary.org/w/api.php",
  fr: "https://fr.wiktionary.org/w/api.php",
  es: "https://es.wiktionary.org/w/api.php",
  it: "https://it.wiktionary.org/w/api.php",
  ru: "https://ru.wiktionary.org/w/api.php",
  el: "https://el.wiktionary.org/w/api.php"
};

const WIKTIONARY_LANG_LABELS = {
  en: ["English"],
  de: ["German"],
  fr: ["French"],
  es: ["Spanish"],
  it: ["Italian"],
  ru: ["Russian"],
  el: ["Greek", "Modern Greek"]
};

const WIKTIONARY_LANG_NAMES = {
  en: "English",
  de: "German",
  fr: "French",
  es: "Spanish",
  it: "Italian",
  ru: "Russian",
  el: "Greek"
};

const ipaCache = new Map();

function wiktionaryCandidates(word, langCode) {
  const raw = String(word || "").trim();
  const lower = raw.toLowerCase();
  const noDiacritics = stripDiacritics(raw);
  const candidates = [raw, lower, noDiacritics, stripDiacritics(lower)];

  if (langCode === "de" && lower) {
    candidates.push(lower.charAt(0).toUpperCase() + lower.slice(1));
    candidates.push(noDiacritics.charAt(0).toUpperCase() + noDiacritics.slice(1));
  }

  if (langCode === "ru") {
    const ruMap = {
      "e": ["е", "э"],
      "je": ["е"],
      "jo": ["ё"],
      "ju": ["ю"],
      "ja": ["я"],
      "zh": ["ж"],
      "shch": ["щ"],
      "sh": ["ш"],
      "ch": ["ч"],
      "c": ["ц"],
      "h": ["х"],
      "j": ["й"]
    };
    candidates.push(...reverseApproximateTransliteration(raw, ruMap));
  }

  if (langCode === "el") {
    const elMap = {
      "th": ["θ"],
      "ch": ["χ"],
      "ps": ["ψ"],
      "av": ["αυ"],
      "ev": ["ευ"],
      "iv": ["ηυ"],
      "ou": ["ου"],
      "u": ["ου"],
      "i": ["ι", "η", "υ", "ει", "οι"],
      "e": ["ε", "αι"],
      "o": ["ο", "ω"],
      "x": ["ξ"],
      "v": ["β"],
      "g": ["γ"],
      "d": ["δ", "ντ"],
      "b": ["μπ"]
    };
    candidates.push(...reverseApproximateTransliteration(raw, elMap));
  }

  return [...new Set(candidates.filter(Boolean))];
}

/*
 * Very small fallback for users who type Russian/Greek words in Latin letters.
 * It is not meant to be linguistically complete; it only increases the chance
 * of finding a Wiktionary page before the code reports failure.
 */
function reverseApproximateTransliteration(text, multiMap) {
  const base = String(text || "").trim().toLowerCase();
  if (!base || /[а-яё\u0370-\u03ff]/i.test(base)) return [];

  const singleRu = {
    a: "а", b: "б", v: "в", g: "г", d: "д", z: "з", i: "и", k: "к",
    l: "л", m: "м", n: "н", o: "о", p: "п", r: "р", s: "с", t: "т",
    u: "у", f: "ф", y: "ы"
  };

  const singleEl = {
    a: "α", v: "β", g: "γ", d: "δ", e: "ε", z: "ζ", i: "ι", k: "κ",
    l: "λ", m: "μ", n: "ν", o: "ο", p: "π", r: "ρ", s: "σ", t: "τ",
    y: "υ", f: "φ"
  };

  const singleMap = Object.values(multiMap).some((arr) => arr.some((x) => /[а-яё]/i.test(x))) ? singleRu : singleEl;
  const keys = Object.keys(multiMap).sort((a, b) => b.length - a.length);
  let results = [""];

  for (let i = 0; i < base.length;) {
    let matched = "";
    let values = [];

    for (const key of keys) {
      if (base.startsWith(key, i)) {
        matched = key;
        values = multiMap[key];
        break;
      }
    }

    if (matched) {
      results = expandCandidateList(results, values, 24);
      i += matched.length;
      continue;
    }

    const ch = base[i];
    results = expandCandidateList(results, [singleMap[ch] || ch], 24);
    i += 1;
  }

  return results;
}

function expandCandidateList(prefixes, additions, limit) {
  const out = [];
  for (const prefix of prefixes) {
    for (const addition of additions) {
      out.push(prefix + addition);
      if (out.length >= limit) return out;
    }
  }
  return out;
}

async function fetchWiktionaryHTMLFrom(apiUrl, title) {
  const url =
    apiUrl + "?" +
    new URLSearchParams({
      action: "parse",
      page: title,
      prop: "text",
      format: "json",
      origin: "*",
      redirects: "1"
    });

  const response = await fetch(url);
  if (!response.ok) return "";

  const data = await response.json();
  if (data.error) return "";

  return data.parse && data.parse.text ? data.parse.text["*"] : "";
}

async function searchWiktionaryTitles(apiUrl, word) {
  const url =
    apiUrl + "?" +
    new URLSearchParams({
      action: "opensearch",
      search: word,
      limit: "10",
      namespace: "0",
      format: "json",
      origin: "*"
    });

  const response = await fetch(url);
  if (!response.ok) return [];

  const data = await response.json();
  return Array.isArray(data[1]) ? data[1] : [];
}

async function fullTextWiktionarySearch(apiUrl, word) {
  const url =
    apiUrl + "?" +
    new URLSearchParams({
      action: "query",
      list: "search",
      srsearch: word,
      srlimit: "10",
      srnamespace: "0",
      format: "json",
      origin: "*"
    });

  const response = await fetch(url);
  if (!response.ok) return [];

  const data = await response.json();
  const items = data.query && Array.isArray(data.query.search) ? data.query.search : [];
  return items.map((item) => item.title).filter(Boolean);
}

function normalizeHeadingText(text) {
  return String(text || "")
    .replace(/\[edit\]/gi, "")
    .replace(/\s+/g, " ")
    .trim();
}

function getLanguageSection(doc, langCode) {
  const labels = WIKTIONARY_LANG_LABELS[langCode] || [];
  const headings = [...doc.querySelectorAll("h2, .mw-heading2")];

  const heading = headings.find((el) => {
    const headline = el.querySelector(".mw-headline");
    const headingText = normalizeHeadingText(headline ? headline.textContent : el.textContent);
    const headingId = (headline && headline.id) || el.id || "";

    return labels.some((label) => {
      const normalizedId = label.replace(/\s+/g, "_");
      return headingText === label || headingId === normalizedId;
    });
  });

  if (!heading) return null;

  const sectionWrapper = heading.closest("section");
  if (sectionWrapper) return sectionWrapper;

  const section = document.createElement("div");
  let node = heading.nextElementSibling;

  while (node) {
    const isNextLanguageHeading =
      node.tagName === "H2" ||
      node.classList.contains("mw-heading2") ||
      !!node.querySelector(":scope > h2");

    if (isNextLanguageHeading) break;

    section.appendChild(node.cloneNode(true));
    node = node.nextElementSibling;
  }

  return section;
}

function extractIPAFromEnglishWiktionaryHTML(html, langCode) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const section = getLanguageSection(doc, langCode);
  return extractFirstIPAFromElement(section);
}

function extractIPAFromLocalWiktionaryHTML(html, langCode) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const section = getLanguageSection(doc, langCode);
  return extractFirstIPAFromElement(section) || extractFirstIPAFromElement(doc);
}

function extractFirstIPAFromElement(root) {
  if (!root) return "";

  const ipaElements = [
    ...root.querySelectorAll(".IPA, [class~='IPA'], [class*='IPA']")
  ];

  for (const element of ipaElements) {
    const ipa = cleanIPA(element.textContent);
    if (ipa) return ipa;
  }

  const text = normalizeWiktionaryText(root.textContent || "");

  const patterns = [
    /IPA[^/\[]*([/\[][^/\]\[]+[/\]])/i,
    /МФА[^/\[]*([/\[][^/\]\[]+[/\]])/i,
    /Aussprache[^/\[]*([/\[][^/\]\[]+[/\]])/i,
    /Prononciation[^/\[]*([/\[][^/\]\[]+[/\]])/i,
    /Pronunciaci[oó]n[^/\[]*([/\[][^/\]\[]+[/\]])/i,
    /Pronuncia[^/\[]*([/\[][^/\]\[]+[/\]])/i,
    /Προφορά[^/\[]*([/\[][^/\]\[]+[/\]])/i,
    /([/\[][\u0250-\u02AF\u1D00-\u1D7F\u0300-\u036F.a-zɡβðθχʁʃʒʂʐɕʑçʝŋɲʎɾʋˈˌːˑ͜͡ʲʷʰʱ̯̩̥̬̪̠̟̃]+[/\]])/i
  ];

  for (const pattern of patterns) {
    const match = text.match(pattern);
    if (match) {
      const ipa = cleanIPA(match[1]);
      if (ipa) return ipa;
    }
  }

  return "";
}

function normalizeWiktionaryText(text) {
  return String(text || "")
    .replace(/\s+/g, " ")
    .replace(/\u00a0/g, " ")
    .trim();
}

function cleanIPA(text) {
  let s = String(text || "")
    .trim()
    .normalize("NFC")
    .replace(/\s+/g, " ")
    .replace(/ɡ/g, "g")
    .replace(/:/g, "ː");

  const bracketed = s.match(/[\/\[]([^\/\]\[]+)[\/\]]/);
  if (bracketed) {
    s = bracketed[1];
  } else {
    s = s.replace(/^[\/\[]/, "").replace(/[\/\]]$/, "");
  }

  s = s
    .split(/[;,]/)[0]
    .replace(/^\s*IPA\s*:?\s*/i, "")
    .replace(/^\s*МФА\s*:?\s*/i, "")
    .replace(/[()]/g, "")
    .replace(/^\s*[-–—]\s*/, "")
    .trim();

  return s;
}

async function gatherWiktionaryCandidates(apiUrl, word, langCode) {
  const exact = wiktionaryCandidates(word, langCode);
  const open = await searchWiktionaryTitles(apiUrl, word);
  const full = await fullTextWiktionarySearch(apiUrl, word);

  return [...new Set([...exact, ...open, ...full].filter(Boolean))].slice(0, 36);
}

async function getOnlineIPA(word, langCode) {
  const raw = String(word || "").trim();
  const key = `${langCode}:${raw}`;

  if (ipaCache.has(key)) return ipaCache.get(key);

  const enApi = WIKTIONARY_APIS.en;
  const localApi = WIKTIONARY_APIS[langCode];
  const route = [];

  const enCandidates = await gatherWiktionaryCandidates(enApi, raw, langCode);

  for (const title of enCandidates) {
    route.push(`en:${title}`);
    const html = await fetchWiktionaryHTMLFrom(enApi, title);
    if (!html) continue;

    const ipa = extractIPAFromEnglishWiktionaryHTML(html, langCode);

    if (ipa) {
      const result = {
        ipa,
        title,
        source: `en.wiktionary.org/wiki/${encodeURIComponent(title)}`,
        route
      };

      ipaCache.set(key, result);
      return result;
    }
  }

  if (localApi && localApi !== enApi) {
    const localCandidates = await gatherWiktionaryCandidates(localApi, raw, langCode);

    for (const title of localCandidates) {
      route.push(`${langCode}:${title}`);
      const html = await fetchWiktionaryHTMLFrom(localApi, title);
      if (!html) continue;

      const ipa = extractIPAFromLocalWiktionaryHTML(html, langCode);

      if (ipa) {
        const result = {
          ipa,
          title,
          source: `${langCode}.wiktionary.org/wiki/${encodeURIComponent(title)}`,
          route
        };

        ipaCache.set(key, result);
        return result;
      }
    }
  }

  return { ipa: "", title: "", source: "", route };
}

const ALINE_OPTIONS = {
  mergePlainAffricates: true,
  mergeDiphthongs: false,
  gapPenalty: -0.65,
  expansionPenalty: -0.18,
  returnGapsInAlignment: true,
  maxAlignments: 1
};

function calcAlineSimilarity(ipaA, ipaB) {
  if (!window.ALINE) {
    throw new Error(t("sim.alineMissing"));
  }

  return ALINE.explain(ipaA, ipaB, ALINE_OPTIONS);
}

function formatScore(value) {
  return clamp01(value).toFixed(3);
}

function renderResult(rows, warning = "") {
  combinedResult.innerHTML = rows.map(([label, value]) => `
    <div class="result-row">
      <span>${escapeHTML(label)}</span>
      <span>${escapeHTML(value)}</span>
    </div>
  `).join("") + (warning ? `<div class="result-warning">${escapeHTML(warning)}</div>` : "");
}

function buildAlignmentText(alignment) {
  if (!alignment || !alignment.length) return t("sim.none");
  return alignment.map((pair) => `${pair[0]} ↔ ${pair[1]}`).join("\n");
}

async function calcCombined() {
  const interalWord = normalize(wordInteral.value);
  const otherWordRaw = String(wordOther.value || "").trim();
  const otherWord = normalize(otherWordRaw);
  const langCode = otherLanguage.value;
  const langName = WIKTIONARY_LANG_NAMES[langCode] || langCode;
  const lookupWarning = lookupWarningForInput(otherWordRaw, langCode);

  combinedResult.style.display = "block";
  combinedExplainBtn.style.display = "none";

  if (!interalWord || !otherWord) {
    combinedResult.textContent = t("sim.fillWords");
    combinedExplanation = "";
    return;
  }

  combinedResult.textContent = t("sim.searchingIpa");

  const graphicInteral = normalizeGraphicInput(interalWord, "interal");
  const graphicOther = normalizeGraphicInput(otherWord, langCode);
  const graphic = graphicSimilarity(graphicInteral, graphicOther);

  const interalIPA = interalToIPA(interalWord, { includeStress: false });
  const onlineIPA = await getOnlineIPA(otherWordRaw, langCode);

  if (!onlineIPA.ipa) {
    renderResult([
      [t("sim.graphicTitle"), formatScore(graphic)],
      [t("sim.graphicInteral"), graphicInteral],
      [t("sim.graphicOther"), graphicOther],
      [t("sim.interalIpa"), `/${interalIPA}/`],
      [t("sim.otherIpa"), t("sim.wiktionaryNotFound")],
      [t("sim.language"), langName]
    ], lookupWarning || t("sim.wiktionaryNotFound"));

    combinedExplanation =
`${t("sim.combinedTitle")}

${t("sim.graphicTitle")}
${t("sim.formula")}: 1 − (Levenshtein distance / max length)
${t("sim.graphicInteral")}: ${graphicInteral}
${t("sim.graphicOther")}: ${graphicOther}
${t("sim.result")}: ${formatScore(graphic)}

${t("sim.interalIpa")}: /${interalIPA}/
${t("sim.otherIpa")}: ${t("sim.wiktionaryNotFound")}
${t("sim.language")}: ${langName}
${t("sim.lookupRoute")}: ${onlineIPA.route && onlineIPA.route.length ? onlineIPA.route.join(" → ") : t("sim.none")}
${lookupWarning ? `${t("sim.lookupWarning")}: ${lookupWarning}` : ""}

${t("sim.generalTitle")} не рассчитана, потому что Wiktionary не вернул IPA для второго слова.`;
    combinedExplainBtn.style.display = "block";
    return;
  }

  const aline = calcAlineSimilarity(interalIPA, onlineIPA.ipa);
  const phonetic = aline.normalized;
  const general = (graphic + phonetic) / 2;

  renderResult([
    [t("sim.graphicTitle"), formatScore(graphic)],
    [t("sim.interalIpa"), `/${interalIPA}/`],
    [t("sim.otherIpa"), `/${onlineIPA.ipa}/`],
    [t("sim.phoneticTitle"), formatScore(phonetic)],
    [t("sim.generalTitle"), formatScore(general)]
  ], lookupWarning);

  const alignment = aline.alignments && aline.alignments[0] ? aline.alignments[0] : [];

  combinedExplanation =
`${t("sim.combinedTitle")}

${t("sim.graphicTitle")}
${t("sim.formula")}: 1 − (Levenshtein distance / max length)
Interal: ${interalWord}
${langName}: ${otherWordRaw}
${t("sim.graphicInteral")}: ${graphicInteral}
${t("sim.graphicOther")}: ${graphicOther}
${t("sim.result")}: ${formatScore(graphic)}

${t("sim.interalIpa")}
Interal → IPA по правилам чтения Interal (§42–58): /${interalIPA}/

${t("sim.otherIpa")}
${langName} → IPA из Wiktionary: /${onlineIPA.ipa}/
${t("sim.source")}: ${onlineIPA.source}
${t("sim.lookupRoute")}: ${onlineIPA.route && onlineIPA.route.length ? onlineIPA.route.join(" → ") : t("sim.none")}
${lookupWarning ? `${t("sim.lookupWarning")}: ${lookupWarning}` : ""}

${t("sim.phoneticTitle")}
Метод: ALINE
${t("sim.tokens")} Interal: ${aline.tokensA.join(" ")}
${t("sim.tokens")} ${langName}: ${aline.tokensB.join(" ")}

${t("sim.alignment")}:
${buildAlignmentText(alignment)}

${t("sim.unknownSegments")} Interal: ${aline.unknownA.length ? aline.unknownA.join(", ") : t("sim.none")}
${t("sim.unknownSegments")} ${langName}: ${aline.unknownB.length ? aline.unknownB.join(", ") : t("sim.none")}

${t("sim.result")}: ${formatScore(phonetic)}

${t("sim.generalTitle")}
${t("sim.formula")}: (${t("sim.graphicTitle")} + ${t("sim.phoneticTitle")}) / 2
(${formatScore(graphic)} + ${formatScore(phonetic)}) / 2 = ${formatScore(general)}
`;

  combinedExplainBtn.style.display = "block";
}

function showExplain(){
  if (!combinedExplanation) return;

  const [title, ...restLines] = combinedExplanation.split("\n");

  explainText.innerHTML = "";

  const titleElement = document.createElement("h3");
  titleElement.className = "explain-title";
  titleElement.textContent = title.trim();

  const bodyElement = document.createElement("div");
  bodyElement.className = "explain-body";
  bodyElement.textContent = restLines.join("\n").trim();

  explainText.append(titleElement, bodyElement);
  explainModal.classList.add("show");
}

function closeExplain(){
    explainModal.classList.remove("show");
}

function clamp01(x) {
  if (!Number.isFinite(x)) return 0;
  return Math.max(0, Math.min(1, x));
}

function escapeHTML(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

// Закрытие модального при клике вне окна
explainModal.onclick = function(e){
    if(e.target === explainModal){
        closeExplain();
    }
};

applyTranslations();

document.getElementById("calcCombinedBtn").addEventListener("click", () => {
  calcCombined().catch((error) => {
    combinedResult.style.display = "block";
    combinedResult.textContent = error.message || String(error);
    combinedExplainBtn.style.display = "none";
  });
});
resetBtn.addEventListener("click", resetAll);
document.getElementById("combinedExplainBtn").addEventListener("click", showExplain);
document.getElementById("closeExplainBtn").addEventListener("click", closeExplain);
document.addEventListener("interal:languagechange", applyTranslations);
