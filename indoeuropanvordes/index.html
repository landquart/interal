<body class="interal-tool-page internationalita-page" data-page-state="off">

  });

async function getCreatedAt() {
  try {
    const response = await fetch(CREATED_AT_ENDPOINT, { cache: "no-cache" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const data = await response.json();
    const value = typeof data === "string"
      ? data
      : data?.created_at || data?.createdAt || data?.now || data?.timestamp;
    const date = new Date(value);

    if (!value || Number.isNaN(date.getTime())) {
      throw new Error("Invalid server timestamp");
    }

    return {
      created_at: String(value),
      created_at_source: "server"
    };
  } catch (error) {
    console.warn("created_at server fallback:", error);
    return {
      created_at: new Date().toISOString(),
      created_at_source: "device"
    };
  }
}

function normalizeTelegramContact(value) {
  const raw = String(value || "").trim();
  if (!raw) return "";

  const noProtocol = raw
    .replace(/^https?:\/\//i, "")
    .replace(/^t\.me\//i, "")
    .replace(/^@/, "")
    .replace(/\/$/, "");

  return `https://t.me/${noProtocol}`;
}

function normalizeEmailContact(value) {
  const raw = String(value || "").trim();
  if (!raw) return "";
  return raw.toLowerCase().startsWith("mailto:") ? raw : `mailto:${raw}`;
}

function getAuthorBlock() {
  if (!useAuthorBlock.checked) return null;

  const displayName = authorDisplayName.value.trim();
  const contact = authorContactValue.value.trim();

  if (!displayName && !contact) {
    throw new Error("Укажите имя/ник или контакт, либо отключите авторство.");
  }

  const author = {};
  if (displayName) author.display_name = displayName;

  if (contact) {
    let url = contact;
    if (authorContactType.value === "telegram") url = normalizeTelegramContact(contact);
    if (authorContactType.value === "email") url = normalizeEmailContact(contact);

    author.contacts = [
      {
        type: authorContactType.value,
        url
      }
    ];
  }

  return author;
}

function finiteOrNull(value) {
  return Number.isFinite(value) ? value : null;
}

function makePhoneticBlock(row) {
  const phonetic = {
    score: finiteOrNull(row.phonetic)
  };

  if (row.aline) {
    const tokensA = Array.isArray(row.aline.tokensA) ? row.aline.tokensA : [];
    const tokensB = Array.isArray(row.aline.tokensB) ? row.aline.tokensB : [];

    if (Number.isFinite(row.aline.score)) {
      phonetic.raw_score = row.aline.score;
    }

    phonetic.max_length = Math.max(tokensA.length, tokensB.length);
    phonetic.tokens_interal = tokensA;
    phonetic.tokens_language = tokensB;
  }

  return phonetic;
}

const JSON_CARD_WRAPPER_LIMIT = 4096;
const JSON_CARD_START_MARKER = "/card";
const JSON_CARD_END_MARKER = "/done";

function formatGeneratedJsonCard(card) {

    },
    translation: {

      word: translationWord
    },
    ...(author ? { author } : {}),
    supported_groups: Array.isArray(payload.supportedGroups) ? payload.supportedGroups : [],
    calculation: {
      pi_percent: finiteOrNull(payload.formalPI),
      weighted_sum: finiteOrNull(payload.weightedSum),

    },

      };

        speaker_contribution: finiteOrNull(row.contribution),

      };
    })
  };

  return card;
}

function normalize(text) {
  return String(text || "").trim().toLowerCase().normalize("NFC");
}

function stripDiacritics(text) {
  return String(text || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .normalize("NFC");
}

function stripInteralStressMarks(word) {
  return String(word || "")
    .normalize("NFC")
    .replace(/[áà]/g, "a")
    .replace(/[éè]/g, "e")
    .replace(/[íì]/g, "i")
    .replace(/[óò]/g, "o")
    .replace(/[úù]/g, "u");
}

function transliterateRussian(text) {
  return String(text || "")
    .toLowerCase()
    .normalize("NFC")
    .split("")
    .map((ch) => RU_TO_LATIN[ch] ?? ch)
    .join("");
}

function transliterateGreek(text) {
  let s = stripDiacritics(String(text || "").toLowerCase()).replace(/ς/g, "σ");

  s = s
    .replace(/αι/g, "e")
    .replace(/ει/g, "i")
    .replace(/οι/g, "i")
    .replace(/υι/g, "i")
    .replace(/ου/g, "u")
    .replace(/αυ/g, "av")
    .replace(/ευ/g, "ev")
    .replace(/ηυ/g, "iv")
    .replace(/μπ/g, "b")
    .replace(/ντ/g, "d")
    .replace(/γκ/g, "g")
    .replace(/γγ/g, "ng")
    .replace(/γχ/g, "nch")
    .replace(/γξ/g, "nx");

  const map = {
    "α": "a", "β": "v", "γ": "g", "δ": "d", "ε": "e", "ζ": "z",
    "η": "i", "θ": "th", "ι": "i", "κ": "k", "λ": "l", "μ": "m",
    "ν": "n", "ξ": "x", "ο": "o", "π": "p", "ρ": "r", "σ": "s",
    "τ": "t", "υ": "y", "φ": "f", "χ": "ch", "ψ": "ps", "ω": "o"
  };

  return s.split("").map((ch) => map[ch] ?? ch).join("");
}

function normalizeGraphicInput(word, langCode) {
  const normalized = normalize(word);

  if (langCode === "interal") return stripInteralStressMarks(normalized);
  if (langCode === "ru") return transliterateRussian(normalized);
  if (langCode === "el") return transliterateGreek(normalized);

  return normalized
    .replace(/ß/g, "ss")
    .replace(/æ/g, "ae")
    .replace(/œ/g, "oe")
    .replace(/ð/g, "d")
    .replace(/þ/g, "th")
    .replace(/ł/g, "l");
}

function isInteralVowel(ch) {
  return INTERAL_VOWELS.has(ch);
}

function interalToIPA(input) {
  const original = normalize(input);
  const word = stripInteralStressMarks(original);

  if (!word) return "";

  let ipa = "";
  let i = 0;

  while (i < word.length) {
    const rest = word.slice(i);
    const ch = word[i];
    const prev = word[i - 1] || "";
    const next = word[i + 1] || "";
    const next2 = word[i + 2] || "";

    if (i === 0 && ch === "h" && isInteralVowel(next) && OPTIONAL_SILENT_INITIAL_H.has(word)) {
      i += 1;
      continue;
    }

    if (ch === "q" && (word === "que" || word === "quel" || word === "quelc")) {
      ipa += "k";
      i += 2;
      continue;
    }

    if (ch === "x" && X_KZ_WORDS.has(word)) {
      ipa += "kz";
      i += 1;
      continue;
    }

    if (rest.startsWith("ch")) {
      ipa += "t͡ɕ";
      i += 2;
      continue;
    }

    if (rest.startsWith("sh")) {
      ipa += "ʂ";
      i += 2;
      continue;
    }

    if (rest.startsWith("ph")) {
      ipa += "f";
      i += 2;
      continue;
    }

    if (rest.startsWith("rh")) {
      ipa += "r";
      i += 2;
      continue;
    }

    if (rest.startsWith("th")) {
      ipa += "t";
      i += 2;
      continue;
    }

    if (rest.startsWith("zz")) {
      ipa += "t͡s";
      i += 2;
      continue;
    }

    if (rest.startsWith("qu")) {
      ipa += "kw";
      i += 2;
      continue;
    }

    if (rest.startsWith("gu") && isInteralVowel(next2)) {
      ipa += "gw";
      i += 2;
      continue;
    }

    if (ch === "t" && next === "i" && ["a", "e", "o", "u"].includes(next2)) {
      ipa += "t͡s";
      i += 1;
      continue;
    }

    if (ch === "c") {
      ipa += ["i", "e", "y"].includes(next) ? "t͡s" : "k";
      i += 1;
      continue;
    }

    if (ch === "s" && isInteralVowel(prev) && isInteralVowel(next)) {
      ipa += "z";
      i += 1;
      continue;
    }

    if (ch === "u" && (prev === "a" || prev === "e") && !INTERAL_U_EXCEPTIONS.has(word)) {
      ipa += "w";
      i += 1;
      continue;
    }

    if (ch === "y") {
      ipa += (isInteralVowel(prev) || isInteralVowel(next)) ? "j" : "i";
      i += 1;
      continue;
    }

    switch (ch) {
      case "a": ipa += "a"; break;
      case "b": ipa += "b"; break;
      case "d": ipa += "d"; break;
      case "e": ipa += "e"; break;
      case "f": ipa += "f"; break;
      case "g": ipa += "g"; break;
      case "h": ipa += "x"; break;
      case "i": ipa += "i"; break;
      case "j": ipa += "ʒ"; break;
      case "k": ipa += "k"; break;
      case "l": ipa += "l"; break;
      case "m": ipa += "m"; break;
      case "n": ipa += "n"; break;
      case "o": ipa += "o"; break;
      case "p": ipa += "p"; break;
      case "q": ipa += "k"; break;
      case "r": ipa += "r"; break;
      case "s": ipa += "s"; break;
      case "t": ipa += "t"; break;
      case "u": ipa += "u"; break;
      case "v": ipa += "v"; break;
      case "w": ipa += "w"; break;
      case "x": ipa += "ks"; break;
      case "z": ipa += "z"; break;
      default: ipa += ch; break;
    }

    i += 1;
  }

  return ipa;
}

function interalIPAForAline(word) {
  return interalToIPA(word)
    .replace(/t͡ɕ/g, "t͡ʃ")
    .replace(/ʂ/g, "ʃ")
    .replace(/x/g, "h");
}

const SIMILAR_GRAPHIC_COST = 0.5;

function pairKey(a, b) {
  return `${a}\u0000${b}`;
}

function makeSymmetricPairs(pairs) {
  const set = new Set();

  for (const [a, b] of pairs) {
    set.add(pairKey(a, b));
    set.add(pairKey(b, a));
  }

  return set;
}

const SIMILAR_GRAPHIC_PAIRS = makeSymmetricPairs([
  // Диакритические варианты в немецком, французском, испанском, итальянском
  ["a", "á"], ["a", "à"], ["a", "â"], ["a", "ä"],
  ["e", "é"], ["e", "è"], ["e", "ê"], ["e", "ë"],
  ["i", "í"], ["i", "ì"], ["i", "î"], ["i", "ï"],
  ["o", "ó"], ["o", "ò"], ["o", "ô"], ["o", "ö"],
  ["u", "ú"], ["u", "ù"], ["u", "û"], ["u", "ü"],
  ["y", "ý"], ["y", "ÿ"],
  ["n", "ñ"],
  ["c", "ç"],
]);

function baseLetter(ch) {
  return String(ch || "")
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "")
    .normalize("NFC");
}

function hasDiacritic(ch) {
  return String(ch || "").normalize("NFD") !== String(ch || "").normalize("NFC");
}

function graphicSubstitutionCost(aChar, bChar) {
  if (aChar === bChar) return 0;

  const aBase = baseLetter(aChar);
  const bBase = baseLetter(bChar);

  // u ~ ü, e ~ é, n ~ ñ и т. д.
  if (aBase && aBase === bBase && (hasDiacritic(aChar) || hasDiacritic(bChar))) {
    return SIMILAR_GRAPHIC_COST;
  }


  return 1;
}

function psychologicalLevenshtein(a, b) {
  const left = Array.from(String(a || ""));
  const right = Array.from(String(b || ""));
  const n = left.length;
  const m = right.length;

  const DELETE_COST = 1;
  const INSERT_COST = 1;
  const SUBSTITUTE_COST = 1;

  // Психологические поправки
  const SHIFTED_GAP_COST = 0.5;
  const TRANSPOSITION_COST = 0.5;

  const dp = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));

  for (let i = 0; i <= n; i++) dp[i][0] = i * DELETE_COST;
  for (let j = 0; j <= m; j++) dp[0][j] = j * INSERT_COST;

  for (let i = 1; i <= n; i++) {
    for (let j = 1; j <= m; j++) {
      const aChar = left[i - 1];
      const bChar = right[j - 1];

      const substitutionCost = graphicSubstitutionCost(aChar, bChar);

      // Обычный Левенштейн
      dp[i][j] = Math.min(
        dp[i - 1][j] + DELETE_COST,
        dp[i][j - 1] + INSERT_COST,
        dp[i - 1][j - 1] + substitutionCost
      );

      // Соседняя перестановка: ab ~ ba
      if (
        i > 1 &&
        j > 1 &&
        left[i - 1] === right[j - 2] &&
        left[i - 2] === right[j - 1]
      ) {
        dp[i][j] = Math.min(
          dp[i][j],
          dp[i - 2][j - 2] + TRANSPOSITION_COST
        );
      }

      // Лишняя буква в первом слове, которая сдвигает совпадение.
      // Например: aabc ~ abc.
      if (
        i > 1 &&
        left[i - 1] === right[j - 1]
      ) {
        dp[i][j] = Math.min(
          dp[i][j],
          dp[i - 2][j - 1] + SHIFTED_GAP_COST
        );
      }

      // Лишняя буква во втором слове, которая сдвигает совпадение.
      // Например: abc ~ aabc.
      if (
        j > 1 &&
        left[i - 1] === right[j - 1]
      ) {
        dp[i][j] = Math.min(
          dp[i][j],
          dp[i - 1][j - 2] + SHIFTED_GAP_COST
        );
      }
    }
  }

  return dp[n][m];
}

function graphicSimilarityDetails(a, b) {
  const source = String(a || "");
  const target = String(b || "");
  const maxLen = Math.max(Array.from(source).length, Array.from(target).length);

  if (maxLen === 0) {
    return null;
  }

  const d = psychologicalLevenshtein(source, target);
  const score = clamp01(1 - d / maxLen);

  return {
    source,
    target,
    distance: d,
    maxLen,
    score
  };
}

function graphicSimilarity(a, b) {
  const details = graphicSimilarityDetails(a, b);
  return details ? details.score : null;
}

function normalizeIPAForAline(ipa) {
  return String(ipa || "")
    .normalize("NFC")
    .replace(/[\/\[\]()]/g, "")
    .replace(/[ˈˌ.]/g, "")
    .replace(/ɡ/g, "g")
    .replace(/ɫ/g, "l")
    .trim();
}

function calcAlineSimilarity(ipaA, ipaB) {
  if (!window.ALINE) {
    throw new Error("Файл aline.js не подключён или не загрузился.");
  }

  const cleanA = normalizeIPAForAline(ipaA);
  const cleanB = normalizeIPAForAline(ipaB);

  if (!cleanA || !cleanB) return null;

  if (window.ALINE.explain) {
    const explanation = window.ALINE.explain(cleanA, cleanB, ALINE_OPTIONS);
    return {
      score: clamp01(explanation.normalized ?? explanation.similarity ?? 0),
      explanation
    };
  }

  if (window.ALINE.normalizedSimilarity) {
    return {
      score: clamp01(window.ALINE.normalizedSimilarity(cleanA, cleanB, ALINE_OPTIONS)),
      explanation: null
    };
  }

  throw new Error("Файл aline.js не содержит функции ALINE.normalizedSimilarity.");
}

async function safeFetchJSON(url) {
  try {
    const response = await fetch(url, { cache: "no-cache" });
    if (!response.ok) return null;
    return await response.json();
  } catch (error) {
    console.warn("JSON load error:", url, error);
    return null;
  }
}

async function loadPieVordes() {
  if (!pieVordesPromise) {
    pieVordesPromise = (async () => {
      const direct = await safeFetchJSON("./pie_vordes");
      if (direct && Array.isArray(direct.items)) return direct;

      const json = await safeFetchJSON("./pie_vordes.json");
      if (json && Array.isArray(json.items)) return json;

      return { languages: LANG_CODES, items: [] };
    })();
  }

  return pieVordesPromise;
}

function splitVariants(value) {
  if (!value) return [];

  if (Array.isArray(value)) {
    return value.flatMap(splitVariants);
  }

  if (typeof value === "object") {
    return splitVariants(value.word || value.words || value.form || value.forms || "");
  }

  return String(value)
    .split(/\s*\/\s*|,\s*|;\s*|\s+\|\s+/)
    .map((x) => x.trim())
    .filter(Boolean);
}

function getPieCell(item, langCode) {
  const cell = item && item[langCode];

  if (!cell) {
    return { words: [], ipa: "" };
  }

  if (typeof cell === "string") {
    return {
      words: splitVariants(cell),
      ipa: item.ipa && item.ipa[langCode] ? String(item.ipa[langCode]) : ""
    };
  }

  if (Array.isArray(cell)) {
    return {
      words: splitVariants(cell),
      ipa: item.ipa && item.ipa[langCode] ? String(item.ipa[langCode]) : ""
    };
  }

  if (typeof cell === "object") {
    return {
      words: splitVariants(cell.word || cell.words || cell.form || cell.forms || ""),
      ipa: String(cell.ipa || "")
    };
  }

  return { words: [], ipa: "" };
}

function getPieForms(item, langCode) {
  return getPieCell(item, langCode).words;
}

function getPieIPA(item, langCode) {
  const cell = getPieCell(item, langCode);
  if (cell.ipa) return cell.ipa;

  if (item && item.ipa && item.ipa[langCode]) {
    return String(item.ipa[langCode]);
  }

  return "";
}

function findPieRowByNationalWord(data, nationalWord, selectedLang) {
  const querySelected = normalizeGraphicInput(nationalWord, selectedLang);

  if (!querySelected) return null;

  for (const item of data.items || []) {
    const forms = getPieForms(item, selectedLang);

    for (const form of forms) {
      const normalizedForm = normalizeGraphicInput(form, selectedLang);

      if (normalizedForm && normalizedForm === querySelected) {
        return {
          item,
          matchedWord: form,
          matchedLang: selectedLang,
          method: "exact_selected_language",
          score: 1
        };
      }
    }
  }

  let bestInSelected = null;

  for (const item of data.items || []) {
    const forms = getPieForms(item, selectedLang);

    for (const form of forms) {
      const normalizedForm = normalizeGraphicInput(form, selectedLang);
      if (!normalizedForm) continue;

      const score = graphicSimilarity(querySelected, normalizedForm);

      if (!bestInSelected || score > bestInSelected.score) {
        bestInSelected = {
          item,
          matchedWord: form,
          matchedLang: selectedLang,
          method: "similar_selected_language",
          score
        };
      }
    }
  }

  if (bestInSelected && bestInSelected.score >= 0.86) {
    return bestInSelected;
  }

  return null;
}

async function fillRowsFromPieItem(item) {
  for (const lang of CONTROL_LANGUAGES) {
    const inputs = getRowInputs(lang.code);
    const forms = getPieForms(item, lang.code);

    inputs.word.value = forms[0] || "";
    inputs.ipa.value = ipa || "";

}

async function calculateInternationality() {
  lastCalculationPayload = null;
  jsonCardBtn.style.display = "none";
  jsonCardOutput.value = "";
  const interalWord = wordInput.value.trim();
  const semanticOk = true;
  const autoIpa = true;
  const supportThreshold = 0.4;
  const minPercent = 40;

  if (!interalWord) {
    showMessage("Введите гипотезу слова на Интерале.");
    return;
  }

  const lookupWord = lookupWordInput.value.trim();
  const lookupLang = lookupLangSelect.value;
  let matchedPieItem = null;

  if (lookupWord) {
    const data = await loadPieVordes();
    const rowMatch = findPieRowByNationalWord(data, lookupWord, lookupLang);

    if (rowMatch && rowMatch.item) {
      matchedPieItem = rowMatch.item;
      await fillRowsFromPieItem(rowMatch.item);
    } else {
      tableWrap.style.display = "block";
      showMessage("Строка в pie_vordes не найдена. Заполните таблицу вручную.");
      return;
    }
  } else {
    tableWrap.style.display = "block";
  }

  const signal = createRunSignal();
  clearScores();
  showMessage("Расчёт...");
  tableWrap.style.display = "block";

  try {
    const interalGraphic = normalizeGraphicInput(interalWord, "interal");
    const interalIPA = interalToIPA(interalWord);
    const interalIPAComparable = interalIPAForAline(interalWord);

    const rows = [];

    for (const lang of CONTROL_LANGUAGES) {
      const inputs = getRowInputs(lang.code);
      const word = inputs.word.value.trim();
      let ipa = inputs.ipa.value.trim();

      if (word && !ipa && autoIpa) {
        const found = await resolveIPA(word, lang.code, signal);
        ipa = found.ipa || "";
        if (ipa) inputs.ipa.value = ipa;
      }

      const nationalGraphic = normalizeGraphicInput(word, lang.code);
      const graphicDetails = word ? graphicSimilarityDetails(interalGraphic, nationalGraphic) : null;
      const graphic = graphicDetails ? graphicDetails.score : null;

      let phonetic = null;
      let general = null;
      let contribution = null;
      let aline = null;

      if (word && ipa && interalIPAComparable) {
        const result = calcAlineSimilarity(interalIPAComparable, ipa);

        if (result) {
          phonetic = result.score;
          aline = result.explanation;
        }
      }

      if (typeof graphic === "number" && typeof phonetic === "number") {
        general = (graphic + phonetic) / 2;
        contribution = lang.speakers * general;
      }

      rows.push({
        ...lang,
        word,
        ipa,
        nationalGraphic,
        graphic,
        graphicDetails,
        phonetic,
        general,
        contribution,
        aline
      });

      renderScoreIntoRow(lang.code, { graphic, phonetic, general, contribution });
    }

    const validRows = rows.filter((row) => typeof row.general === "number");
    const weightedSum = validRows.reduce((sum, row) => sum + row.contribution, 0);
    const availableSpeakers = validRows.reduce((sum, row) => sum + row.speakers, 0);
    const formalComplete = validRows.length === CONTROL_LANGUAGES.length;

    const formalPI = formalComplete ? (weightedSum / TOTAL_SPEAKERS) * 100 : null;
    const availablePI = availableSpeakers > 0 ? (weightedSum / availableSpeakers) * 100 : null;
    const lowerBoundPI = (weightedSum / TOTAL_SPEAKERS) * 100;

    const supportedGroups = [...new Set(
      rows
        .filter((row) => typeof row.general === "number" && row.general >= supportThreshold)
        .map((row) => row.group)
    )];

    const twoGroupsOk = supportedGroups.length >= 2;
    const thresholdOk = formalComplete ? formalPI >= minPercent : false;
    const accepted = formalComplete && thresholdOk && twoGroupsOk && semanticOk;

    const payload = {
      interalWord,
      interalGraphic,
      interalIPA,
      interalIPAComparable,
      lookupWord,
      lookupLang,
      matchedPieItem,
      rows,
      validRows,
      weightedSum,
      totalSpeakers: TOTAL_SPEAKERS,
      availableSpeakers,
      formalComplete,
      formalPI,
      availablePI,
      lowerBoundPI,
      supportedGroups,
      supportThreshold,
      minPercent,
      semanticOk,
      twoGroupsOk,
      thresholdOk,
      accepted
    };

    lastCalculationPayload = payload;
    renderResult(payload);
    buildExplanation(payload);
    explainBtn.style.display = "block";
    jsonCardBtn.style.display = payload.accepted === true ? "block" : "none";
  } catch (error) {
    if (error && error.name === "AbortError") return;
    showMessage(escapeHTML(error.message || String(error)));
  }
}

function renderScoreIntoRow(langCode, data) {
  const tr = document.querySelector(`#languageRows tr[data-lang="${CSS.escape(langCode)}"]`);
  if (!tr) return;

  tr.querySelector(".score-g").textContent = formatScoreOrDash(data.graphic);
  tr.querySelector(".score-ph").textContent = formatScoreOrDash(data.phonetic);
  tr.querySelector(".score-s").textContent = formatScoreOrDash(data.general);
  tr.querySelector(".score-contribution").textContent =
    typeof data.contribution === "number" ? formatNumber(data.contribution) : "—";
}

async function resolveIPA(word, langCode, signal) {
  const fallback = IPA_FALLBACKS[langCode]?.[normalize(word)];

  if (fallback) {
    return {
      ipa: fallback,
      source: "local fallback"
    };
  }

  return getWiktionaryIPA(word, langCode, signal);
}

async function getWiktionaryIPA(word, langCode, signal) {
  const api = WIKTIONARY_APIS[langCode] || WIKTIONARY_APIS.en;
  const englishApi = WIKTIONARY_APIS.en;
  const candidates = [...new Set([
    ...wiktionaryCandidates(word, langCode),
    ...(await searchWiktionaryTitles(englishApi, word, signal)),
    ...(api !== englishApi ? await searchWiktionaryTitles(api, word, signal) : [])
  ])].slice(0, 28);

  for (const title of candidates) {
    const html = await fetchWiktionaryHTMLFrom(englishApi, title, signal);
    const variants = extractIPAsFromHTML(html, langCode);

    if (variants.length) {
      return {
        ipa: variants[0],
        source: `en.wiktionary.org/wiki/${encodeURIComponent(title)}`
      };
    }
  }

  if (api !== englishApi) {
    for (const title of candidates) {
      const html = await fetchWiktionaryHTMLFrom(api, title, signal);
      const variants = extractIPAsFromHTML(html, langCode);

      if (variants.length) {
        return {
          ipa: variants[0],
          source: `${langCode}.wiktionary.org/wiki/${encodeURIComponent(title)}`
        };
      }
    }
  }

  return {
    ipa: "",
    source: ""
  };
}

function wiktionaryCandidates(word, langCode) {
  const raw = String(word || "").trim();
  const lower = raw.toLowerCase();
  const noDiacritics = stripDiacritics(raw);

  const candidates = [raw, lower, noDiacritics, stripDiacritics(lower)];

  if (langCode === "de" && lower) {
    candidates.push(lower.charAt(0).toUpperCase() + lower.slice(1));
    candidates.push(noDiacritics.charAt(0).toUpperCase() + noDiacritics.slice(1));
  }

  return [...new Set(candidates.filter(Boolean))].slice(0, 20);
}

async function searchWiktionaryTitles(apiUrl, word, signal) {
  try {
    const url =
      apiUrl + "?" +
      new URLSearchParams({
        action: "opensearch",
        search: word,
        limit: "7",
        namespace: "0",
        format: "json",
        origin: "*"
      });

    const response = await fetch(url, { signal });
    if (!response.ok) return [];

    const data = await response.json();
    return Array.isArray(data[1]) ? data[1] : [];
  } catch (error) {
    if (error && error.name === "AbortError") throw error;
    return [];
  }
}

async function fetchWiktionaryHTMLFrom(apiUrl, title, signal) {
  try {
    const url =
      apiUrl + "?" +
      new URLSearchParams({
        action: "parse",
        page: title,
        prop: "text",
        format: "json",
        origin: "*",
        redirects: "1"
      });

    const response = await fetch(url, { signal });
    if (!response.ok) return "";

    const data = await response.json();
    if (data.error) return "";

    return data.parse && data.parse.text ? data.parse.text["*"] : "";
  } catch (error) {
    if (error && error.name === "AbortError") throw error;
    return "";
  }
}

function extractIPAsFromHTML(html, langCode) {
  if (!html) return [];

  const doc = new DOMParser().parseFromString(html, "text/html");
  const section = getLanguageSection(doc, langCode);

  return [
    ...extractIPAsFromElement(section),
    ...extractIPAsFromElement(doc)
  ].filter(onlyUnique);
}

function getLanguageSection(doc, langCode) {
  const labels = WIKTIONARY_LANG_LABELS[langCode] || [];
  const headings = [...doc.querySelectorAll("h2, .mw-heading2")];

  const heading = headings.find((el) => {
    const headline = el.querySelector(".mw-headline");
    const headingText = normalizeHeadingText(headline ? headline.textContent : el.textContent);
    const headingId = (headline && headline.id) || el.id || "";

    return labels.some((label) => {
      const normalizedId = label.replace(/\s+/g, "_");
      return headingText === label || headingId === normalizedId;
    });
  });

  if (!heading) return null;

  const sectionWrapper = heading.closest("section");
  if (sectionWrapper) return sectionWrapper;

  const section = document.createElement("div");
  let node = heading.nextElementSibling;

  while (node) {
    const isNextLanguageHeading =
      node.tagName === "H2" ||
      node.classList.contains("mw-heading2") ||
      !!node.querySelector(":scope > h2");

    if (isNextLanguageHeading) break;

    section.appendChild(node.cloneNode(true));
    node = node.nextElementSibling;
  }

  return section;
}

function normalizeHeadingText(text) {
  return String(text || "")
    .replace(/\[edit\]/gi, "")
    .replace(/\s+/g, " ")
    .trim();
}

function extractIPAsFromElement(root) {
  if (!root) return [];

  const result = [];
  const ipaElements = [...root.querySelectorAll(".IPA, [class~='IPA'], [class*='IPA']")];

  for (const element of ipaElements) {
    const ipa = cleanIPA(element.textContent);
    if (ipa) result.push(ipa);
  }

  const text = normalizeWiktionaryText(root.textContent || "");

  const patterns = [
    /IPA[^/\[]*([/\[][^/\]\[]+[/\]])/gi,
    /МФА[^/\[]*([/\[][^/\]\[]+[/\]])/gi,
    /Aussprache[^/\[]*([/\[][^/\]\[]+[/\]])/gi,
    /Prononciation[^/\[]*([/\[][^/\]\[]+[/\]])/gi,
    /Pronunciaci[oó]n[^/\[]*([/\[][^/\]\[]+[/\]])/gi,
    /Pronuncia[^/\[]*([/\[][^/\]\[]+[/\]])/gi,
    /Προφορά[^/\[]*([/\[][^/\]\[]+[/\]])/gi
  ];

  for (const pattern of patterns) {
    const matches = [...text.matchAll(pattern)];

    for (const match of matches) {
      const ipa = cleanIPA(match[1]);
      if (ipa) result.push(ipa);
    }
  }

  return [...new Set(result)];
}

function cleanIPA(text) {
  let s = String(text || "")
    .trim()
    .normalize("NFC")
    .replace(/\s+/g, " ")
    .replace(/ɡ/g, "g")
    .replace(/:/g, "ː");

  const bracketed = s.match(/[\/\[]([^\/\]\[]+)[\/\]]/);

  if (bracketed) {
    s = bracketed[1];
  } else {
    s = s.replace(/^[\/\[]/, "").replace(/[\/\]]$/, "");
  }

  s = s
    .split(/[;,]/)[0]
    .replace(/\([^)]*\)/g, "")
    .replace(/^\s*IPA\s*:?\s*/i, "")
    .replace(/^\s*МФА\s*:?\s*/i, "")
    .replace(/^\s*[-–—]\s*/, "")
    .trim();

  return s;
}

function normalizeWiktionaryText(text) {
  return String(text || "")
    .replace(/\u00a0/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

      .replace("{weightedSum}", escapeHTML(formatNumber(data.weightedSum)))

function getDecisionText(data) {
  const text = getTextGroup("decision");
  if (!data.formalComplete) {
    return text.incomplete;
  }

  if (!data.semanticOk) {
    return text.semantic;
  }

  if (!data.twoGroupsOk) {
    return text.groups;
  }

  if (!data.thresholdOk) {
    return text.threshold.replace("{minPercent}", formatPercent(data.minPercent));
  }

  return text.accepted;
}

function renderGraphicDetails(row) {

function renderPhoneticDetails(row) {
  if (!row.aline || !Number.isFinite(row.phonetic)) {

  }

  const tokensA = Array.isArray(row.aline.tokensA) ? row.aline.tokensA : [];
  const tokensB = Array.isArray(row.aline.tokensB) ? row.aline.tokensB : [];
  const raw = Number.isFinite(row.aline.score) ? row.aline.score : null;
  const maxLen = Math.max(tokensA.length, tokensB.length);
  const ph = row.phonetic;
  const t = getCalcDetailText;

  return `
    <details class="calc-details">
      <summary>${formatScore(ph)}</summary>
      <div class="calc-detail-box">
        <div><strong>${escapeHTML(t("ipaInteral"))}:</strong> /${escapeHTML(tokensA.join(" · "))}/</div>
        <div><strong>${escapeHTML(t("ipaLanguage"))}:</strong> /${escapeHTML(tokensB.join(" · "))}/</div>
        <div><strong>${escapeHTML(t("rawCalculation"))}:</strong> ${Number.isFinite(raw) ? formatNumber(raw) : "—"}</div>
        <div><strong>${escapeHTML(t("maxLength"))}:</strong> ${formatInteger(maxLen)}</div>
        <div><strong>${escapeHTML(t("formula"))}:</strong> pairScore = 2 × segmentSimilarity − 1<br>PH = (raw + maxLen) / (2 × maxLen)</div>

function currentLocale() {
  return getCurrentLanguage() === "en" ? "en-US" : "ru-RU";
}

function formatLocalizedNumber(value, options = {}) {
  if (!Number.isFinite(value)) return "—";
  return new Intl.NumberFormat(currentLocale(), options).format(value);
}

function formatScore(value) {
  if (!Number.isFinite(value)) return "0";
  return formatLocalizedNumber(clamp01(value), { maximumFractionDigits: 6 });
}

function formatScoreOrDash(value) {
  return Number.isFinite(value) ? formatScore(value) : "—";
}

function formatPercent(value) {
  if (!Number.isFinite(value)) return "—";
  return `${formatLocalizedNumber(value, { maximumFractionDigits: 6 })}%`;
}

function formatNumber(value) {
  return formatLocalizedNumber(value, { maximumFractionDigits: 6 });
}

function formatInteger(value) {
  return formatLocalizedNumber(value, { maximumFractionDigits: 0 });
}

function clamp01(x) {
  return clamp(x, 0, 1);
}

function clamp(x, min, max) {
  if (!Number.isFinite(x)) return min;
  return Math.max(min, Math.min(max, x));
}

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function onlyUnique(value, index, array) {
  return value && array.indexOf(value) === index;
}
